<!doctype html>
<html lang="bs" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ŠkolaPro</title>
<style>
:root{--bg:#f4f6fb;--surface:#fff;--surface2:#f8faff;--text:#0f172a;--muted:#64748b;--border:#e2e6ef;--shadow:0 6px 24px rgba(15,23,42,.07);--pri:#2563eb;--pri2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--radius:16px;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html[data-theme="dark"]{--bg:#0b1220;--surface:#111b30;--surface2:#0e1628;--text:#e4ecff;--muted:#8da0c4;--border:rgba(255,255,255,.09);--shadow:0 10px 40px rgba(0,0,0,.35);--pri:#6ea8fe;--pri2:#4f8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}
.wrap{max-width:1340px;margin:0 auto;padding:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:8px;z-index:10}
.brand{display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));opacity:.85}.brand h1{font-size:15px;margin:0}.brand .sub{font-size:11px;color:var(--muted);margin-top:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-size:11px;white-space:nowrap;background:var(--surface2)}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 10px;border-radius:12px;cursor:pointer;font-size:13px}.btn:hover{border-color:color-mix(in oklab,var(--pri) 40%,var(--border))}
.btn.pri{background:linear-gradient(180deg,color-mix(in oklab,var(--pri) 16%,var(--surface)),color-mix(in oklab,var(--pri2) 10%,var(--surface)));border-color:color-mix(in oklab,var(--pri) 40%,var(--border))}
.btn.sm{padding:5px 8px;border-radius:10px;font-size:12px}
.btn.ok{border-color:color-mix(in oklab,var(--ok) 35%,var(--border));background:color-mix(in oklab,var(--ok) 8%,var(--surface))}
.btn.warn{border-color:color-mix(in oklab,var(--warn) 35%,var(--border));background:color-mix(in oklab,var(--warn) 8%,var(--surface))}
.btn.bad{border-color:color-mix(in oklab,var(--bad) 35%,var(--border));background:color-mix(in oklab,var(--bad) 8%,var(--surface))}
.layout{display:grid;grid-template-columns:250px 1fr;gap:12px;margin-top:12px}
.sidebar{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;height:fit-content;position:sticky;top:72px}
.navTitle{font-size:11px;color:var(--muted);margin:4px 8px 8px;text-transform:uppercase;letter-spacing:.5px}
.navItem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;font-size:13px}
.navItem:hover{background:color-mix(in oklab,var(--pri) 6%,var(--surface))}
.navItem.active{background:color-mix(in oklab,var(--pri) 11%,var(--surface));border-color:color-mix(in oklab,var(--pri) 30%,var(--border))}
.navIcon{width:20px;text-align:center;font-size:14px;color:var(--muted)}.navLabel{font-weight:700;flex:1}
.content{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card h2{font-size:15px;margin:0 0 2px}.card h3{font-size:14px;margin:0 0 2px}.muted{color:var(--muted)}.sep{height:1px;background:var(--border);margin:10px 0}
label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:9px 10px;outline:none;font-size:13px}
textarea{min-height:80px;resize:vertical}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:13px}
th{font-size:11px;color:var(--muted);background:var(--surface2);text-transform:uppercase;letter-spacing:.3px}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono)}.right{display:flex;justify-content:flex-end;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.notice{border:1px solid var(--border);border-radius:12px;padding:9px 10px;background:color-mix(in oklab,var(--pri) 5%,var(--surface));color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:var(--surface2);margin-left:4px;white-space:nowrap}
.tag.warn{border-color:color-mix(in oklab,var(--warn) 35%,var(--border));background:color-mix(in oklab,var(--warn) 8%,var(--surface2));color:var(--warn)}
.tag.ok{border-color:color-mix(in oklab,var(--ok) 35%,var(--border));background:color-mix(in oklab,var(--ok) 8%,var(--surface2));color:var(--ok)}
.tag.bad{border-color:color-mix(in oklab,var(--bad) 35%,var(--border));background:color-mix(in oklab,var(--bad) 8%,var(--surface2));color:var(--bad)}
.tag.pri{border-color:color-mix(in oklab,var(--pri) 35%,var(--border));background:color-mix(in oklab,var(--pri) 8%,var(--surface2));color:var(--pri)}
.ttWrap{overflow:auto;border:1px solid var(--border);border-radius:14px}
.tt{min-width:960px;width:100%;background:var(--surface)}
.ttHead,.ttRow{display:grid;grid-template-columns:140px repeat(5,minmax(150px,1fr))}
.ttHead{position:sticky;top:0;z-index:1;border-bottom:1px solid var(--border)}
.ttHead>div{padding:8px 10px;border-right:1px solid var(--border);background:var(--surface2)}.ttHead>div:last-child{border-right:none}
.ttRow{border-bottom:1px solid var(--border)}.ttRow:last-child{border-bottom:none}
.ttTime{padding:8px 10px;border-right:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.ttCell{padding:8px;border-right:1px solid var(--border);min-height:76px}.ttCell:last-child{border-right:none}
.lesson{border:1px solid var(--border);border-radius:12px;padding:8px 9px;background:var(--surface);cursor:pointer;transition:border-color .15s}
.lesson:hover{border-color:color-mix(in oklab,var(--pri) 35%,var(--border))}
.lesson .title{font-weight:800;font-size:12px;line-height:1.2}.lesson .meta{font-size:11px;color:var(--muted);margin-top:3px}
.empty{color:color-mix(in oklab,var(--muted) 60%,transparent);font-size:11px}
.dnevnik{border:2px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
.dnevnik .dHeader{padding:12px 14px;border-bottom:2px solid var(--border)}
.dnevnik .dHeader h3{margin:0;font-size:15px}.dnevnik .dHeader .dMeta{font-size:12px;color:var(--muted);margin-top:4px}
.dnevnik table{border:none;border-radius:0}.dnevnik th{font-size:11px}
.dnevnik .attDot{width:12px;height:12px;border-radius:999px;display:inline-block;border:1px solid var(--border)}
.dnevnik .attDot.present{background:var(--ok)}.dnevnik .attDot.late{background:var(--warn)}.dnevnik .attDot.absent{background:var(--bad)}
.crossed{text-decoration:line-through;opacity:.5;margin-right:4px}
.gradeChip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);font-size:12px;margin:2px;cursor:pointer;background:var(--surface2)}
.gradeChip:hover{border-color:var(--pri)}
.gradeChip.neg{border-color:color-mix(in oklab,var(--bad) 40%,var(--border));color:var(--bad)}
.gradeChip.repaired{border-color:color-mix(in oklab,var(--ok) 40%,var(--border));color:var(--ok);font-weight:800}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(15,23,42,.4);z-index:50}
html[data-theme="dark"] .modal{background:rgba(0,0,0,.55)}
.modal.open{display:flex}
.modal .box{width:min(1120px,98vw);max-height:90vh;overflow:auto;border-radius:18px;border:1px solid var(--border);background:var(--surface);box-shadow:0 16px 50px rgba(0,0,0,.2);padding:14px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{position:static}.two,.three{grid-template-columns:1fr}.ttHead,.ttRow{grid-template-columns:130px repeat(5,240px)}}
</style>
</head>

<script>
firebase.initializeApp({apiKey:"AIzaSyBOG1TyQvTqBrljvaetqAiTT2SObYqKOe4",authDomain:"helloworld-d6cf3.firebaseapp.com",databaseURL:"https://helloworld-d6cf3-default-rtdb.firebaseio.com",projectId:"helloworld-d6cf3",storageBucket:"helloworld-d6cf3.firebasestorage.app",messagingSenderId:"5547576635",appId:"1:5547576635:web:3ae2abd72950da9a93fb1e"});

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function sha256(s){function r(n,x){return(x>>>n)|(x<<(32-n))}const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const m=[];for(let i=0;i<s.length;i++){let c=s.charCodeAt(i);if(c<128)m.push(c);else if(c<2048)m.push(192|(c>>6),128|(c&63));else m.push(224|(c>>12),128|((c>>6)&63),128|(c&63))}const l=m.length*8;m.push(128);while(m.length%64!==56)m.push(0);for(let i=7;i>=0;i--)m.push((l>>>(i*8))&255);const w=Array(64);for(let i=0;i<m.length;i+=64){for(let t=0;t<16;t++){const j=i+t*4;w[t]=((m[j]<<24)|(m[j+1]<<16)|(m[j+2]<<8)|m[j+3])>>>0}for(let t=16;t<64;t++){const s0=(r(7,w[t-15])^r(18,w[t-15])^(w[t-15]>>>3))>>>0;const s1=(r(17,w[t-2])^r(19,w[t-2])^(w[t-2]>>>10))>>>0;w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}let[a,b,c,d,e,f,g,h]=H;for(let t=0;t<64;t++){const S1=(r(6,e)^r(11,e)^r(25,e))>>>0;const ch=((e&f)^(~e&g))>>>0;const t1=(h+S1+ch+K[t]+w[t])>>>0;const S0=(r(2,a)^r(13,a)^r(22,a))>>>0;const mj=((a&b)^(a&c)^(b&c))>>>0;const t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0]}return H.map(x=>x.toString(16).padStart(8,'0')).join('')}

const E=s=>(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const uid=(p='id')=>p+'_'+Math.random().toString(16).slice(2)+'_'+Date.now().toString(16);
const now=()=>new Date().toISOString();
const isoD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromI=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>isoD(new Date());
const addD=(i,n)=>{const d=fromI(i);d.setDate(d.getDate()+n);return isoD(d)};
const wdN=i=>['Ned','Pon','Uto','Sri','Čet','Pet','Sub'][i]||'?';
const weekMon=i=>{const d=fromI(i);d.setDate(d.getDate()-(d.getDay()||7)+1);return isoD(d)};
const weekDs=i=>[0,1,2,3,4].map(n=>addD(weekMon(i),n));
const lk=(c,w,p)=>`${c}|${w}|${p}`;
const subCol=id=>{let h=0;for(const c of(id||''))h=(h*31+c.charCodeAt(0))>>>0;return`hsl(${h%360} 70% 44%)`};

const DB_PATH='/schoolDB';
const RT={ref:p=>firebase.database().ref(p),get:async p=>{const s=await RT.ref(p).get();return s.exists()?s.val():null},set:(p,v)=>RT.ref(p).set(v),on:(p,cb)=>RT.ref(p).on('value',s=>cb(s.exists()?s.val():null))};
const Sess={get(){try{return JSON.parse(sessionStorage.getItem('ss3')||'')}catch{return null}},set(s){sessionStorage.setItem('ss3',JSON.stringify(s))},clear(){sessionStorage.removeItem('ss3')}};

/* Domain helpers */
const D={
cn:(db,id)=>db.classes?.find(c=>c.id===id)?.name||'—',
sn:(db,id)=>db.subjects?.find(s=>s.id===id)?.name||'—',
rn:(db,id)=>db.rooms?.find(r=>r.id===id)?.name||'—',
tn:(db,id)=>{const u=db.users?.find(x=>x.id===id);return u?(u.fullName||u.username):'—'},
ub:(db,id)=>db.users?.find(u=>u.id===id)||null,
stc:(db,cid)=>(db.users||[]).filter(u=>u.role==='student'&&u.classId===cid).sort((a,b)=>(a.fullName||'').localeCompare(b.fullName||'')),
/* Active semester: first non-closed semester */
activeSem:(db)=>{const sems=db.settings?.semesters||[];return sems.find(s=>!s.closed)||sems[sems.length-1]||null},
semById:(db,id)=>(db.settings?.semesters||[]).find(s=>s.id===id)||null,
resolve:(db,dt,cid,wd,p,base)=>{const k=lk(cid,wd,p);const s=db.substitutions?.[dt]?.[k];if(s&&s.status==='accepted')return{tid:s.toTeacherId,sub:true};return{tid:base,sub:false}},
hasHW:(db,cid,dt)=>!!db.homework?.[cid]?.[dt]&&Object.keys(db.homework[cid][dt]).length>0,
hasRem:(db,uid,dt)=>{const r=db.reminders?.[uid]||{};return Object.values(r).some(x=>x.date===dt&&!x.done)},
gradesFor:(db,stId,subId)=>Object.entries(db.grades?.[stId]?.[subId]||{}).map(([id,g])=>({id,...g})).sort((a,b)=>(a.date||'').localeCompare(b.date||'')),
avgArr:arr=>arr.length?Math.round(arr.reduce((s,v)=>s+v,0)/arr.length*100)/100:null,
/* teacher's subjects */
teacherSubs:(db,tid)=>{const set=new Set();for(const c of(db.classes||[])){const sched=db.schedule?.[c.id]||{};for(const wd of Object.values(sched))for(const p of Object.values(wd||{}))if(p.teacherId===tid)set.add(p.subjectId)}return set},
};

let APP={db:null,st:{view:'login',date:today(),acp:null,theme:localStorage.getItem('t4')||'light'}};
const me=()=>{const s=Sess.get();return s?.uid?APP.db?.users?.find(u=>u.id===s.uid):null};
const setT=t=>{APP.st.theme=t;document.documentElement.setAttribute('data-theme',t);localStorage.setItem('t4',t)};

function seed(){

substitutions:{},attendance:{},absences:{},homework:{},homeworkByDue:{},grades:{},finalGrades:{},reminders:{}}}

function render(){setT(APP.st.theme);const db=APP.db;if(!db){$('#app').innerHTML='<div class="card notice">Učitavanje…</div>';return}$('#schoolName').textContent=db.settings?.schoolName||'ŠkolaPro';const u=me();$('#btnLogout').style.display=u?'inline-block':'none';$('#userPill').textContent=u?`${u.role}: ${u.username}`:'—';const as=D.activeSem(db);$('#semPill').textContent=as?`Aktivni: ${as.name}${as.closed?' ✓':''}`:'—';if(!u){APP.st.view='login';$('#app').innerHTML=`<div class="card" style="max-width:800px;margin:12px auto"><h2>Prijava</h2><div class="muted">admin/admin • prof1/prof1 • u1/u1</div><div class="sep"></div><div class="two"><div><label>Username</label><input id="li_u" placeholder="admin"/></div><div><label>Lozinka</label><input id="li_p" type="password"/></div></div><div class="row" style="margin-top:10px"><button class="btn pri" data-a="login">Prijavi se</button></div></div>`;return}if(APP.st.view==='login')APP.st.view=u.role==='admin'?'a-users':u.role==='teacher'?'t-week':'s-week';$('#app').innerHTML=buildShell(u);postRender(u)}

function buildShell(u){const nav=[];
if(u.role==='admin'){nav.push(['a-users','👤','Korisnici'],['a-data','📋','Podaci'],['a-periods','⏰','Periodi'],['a-schedule','📅','Raspored'],['a-semesters','📆','Semestri'],['a-finals','🎓','Zaključivanje'])}
if(u.role==='teacher'){nav.push(['t-week','📅','Sedmica'],['t-day','📋','Dan'],['t-subs','🔄','Zamjene'],['t-homework','📝','Zadaće'],['t-rem','🔔','Podsjetnici']);if(u.homeroomClassId)nav.push(['t-homeroom','🏠','Razrednik']);nav.push(['t-finals','🎓','Zaključivanje'])}
if(u.role==='student'){nav.push(['s-week','📅','Sedmica'],['s-day','📋','Dan'],['s-grades','📊','Ocjene'],['s-rem','🔔','Podsjetnici'])}

const d=APP.st.date,t=today();
return`<div class="layout"><div class="sidebar"><div class="navTitle">Menu</div>${nav.map(([id,i,t])=>`<div class="navItem ${APP.st.view===id?'active':''}" data-a="nav" data-v="${id}"><div class="navIcon">${i}</div><div class="navLabel">${E(t)}</div></div>`).join('')}${u.role==='admin'?`<div class="sep"></div><button class="btn sm warn" style="width:100%" data-a="reset">Reset</button>`:''}</div>
<div class="content">
<div class="card"><div class="row" style="justify-content:space-between"><div class="row"><button class="btn sm" data-a="pd">←</button><button class="btn sm" data-a="nd">→</button><span class="pill">${E(d)}${d===t?' <span class="tag ok">danas</span>':''}</span><input type="date" value="${E(d)}" data-a="dp" style="width:170px"/></div><div class="row"><button class="btn sm" data-a="pw">← sed.</button><button class="btn sm" data-a="nw">sed. →</button></div></div></div>
${buildView(u)}
</div></div>`}

function buildView(u){const v=APP.st.view,db=APP.db;

/* ===== ADMIN SEMESTERS (with close button) ===== */
if(v==='a-semesters'){const ss=db.settings?.semesters||[];
return`<div class="card"><h2>📆 Semestri</h2><div class="muted">Admin zaključuje semestar → ocjene se od tada upisuju u sljedeći aktivni.</div><div class="sep"></div>
<table><thead><tr><th>ID</th><th>Naziv</th><th>Start</th><th>Kraj</th><th>Min ocj.</th><th>Status</th><th></th></tr></thead><tbody>
${ss.map(s=>`<tr><td><b>${E(s.id)}</b></td><td>${E(s.name)}</td><td class="mono">${E(s.start)}</td><td class="mono">${E(s.end)}</td><td><b>${s.minGrades||0}</b></td>
<td>${s.closed?'<span class="tag ok">zaključen ✓</span>':'<span class="tag warn">aktivan</span>'}</td>
<td class="right">
${!s.closed?`<button class="btn sm warn" data-a="closeSem" data-id="${E(s.id)}">Zaključi semestar</button>`:`<button class="btn sm" data-a="openSem" data-id="${E(s.id)}">Otvori ponovo</button>`}
<button class="btn sm" data-a="editSem" data-id="${E(s.id)}">✏️</button>
<button class="btn sm bad" data-a="delSem" data-id="${E(s.id)}">🗑</button>
</td></tr>`).join('')}
</tbody></table>
<div class="sep"></div>
<h3>Dodaj</h3>
<div class="three"><div><label>ID</label><input id="si"/></div><div><label>Naziv</label><input id="sn"/></div><div><label>Min ocjena</label><input id="smg" type="number" value="2"/></div></div>
<div class="two"><div><label>Start</label><input id="ss" type="date"/></div><div><label>Kraj</label><input id="se" type="date"/></div></div>
<div class="row" style="margin-top:8px"><button class="btn pri" data-a="addSem">Dodaj</button></div>
</div>`}

/* ===== ADMIN FINALS ===== */
if(v==='a-finals'){const cids=(db.classes||[]).map(c=>c.id);const subs=db.subjects||[];const sems=db.settings?.semesters||[];
return`<div class="card"><h2>🎓 Admin: pregled zaključivanja</h2><div class="muted">Ko prolazi, ko ide na popravni.</div><div class="sep"></div>
${cids.map(cid=>{const students=D.stc(db,cid);
return`<h3>${E(D.cn(db,cid))}</h3><div style="overflow:auto"><table><thead><tr><th>Učenik</th>${subs.map(s=>`<th>${E(s.name)}</th>`).join('')}<th>Prosjek</th><th>Status</th></tr></thead><tbody>
${students.map(st=>{let tot=0,cnt=0,neg=false;
const cells=subs.map(sub=>{const fg=db.finalGrades?.[st.id]?.[sub.id];const val=fg?.repair??fg?.value??null;if(val!=null){tot+=val;cnt++;if(val<2)neg=true}
return`<td>${val!=null?`<b${val<2?' style="color:var(--bad)"':''}>${val}</b>${fg?.originalValue!=null?` <span class="crossed">${fg.originalValue}</span>`:''}`:'<span class="muted">—</span>'}</td>`}).join('');
const avg=cnt?(tot/cnt).toFixed(2):'—';
return`<tr><td><b>${E(st.fullName||st.username)}</b></td>${cells}<td><b>${avg}</b></td><td>${neg?'<span class="tag bad">popravni</span>':'<span class="tag ok">prolazi</span>'}</td></tr>`}).join('')}
</tbody></table></div><div class="sep"></div>`}).join('')}</div>`}

/* ===== TEACHER FINALS ===== */
if(v==='t-finals'){const cids=(db.classes||[]).map(c=>c.id);const subs=db.subjects||[];const sems=db.settings?.semesters||[];const myS=D.teacherSubs(db,u.id);
return`<div class="card"><h2>🎓 Zaključivanje (moji predmeti)</h2><div class="muted">Zaključi ocjene. Negativna → dugme "Popravni". Ocjene se mogu brisati/mijenjati klikom.</div><div class="sep"></div>
${cids.map(cid=>{const students=D.stc(db,cid);if(!students.length)return'';const mySubs2=subs.filter(s=>myS.has(s.id));if(!mySubs2.length)return'';
return`<h3>${E(D.cn(db,cid))}</h3>
${mySubs2.map(sub=>`<h3 style="margin-top:10px">${E(sub.name)}</h3>
<table><thead><tr><th>Učenik</th>${sems.map(s=>`<th>${E(s.name)} (min ${s.minGrades||0})</th>`).join('')}<th>Prosjek</th><th>Zaključna</th><th>Popravni</th><th></th></tr></thead><tbody>
${students.map(st=>{const all=D.gradesFor(db,st.id,sub.id);
const semCells=sems.map(sem=>{const sg=all.filter(g=>g.semesterId===sem.id);const vals=sg.map(g=>+g.value);const avg=D.avgArr(vals);const min=sem.minGrades||0;const warn=sg.length<min;
return`<td>${sg.map(g=>`<span class="gradeChip${g.value<2?' neg':''}" data-a="clickGrade" data-st="${st.id}" data-sub="${sub.id}" data-gid="${g.id}">${g.value}</span>`).join('')||'—'}<br/><span class="muted">${avg??'—'}</span>${warn?` <span class="tag bad">${min}!</span>`:''}</td>`}).join('');
const totalAvg=D.avgArr(all.map(g=>+g.value));
const fg=db.finalGrades?.[st.id]?.[sub.id];const fv=fg?.repair??fg?.value??null;
return`<tr><td><b>${E(st.fullName||st.username)}</b></td>${semCells}<td><b>${totalAvg??'—'}</b></td>
<td>${fv!=null?`<b${fv<2?' style="color:var(--bad)"':''}>${fv}</b>${fg?.originalValue!=null?` <span class="crossed">${fg.originalValue}</span>`:''}`:'—'}</td>
<td>${fv!=null&&fv<2?`<button class="btn sm ok" data-a="repair" data-st="${st.id}" data-sub="${sub.id}">Popravni</button>`:(fg?.repair!=null?`<span class="tag ok">${fg.repair}</span>`:'—')}</td>
<td class="right"><select data-fv="${st.id}_${sub.id}" style="width:60px"><option value="">—</option>${[1,2,3,4,5].map(v=>`<option value="${v}"${(fg?.value===v&&fg?.repair==null)?'selected':''}>${v}</option>`).join('')}</select>
<button class="btn sm pri" data-a="saveFinal" data-st="${st.id}" data-sub="${sub.id}">Zaključi</button></td></tr>`}).join('')}
</tbody></table>`).join('<div class="sep"></div>')}
<div class="sep"></div>`}).join('')}</div>`}

/* ===== TEACHER WEEK ===== */
if(v==='t-week'){const dates=weekDs(APP.st.date);const ps=(db.settings?.periods||[]).slice().sort((a,b)=>a.p-b.p);const cids=(db.classes||[]).map(c=>c.id);
function lf(dt,p){const wd=fromI(dt).getDay();const items=[];for(const cid of cids){const cell=db.schedule?.[cid]?.[wd]?.[p.p];if(!cell)continue;const r=D.resolve(db,dt,cid,wd,p.p,cell.teacherId);if(r.tid!==u.id)continue;items.push({dt,cid,wd,period:p.p,sid:cell.subjectId,rid:cell.roomId,sub:r.sub,hw:D.hasHW(db,cid,dt),rem:D.hasRem(db,u.id,dt)})}return items}
return`<div class="card"><h2>📅 Moja sedmica</h2><div class="sep"></div><div class="ttWrap"><div class="tt"><div class="ttHead"><div><b>Čas</b></div>${dates.map(dt=>`<div><b>${E(wdN(fromI(dt).getDay()))}</b><div class="muted mono" style="font-size:11px">${E(dt)}</div></div>`).join('')}</div>
${ps.map(p=>{const cells=dates.map(dt=>{const its=lf(dt,p);if(!its.length)return`<div class="ttCell"><div class="empty">—</div></div>`;return`<div class="ttCell">${its.map(L=>`<div class="lesson" data-a="openL" data-dt="${E(L.dt)}" data-c="${E(L.cid)}" data-w="${L.wd}" data-p="${L.period}" style="border-left:3px solid ${subCol(L.sid)}"><div class="title">${E(D.cn(db,L.cid))} • ${E(D.sn(db,L.sid))}${L.sub?'<span class="tag warn">zamj.</span>':''}${L.hw?'<span class="tag pri">📝</span>':''}${L.rem?'<span class="tag ok">⏰</span>':''}</div><div class="meta">${E(D.rn(db,L.rid))}</div></div>`).join('<div style="height:6px"></div>')}</div>`}).join('');return`<div class="ttRow"><div class="ttTime"><b>${p.p}.</b><div class="mono" style="font-size:11px">${E(p.start)}–${E(p.end)}</div></div>${cells}</div>`}).join('')}</div></div></div>`}

/* ===== STUDENT WEEK ===== */
if(v==='s-week'){const cid=u.classId;const dates=weekDs(APP.st.date);const ps=(db.settings?.periods||[]).slice().sort((a,b)=>a.p-b.p);
return`<div class="card"><h2>📅 Raspored (${E(D.cn(db,cid))})</h2><div class="sep"></div><div class="ttWrap"><div class="tt"><div class="ttHead"><div><b>Čas</b></div>${dates.map(dt=>`<div><b>${E(wdN(fromI(dt).getDay()))}</b><div class="muted mono" style="font-size:11px">${E(dt)}</div></div>`).join('')}</div>
${ps.map(p=>{const cells=dates.map(dt=>{const wd=fromI(dt).getDay();const cell=db.schedule?.[cid]?.[wd]?.[p.p];if(!cell)return`<div class="ttCell"><div class="empty">—</div></div>`;const r=D.resolve(db,dt,cid,wd,p.p,cell.teacherId);return`<div class="ttCell"><div class="lesson" style="border-left:3px solid ${subCol(cell.subjectId)}"><div class="title">${E(D.sn(db,cell.subjectId))}${r.sub?'<span class="tag warn">zamj.</span>':''}${D.hasHW(db,cid,dt)?'<span class="tag pri">📝</span>':''}${D.hasRem(db,u.id,dt)?'<span class="tag ok">⏰</span>':''}</div><div class="meta">${E(D.tn(db,r.tid))}</div></div></div>`}).join('');return`<div class="ttRow"><div class="ttTime"><b>${p.p}.</b><div class="mono" style="font-size:11px">${E(p.start)}–${E(p.end)}</div></div>${cells}</div>`}).join('')}</div></div></div>`}

/* ===== STUDENT GRADES ===== */
if(v==='s-grades'){const g=db.grades?.[u.id]||{};const fg=db.finalGrades?.[u.id]||{};const subs=(db.subjects||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));const sems=db.settings?.semesters||[];
return`<div class="card"><h2>📊 Ocjene</h2><div class="sep"></div><table><thead><tr><th>Predmet</th>${sems.map(s=>`<th>${E(s.name)}</th>`).join('')}<th>Prosjek</th><th>Zaključna</th></tr></thead><tbody>
${subs.map(sub=>{const all=Object.values(g?.[sub.id]||{}).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const semCells=sems.map(sem=>{const sg=all.filter(x=>x.semesterId===sem.id);const avg=D.avgArr(sg.map(x=>+x.value));const min=sem.minGrades||0;const warn=sg.length<min;
return`<td>${sg.map(x=>`${x.value}`).join(', ')||'—'} (${avg??'—'})${warn?` <span class="tag bad">${min}!</span>`:''}</td>`}).join('');
const totalAvg=D.avgArr(all.map(x=>+x.value));const f=fg?.[sub.id];const fv=f?.repair??f?.value??null;
return`<tr><td><b>${E(sub.name)}</b></td>${semCells}<td><b>${totalAvg??'—'}</b></td><td>${fv!=null?`<b${fv<2?' style="color:var(--bad)"':''}>${fv}</b>${f?.originalValue!=null?` <span class="crossed">${f.originalValue}</span>`:''}`:'—'}</td></tr>`}).join('')}
</tbody></table></div>`}

/* ===== Remaining views → simple stubs that use same pattern as before ===== */
if(v==='a-users')return adminUsers();
if(v==='a-data')return adminData();
if(v==='a-periods')return adminPeriods();
if(v==='a-schedule')return adminSchedule();
if(v==='t-day')return teacherDay(u);
if(v==='t-subs')return teacherSubs(u);
if(v==='t-homework')return teacherHomework(u);
if(v==='t-rem')return reminders(u);
if(v==='t-homeroom')return homeroom(u);
if(v==='s-day')return studentDay(u);
if(v==='s-rem')return reminders(u);
return'<div class="card">—</div>'}

/* Stub functions (same as previous version, abbreviated for space) */
function adminUsers(){const db=APP.db;const users=(db.users||[]).slice().sort((a,b)=>a.username.localeCompare(b.username));const co=(db.classes||[]).map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('');return`<div class="card"><h2>👤 Korisnici</h2><div class="sep"></div><div class="two"><div><table><thead><tr><th>Username</th><th>Uloga</th><th>Ime</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${E(u.username)}</b></td><td>${E(u.role)}</td><td>${E(u.fullName||'')}</td><td class="right">${u.username==='admin'?'—':`<button class="btn sm" data-a="editU" data-id="${u.id}">✏️</button><button class="btn sm bad" data-a="delU" data-id="${u.id}">🗑</button>`}</td></tr>`).join('')}</tbody></table></div><div><h3>Novi</h3><div class="sep"></div><label>Username</label><input id="au_u"/><label>Lozinka</label><input id="au_p"/><label>Ime</label><input id="au_n"/><label>Uloga</label><select id="au_r"><option value="teacher">teacher</option><option value="student">student</option></select><label>Razred</label><select id="au_c"><option value="">—</option>${co}</select><label>Razrednik</label><select id="au_h"><option value="">—</option>${co}</select><div class="row" style="margin-top:10px"><button class="btn pri" data-a="addU">Kreiraj</button></div></div></div></div>`}
function adminData(){const db=APP.db;const to=(db.users||[]).filter(u=>u.role==='teacher').map(t=>`<option value="${t.id}">${E(t.fullName||t.username)}</option>`).join('');return`<div class="card"><h2>📋 Podaci</h2><div class="sep"></div><div class="two"><div><h3>Razredi</h3><div class="sep"></div><label>Naziv</label><input id="ac_n"/><label>Razrednik</label><select id="ac_h"><option value="">—</option>${to}</select><div class="row" style="margin-top:8px"><button class="btn pri" data-a="addC">Dodaj</button></div><div class="sep"></div><table><thead><tr><th>Razred</th><th></th></tr></thead><tbody>${(db.classes||[]).map(c=>`<tr><td><b>${E(c.name)}</b></td><td class="right"><button class="btn sm bad" data-a="delC" data-id="${c.id}">🗑</button></td></tr>`).join('')}</tbody></table></div><div><h3>Predmeti</h3><div class="sep"></div><div class="row"><input id="as_n"/><button class="btn pri" data-a="addS">+</button></div><div class="sep"></div><table><thead><tr><th>Predmet</th><th></th></tr></thead><tbody>${(db.subjects||[]).map(s=>`<tr><td>${E(s.name)}</td><td class="right"><button class="btn sm bad" data-a="delS" data-id="${s.id}">🗑</button></td></tr>`).join('')}</tbody></table><div class="sep"></div><h3>Učionice</h3><div class="row"><input id="ar_n"/><button class="btn pri" data-a="addR">+</button></div><div class="sep"></div><table><thead><tr><th>Učionica</th><th></th></tr></thead><tbody>${(db.rooms||[]).map(r=>`<tr><td>${E(r.name)}</td><td class="right"><button class="btn sm bad" data-a="delR" data-id="${r.id}">🗑</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function adminPeriods(){const ps=(APP.db.settings?.periods||[]).slice().sort((a,b)=>a.p-b.p);return`<div class="card"><h2>⏰ Periodi</h2><div class="sep"></div><table><thead><tr><th>Čas</th><th>Start</th><th>Kraj</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td><b>${p.p}.</b></td><td class="mono">${p.start}</td><td class="mono">${p.end}</td><td class="right"><button class="btn sm bad" data-a="delP" data-p="${p.p}">🗑</button></td></tr>`).join('')}</tbody></table><div class="sep"></div><div class="three"><div><label>Broj</label><input id="pp" type="number" value="${ps.length+1}"/></div><div><label>Start</label><input id="ps" type="time" value="14:00"/></div><div><label>Kraj</label><input id="pe" type="time" value="14:45"/></div></div><div class="row" style="margin-top:8px"><button class="btn pri" data-a="addP">Dodaj</button></div></div>`}
function adminSchedule(){const db=APP.db;const cids=(db.classes||[]).map(c=>c.id);if(!APP.st.acp)APP.st.acp=cids[0];const cid=APP.st.acp;const dates=weekDs(APP.st.date);const ps=(db.settings?.periods||[]).slice().sort((a,b)=>a.p-b.p);return`<div class="card"><div class="row" style="justify-content:space-between"><h2>📅 Raspored</h2><select data-a="apc" style="width:200px">${cids.map(id=>`<option value="${id}"${id===cid?' selected':''}>${E(D.cn(db,id))}</option>`).join('')}</select></div><div class="sep"></div><div class="ttWrap"><div class="tt"><div class="ttHead"><div><b>Čas</b></div>${dates.map(dt=>`<div><b>${wdN(fromI(dt).getDay())}</b><div class="muted mono" style="font-size:11px">${dt}</div></div>`).join('')}</div>${ps.map(p=>{const cells=dates.map(dt=>{const wd=fromI(dt).getDay();const c=db.schedule?.[cid]?.[wd]?.[p.p];if(!c)return`<div class="ttCell"><div class="lesson" style="border-style:dashed;background:var(--surface2)" data-a="ec" data-c="${cid}" data-w="${wd}" data-p="${p.p}"><div class="title">+</div></div></div>`;return`<div class="ttCell"><div class="lesson" data-a="ec" data-c="${cid}" data-w="${wd}" data-p="${p.p}" style="border-left:3px solid ${subCol(c.subjectId)}"><div class="title">${E(D.sn(db,c.subjectId))}</div><div class="meta">${E(D.tn(db,c.teacherId))}</div></div></div>`}).join('');return`<div class="ttRow"><div class="ttTime"><b>${p.p}.</b><div class="mono" style="font-size:11px">${p.start}–${p.end}</div></div>${cells}</div>`}).join('')}</div></div></div>`}
function teacherDay(u){const db=APP.db,date=APP.st.date,wd=fromI(date).getDay(),ps=(db.settings?.periods||[]).slice().sort((a,b)=>a.p-b.p),cids=(db.classes||[]).map(c=>c.id),lessons=[];for(const cid of cids)for(const p of ps){const cell=db.schedule?.[cid]?.[wd]?.[p.p];if(!cell)continue;const r=D.resolve(db,date,cid,wd,p.p,cell.teacherId);if(r.tid!==u.id)continue;lessons.push({cid,period:p.p,sid:cell.subjectId,rid:cell.roomId,sub:r.sub})}lessons.sort((a,b)=>a.period-b.period);return`<div class="card"><h2>📋 Dan (${E(date)})</h2><div class="sep"></div>${lessons.length?`<table><thead><tr><th>Čas</th><th>Razred</th><th>Predmet</th><th></th></tr></thead><tbody>${lessons.map(L=>`<tr><td><b>${L.period}.</b></td><td>${E(D.cn(db,L.cid))}</td><td>${E(D.sn(db,L.sid))}</td><td class="right"><button class="btn sm pri" data-a="openL" data-dt="${date}" data-c="${L.cid}" data-w="${wd}" data-p="${L.period}">Otvori</button></td></tr>`).join('')}</tbody></table>`:'<div class="notice">Nema časova.</div>'}</div>`}

/* ===== ALL CLICK ACTIONS ===== */
document.addEventListener('click',async e=>{
const b=e.target.closest('[data-a]');if(!b)return;const a=b.getAttribute('data-a');const db=APP.db;const u=me();
if(a==='theme'){setT(APP.st.theme==='light'?'dark':'light');render();return}
if(a==='closeM'){$('#'+b.getAttribute('data-id')).classList.remove('open');return}
if(a==='logout'){Sess.clear();APP.st.view='login';render();return}
if(a==='pd'){APP.st.date=addD(APP.st.date,-1);render();return}
if(a==='nd'){APP.st.date=addD(APP.st.date,1);render();return}
if(a==='pw'){APP.st.date=addD(APP.st.date,-7);render();return}
if(a==='nw'){APP.st.date=addD(APP.st.date,7);render();return}
if(a==='nav'){APP.st.view=b.getAttribute('data-v');render();return}
if(a==='login'){const user=($('#li_u')?.value||'').trim(),pass=$('#li_p')?.value||'';const found=(db.users||[]).find(x=>x.username.toLowerCase()===user.toLowerCase());if(!found||found.passHash!==sha256(pass))return alert('Pogrešno.');Sess.set({uid:found.id,at:now()});APP.st.view='login';render();return}
if(!u)return;

/* --- GRADE CLICK (edit/delete) --- */
if(a==='clickGrade'){openGradeModal(b.getAttribute('data-st'),b.getAttribute('data-sub'),b.getAttribute('data-gid'));return}
if(a==='updateGrade'){const stId=b.getAttribute('data-st'),subId=b.getAttribute('data-sub'),gid=b.getAttribute('data-gid');const g=db.grades?.[stId]?.[subId]?.[gid];if(!g)return;g.value=+$('#eg_v').value;g.type=$('#eg_tp').value;g.note=$('#eg_n').value||'';g.editedAt=now();g.editedBy=u.id;await save();alert('Ocjena promijenjena.');$('#gradeModal').classList.remove('open');render();return}
if(a==='deleteGrade'){const stId=b.getAttribute('data-st'),subId=b.getAttribute('data-sub'),gid=b.getAttribute('data-gid');if(!confirm('Obrisati ocjenu?'))return;delete db.grades?.[stId]?.[subId]?.[gid];await save();alert('Obrisano.');$('#gradeModal').classList.remove('open');render();return}

/* --- ADMIN --- */
if(u.role==='admin'){
if(a==='reset'){if(!confirm('Reset?'))return;await RT.ref(DB_PATH).remove();APP.db=seed();await save();Sess.clear();APP.st.view='login';render();return}
if(a==='addU'){const un=($('#au_u')?.value||'').trim(),pw=$('#au_p')?.value||'',fn=($('#au_n')?.value||'').trim(),rl=$('#au_r')?.value,ci=$('#au_c')?.value||null,hr=$('#au_h')?.value||null;if(!un||!pw)return alert('Username+lozinka.');if(db.users.some(x=>x.username.toLowerCase()===un.toLowerCase()))return alert('Postoji.');if(rl==='student'&&!ci)return alert('Razred.');const id=uid('u');db.users.push({id,username:un,passHash:sha256(pw),role:rl,fullName:fn,classId:rl==='student'?ci:null,homeroomClassId:rl==='teacher'?hr:null});if(rl==='teacher'&&hr){const c=db.classes.find(x=>x.id===hr);if(c)c.homeroomTeacherId=id}await save();render();return}
if(a==='delU'){db.users=db.users.filter(x=>x.id!==b.getAttribute('data-id'));await save();render();return}
if(a==='editU'){const usr=db.users.find(x=>x.id===b.getAttribute('data-id'));if(!usr)return;const nm=prompt('Ime:',usr.fullName||'');if(nm!==null)usr.fullName=nm.trim();const np=prompt('Lozinka (prazno=bez):','');if(np)usr.passHash=sha256(np);await save();render();return}
if(a==='addC'){const n=($('#ac_n')?.value||'').trim(),hr=$('#ac_h')?.value||null;if(!n)return;const id=uid('c');db.classes.push({id,name:n,homeroomTeacherId:hr});if(hr){const t=db.users.find(x=>x.id===hr);if(t)t.homeroomClassId=id}await save();render();return}
if(a==='delC'){db.classes=db.classes.filter(c=>c.id!==b.getAttribute('data-id'));await save();render();return}
if(a==='addS'){const n=($('#as_n')?.value||'').trim();if(n){db.subjects.push({id:uid('s'),name:n});await save();render()}return}
if(a==='delS'){db.subjects=db.subjects.filter(s=>s.id!==b.getAttribute('data-id'));await save();render();return}
if(a==='addR'){const n=($('#ar_n')?.value||'').trim();if(n){db.rooms.push({id:uid('r'),name:n});await save();render()}return}
if(a==='delR'){db.rooms=db.rooms.filter(r=>r.id!==b.getAttribute('data-id'));await save();render();return}
if(a==='addP'){const p=+$('#pp')?.value,s=$('#ps')?.value,e=$('#pe')?.value;if(p&&s&&e){db.settings.periods=(db.settings.periods||[]).filter(x=>x.p!==p).concat([{p,start:s,end:e}]).sort((a,b)=>a.p-b.p);await save();render()}return}
if(a==='delP'){db.settings.periods=(db.settings.periods||[]).filter(x=>x.p!==+b.getAttribute('data-p'));await save();render();return}
if(a==='apc'){APP.st.acp=b.value;render();return}
if(a==='ec'){openCell({classId:b.getAttribute('data-c'),weekday:+b.getAttribute('data-w'),period:+b.getAttribute('data-p')});return}
if(a==='saveCell'){const c=b.getAttribute('data-c'),w=+b.getAttribute('data-w'),p=+b.getAttribute('data-p');db.schedule||={};db.schedule[c]||={};db.schedule[c][w]||={};db.schedule[c][w][p]={subjectId:$('#cm_s').value,teacherId:$('#cm_t').value,roomId:$('#cm_r').value};await save();$('#cellModal').classList.remove('open');render();return}
if(a==='delCell'){delete db.schedule?.[b.getAttribute('data-c')]?.[+b.getAttribute('data-w')]?.[+b.getAttribute('data-p')];await save();$('#cellModal').classList.remove('open');render();return}
if(a==='addSem'){const id=($('#si')?.value||'').trim(),n=($('#sn')?.value||'').trim(),s=$('#ss')?.value,e=$('#se')?.value,mg=+($('#smg')?.value||0);if(!id||!n||!s||!e)return alert('Popuni.');db.settings.semesters||=[];db.settings.semesters.push({id,name:n,start:s,end:e,minGrades:mg,closed:false});await save();render();return}
if(a==='editSem'){const sem=(db.settings.semesters||[]).find(s=>s.id===b.getAttribute('data-id'));if(!sem)return;const mg=prompt('Min ocjena:',sem.minGrades||0);if(mg!==null)sem.minGrades=+mg;await save();render();return}
if(a==='delSem'){db.settings.semesters=(db.settings.semesters||[]).filter(s=>s.id!==b.getAttribute('data-id'));await save();render();return}
/* CLOSE / OPEN semester */
if(a==='closeSem'){const sem=(db.settings.semesters||[]).find(s=>s.id===b.getAttribute('data-id'));if(!sem)return;if(!confirm(`Zaključiti "${sem.name}"? Nove ocjene će se upisivati u sljedeći aktivni semestar.`))return;sem.closed=true;sem.closedAt=now();await save();render();return}
if(a==='openSem'){const sem=(db.settings.semesters||[]).find(s=>s.id===b.getAttribute('data-id'));if(!sem)return;sem.closed=false;delete sem.closedAt;await save();render();return}
}

/* --- TEACHER --- */
if(u.role==='teacher'){
if(a==='openL'){await openLesson({date:b.getAttribute('data-dt'),classId:b.getAttribute('data-c'),weekday:+b.getAttribute('data-w'),period:+b.getAttribute('data-p')});return}
if(a==='saveAtt'){const date=b.getAttribute('data-dt'),k=b.getAttribute('data-lk'),cid=b.getAttribute('data-c'),sid=b.getAttribute('data-sub');db.attendance||={};db.attendance[date]||={};db.attendance[date][k]||={};db.absences||={};db.absences[cid]||={};db.absences[cid][date]||={};for(const sel of $$('select[data-att]')){const stId=sel.getAttribute('data-att'),status=sel.value,note=$(`input[data-note="${stId}"]`)?.value||'';db.attendance[date][k][stId]={status,note,teacherId:u.id,markedAt:now()};db.absences[cid][date][stId]||={};if(status==='absent')db.absences[cid][date][stId][k]={studentId:stId,teacherId:u.id,subjectId:sid,justified:false,reason:'',decidedBy:'',decidedAt:''};else delete db.absences[cid][date][stId][k]}await save();alert('Sačuvano.');$('#lessonModal').classList.remove('open');render();return}
if(a==='addGr'){const stId=$('#gr_st').value,dt=$('#gr_dt').value,v=+$('#gr_v').value,tp=$('#gr_tp').value,n=$('#gr_n').value||'',cid=b.getAttribute('data-c'),sid=b.getAttribute('data-sub');
/* semester: use ACTIVE semester */
const activeSem=D.activeSem(db);const semId=activeSem?.id||null;
const gid=uid('g');db.grades||={};db.grades[stId]||={};db.grades[stId][sid]||={};db.grades[stId][sid][gid]={value:v,date:dt,type:tp,note:n,teacherId:u.id,classId:cid,semesterId:semId};await save();alert(`Ocjena ${v} upisana u ${activeSem?.name||'nepoznat semestar'}.`);$('#gr_n').value='';render();return}
if(a==='addLHW'){const cid=b.getAttribute('data-c'),sid=b.getAttribute('data-sub'),due=$('#lhw_d').value,txt=($('#lhw_t').value||'').trim();if(!due||!txt)return alert('Rok i opis.');const id=uid('hw');const rec={classId:cid,subjectId:sid,teacherId:u.id,dueDate:due,text:txt,createdAt:now()};db.homework||={};db.homework[cid]||={};db.homework[cid][due]||={};db.homework[cid][due][id]=rec;db.homeworkByDue||={};db.homeworkByDue[due]||={};db.homeworkByDue[due][id]=rec;await save();alert('Dodano.');return}
if(a==='reqSub'){const date=b.getAttribute('data-dt'),k=b.getAttribute('data-lk'),toId=$('#sub_to').value,note=($('#sub_n').value||'').trim();db.substitutions||={};db.substitutions[date]||={};if(db.substitutions[date][k]&&db.substitutions[date][k].status!=='declined')return alert('Već postoji.');db.substitutions[date][k]={fromTeacherId:u.id,toTeacherId:toId,status:'pending',note,createdAt:now(),decidedAt:''};await save();alert('Poslano.');return}
if(a==='subA'||a==='subD'){const s=db.substitutions?.[b.getAttribute('data-dt')]?.[b.getAttribute('data-lk')];if(!s||s.toTeacherId!==u.id||s.status!=='pending')return;s.status=a==='subA'?'accepted':'declined';s.decidedAt=now();await save();render();return}
if(a==='addHW'){const cid=$('#hw_c').value,sid=$('#hw_s').value,due=$('#hw_d').value,txt=($('#hw_t').value||'').trim();if(!cid||!sid||!due||!txt)return;const id=uid('hw');const rec={classId:cid,subjectId:sid,teacherId:u.id,dueDate:due,text:txt,createdAt:now()};db.homework||={};db.homework[cid]||={};db.homework[cid][due]||={};db.homework[cid][due][id]=rec;db.homeworkByDue||={};db.homeworkByDue[due]||={};db.homeworkByDue[due][id]=rec;await save();$('#hw_t').value='';render();return}
if(a==='delHW'){const due=b.getAttribute('data-due'),id=b.getAttribute('data-id');const rec=db.homeworkByDue?.[due]?.[id];if(rec?.classId)delete db.homework?.[rec.classId]?.[due]?.[id];delete db.homeworkByDue?.[due]?.[id];await save();render();return}
if(a==='togJ'){const cid=b.getAttribute('data-c'),dt=b.getAttribute('data-dt'),sid=b.getAttribute('data-sid'),k=b.getAttribute('data-lk'),j=b.getAttribute('data-j')==='1';const rec=db.absences?.[cid]?.[dt]?.[sid]?.[k];if(!rec)return;if(!j){const reason=prompt('Razlog:',rec.reason||'');if(reason===null)return;rec.justified=true;rec.reason=reason;rec.decidedBy=u.id;rec.decidedAt=now()}else{rec.justified=false;rec.reason='';rec.decidedBy=u.id;rec.decidedAt=now()}await save();render();return}
/* SAVE FINAL */
if(a==='saveFinal'){const stId=b.getAttribute('data-st'),subId=b.getAttribute('data-sub');const val=+$(`select[data-fv="${stId}_${subId}"]`).value;if(!val)return alert('Izaberi ocjenu.');db.finalGrades||={};db.finalGrades[stId]||={};db.finalGrades[stId][subId]={value:val,decidedBy:u.id,decidedAt:now()};await save();alert(`Zaključna: ${val}`);render();return}
/* REPAIR */
if(a==='repair'){const stId=b.getAttribute('data-st'),subId=b.getAttribute('data-sub');const fg=db.finalGrades?.[stId]?.[subId];if(!fg||(fg.repair??fg.value)>=2)return alert('Nema negativne.');const nv=+prompt('Ocjena na popravnom (1-5):','2');if(!nv||nv<1||nv>5)return;fg.originalValue=fg.value;fg.repair=nv;fg.repairBy=u.id;fg.repairAt=now();await save();alert('Popravni upisan.');render();return}
}

/* REMINDERS */
if(a==='addRem'){const dt=$('#rem_d').value,txt=($('#rem_t').value||'').trim();if(!dt||!txt)return;db.reminders||={};db.reminders[u.id]||={};db.reminders[u.id][uid('rem')]={date:dt,text:txt,done:false,createdAt:now()};await save();$('#rem_t').value='';render();return}
if(a==='togRem'){const r=db.reminders?.[u.id]?.[b.getAttribute('data-id')];if(r)r.done=!r.done;await save();render();return}
if(a==='delRem'){delete db.reminders?.[u.id]?.[b.getAttribute('data-id')];await save();render();return}
});

document.addEventListener('change',e=>{
if(e.target.matches('input[data-a="dp"]')){APP.st.date=e.target.value;render()}
if(e.target.matches('select[data-a="apc"]')){APP.st.acp=e.target.value;render()}
if(e.target.matches('select[data-att]')){const dot=e.target.parentElement.querySelector('.attDot');if(dot)dot.className='attDot '+e.target.value}
});

['lessonModal','cellModal','gradeModal'].forEach(id=>{$('#'+id).addEventListener('click',e=>{if(e.target.id===id)$('#'+id).classList.remove('open')})});
firebase.database().ref('.info/connected').on('value',s=>{$('#connPill').textContent=s.val()?'🟢 connected':'🔴 offline'});

(async()=>{let db=await RT.get(DB_PATH);if(!db){db=seed();await RT.set(DB_PATH,db)}APP.db=db;render();RT.on(DB_PATH,val=>{if(val){APP.db=val;render()}})})();
</script>
</body>
</html>

/* ====== SCHEDULE GRID ====== */
function buildScheduleGrid(opts){
  const { classId=null, teacherId=null, studentId=null, editable=false, dateForSubs=null, onSlotClick=null } = opts;
  const todayDow = (new Date().getDay()+6)%7;
  const weekStart = startOfWeek(dateForSubs || todayStr());
  function mobileEventsForDay(di){
    const cellDate=addDays(weekStart, di);
    const events=[];
    PERIODS.forEach((p,pi)=>{
      let slots=[];
      if(classId) slots=db.schedule.filter(s=>s.classId===classId && s.day===di && s.period===pi);
      else if(teacherId) slots=db.schedule.filter(s=>s.teacherId===teacherId && s.day===di && s.period===pi);
      const specialForStudent = studentId ? specialClassForStudent(studentId, cellDate, pi) : null;
      if(specialForStudent) slots=[];
      const teacherSpecials = teacherId ? specialClassesForTeacher(teacherId, cellDate, pi) : [];
      if(editable && classId && !slots.length){
        events.push({ empty:true, period:pi, time:`${p.s}-${p.e}`, day:di });
      }
      slots.forEach(slot=>{
        const sub=getSubject(slot.subjectId), tch=getUser(slot.teacherId), cls=getClass(slot.classId);
        const subbed = dateForSubs && db.substitutions.find(s=>s.scheduleId===slot.id && s.date===cellDate && s.status==='accepted');
        const hw = db.homework.filter(h=>shouldShowHomeworkOnSlot(h, slot, cellDate));
        const ass = db.assessments.filter(a=>shouldShowAssessmentOnSlot(a, slot, cellDate) && assessmentVisibleForCurrentUser(a));
        events.push({ slot, sub, title:sub?.name||'Čas', meta:classId?(tch?.name||''):(cls?.name||''), room:slot.room, period:pi, time:`${p.s}-${p.e}`, subbed, hw, ass });
      });
      if(specialForStudent){
        const subj=getSubject(specialForStudent.subjectId), tch=getUser(specialForStudent.teacherId);
        events.push({ special:specialForStudent, sub:subj, title:specialForStudent.title||subj?.name||'Posebni čas', meta:`Posebni čas · ${tch?.name||''}`, room:specialForStudent.room, period:pi, time:`${p.s}-${p.e}`, hw:[], ass:[] });
      }
      teacherSpecials.forEach(sp=>{
        const subj=getSubject(sp.subjectId);
        events.push({ special:sp, sub:subj, title:sp.title||subj?.name||'Posebni čas', meta:`Posebni čas · ${specialStudentNames(sp)}`, room:sp.room, period:pi, time:`${p.s}-${p.e}`, hw:[], ass:[] });
      });
      if(teacherId && dateForSubs){
        db.substitutions.filter(s=>s.substituteTeacherId===teacherId && s.status==='accepted' && s.date===cellDate).forEach(s=>{
          const sc=db.schedule.find(x=>x.id===s.scheduleId);
          if(!sc || sc.day!==di || sc.period!==pi || sc.teacherId===teacherId) return;
          const subj=getSubject(sc.subjectId), origT=getUser(sc.teacherId), cls=getClass(sc.classId);
          events.push({ slot:sc, sub:subj, title:subj?.name||'Zamjena', meta:`${cls?.name||''} · zamjena za ${origT?.name||''}`, room:sc.room, period:pi, time:`${p.s}-${p.e}`, substitute:true, hw:[], ass:[] });
        });
      }
    });
    return { cellDate, events:events.sort((a,b)=>a.period-b.period) };
  }
  function renderMobileSchedule(){
    return `<div class="mobile-schedule space-y-3">
      ${DAYS.map((day,di)=>{
        const {cellDate, events}=mobileEventsForDay(di);
        return `<div class="mobile-day-card">
          <div class="mobile-day-head">
            <div><div class="font-extrabold">${day}</div><div class="text-xs text-slate-500">${cellDate}</div></div>
            <span class="badge bg-slate-50 text-slate-700">${events.length} časova</span>
          </div>
          <div class="p-3 space-y-2">
            ${events.length?events.map(ev=>ev.empty?`<button class="mobile-event empty-slot text-left w-full hover:bg-blue-50" data-day="${ev.day}" data-period="${ev.period}" style="--event-color:#94a3b8">
              <div class="text-xs font-mono text-slate-500">${ev.period+1}. čas · ${ev.time}</div>
              <div class="font-bold text-slate-700 mt-1">+ Dodaj čas</div>
            </button>`:ev.special?`<div class="mobile-event cursor-pointer" data-special="${ev.special.id}" data-date="${cellDate}" style="--event-color:${ev.sub?.color||'#64748b'}">
              <div class="text-xs font-mono text-slate-500">${ev.period+1}. čas · ${ev.time}</div>
              <div class="font-extrabold text-base mt-0.5">${ev.title}</div>
              <div class="text-xs text-slate-600 mt-1">${ev.meta}${ev.room?' · '+ev.room:''}</div>
              <span class="badge bg-blue-50 text-blue-700 mt-2">posebni čas</span>
            </div>`:`<div class="mobile-event ${onSlotClick?'cursor-pointer':''}" data-slot="${ev.slot.id}" data-date="${cellDate}" style="--event-color:${ev.sub?.color||'#64748b'}">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <div class="text-xs font-mono text-slate-500">${ev.period+1}. čas · ${ev.time}</div>
                  <div class="font-extrabold text-base mt-0.5">${ev.title}</div>
                  <div class="text-xs text-slate-600 mt-1">${ev.meta}${ev.room?' · '+ev.room:''}</div>
                </div>
                ${ev.substitute?'<span class="badge bg-emerald-50 text-emerald-700">zamjena</span>':''}
              </div>
              ${ev.hw.length||ev.ass.length?`<div class="mt-2 flex flex-wrap gap-1">
                ${ev.hw.map(h=>`<span class="badge bg-amber-50 text-amber-700" title="${h.title}">Zadaća</span>`).join('')}
                ${ev.ass.map(a=>`<span class="badge ${a.type==='test'?'bg-red-50 text-red-700':'bg-blue-50 text-blue-700'}" title="${a.title}">${assessmentLabel(a.type)}</span>`).join('')}
              </div>`:''}
            </div>`).join(''):'<div class="text-sm text-slate-500 p-2">Nema časova.</div>'}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  const tbl = el(`<div class="schedule-responsive">
  <div class="schedule-board desktop-schedule overflow-x-auto scrollbar-thin">
    <div class="grid" style="grid-template-columns: 110px repeat(${DAYS.length}, minmax(0,1fr));">
      <div class="schedule-head p-4 border-b border-r text-sm font-bold flex items-center justify-start gap-2"><i data-lucide="clock"></i> Čas</div>
      ${DAYS.map((d,di)=>{
        const isToday = di===todayDow && !editable;
        const dayDate = addDays(weekStart, di);
        return `<div class="schedule-head ${isToday?'today':''} p-4 border-b border-r text-left">
          <div class="text-base font-extrabold">${DAYS_SHORT[di]}</div>
          <div class="text-xs mt-0.5 opacity-80 font-normal hidden md:block">${shortDate(dayDate)}</div>
        </div>`;
      }).join('')}
      ${PERIODS.map((p,pi)=>`
        <div class="schedule-time p-4 border-b border-r border-slate-100 flex flex-col justify-center">
          <div class="font-extrabold text-xl leading-none">${pi+1}.</div>
          <div class="text-xs mt-1 font-mono text-slate-600">${p.s}-${p.e}</div>
        </div>
        ${DAYS.map((_,di)=>{
          const cellDate = addDays(weekStart, di);
          let slots=[];
          if(classId) slots=db.schedule.filter(s=>s.classId===classId && s.day===di && s.period===pi);
          else if(teacherId) slots=db.schedule.filter(s=>s.teacherId===teacherId && s.day===di && s.period===pi);
          const specialForStudent = studentId ? specialClassForStudent(studentId, cellDate, pi) : null;
          if(specialForStudent) slots=[];
          const teacherSpecials = teacherId ? specialClassesForTeacher(teacherId, cellDate, pi) : [];

          let extraSubs=[];
          if(teacherId && dateForSubs){
            extraSubs = db.substitutions.filter(s=>s.substituteTeacherId===teacherId && s.status==='accepted' && s.date===cellDate).map(s=>{
              const sc=db.schedule.find(x=>x.id===s.scheduleId);
              return sc && sc.day===di && sc.period===pi && sc.teacherId!==teacherId ? {sc, sub:s} : null;
            }).filter(Boolean);
          }

          if(slots.length || extraSubs.length || specialForStudent || teacherSpecials.length){
            return `<div class="schedule-slot p-2 border-b border-r border-slate-100 min-h-[96px] space-y-2">
              ${specialForStudent?(()=>{ const subj=getSubject(specialForStudent.subjectId), tch=getUser(specialForStudent.teacherId); return `<div class="schedule-cell lesson-event rounded-xl p-3 text-xs cursor-pointer" data-special="${specialForStudent.id}" data-date="${cellDate}" style="--event-color:${subj?.color||'#64748b'}">
                <div class="font-extrabold text-[15px] leading-tight">${specialForStudent.title||subj?.name||'Posebni čas'}</div>
                <div class="muted text-xs mt-1 flex items-center gap-1"><i data-lucide="star" class="icon-sm"></i> Posebni čas · ${tch?.name||''}</div>
                ${specialForStudent.room?`<div class="muted text-xs mt-0.5 flex items-center gap-1"><i data-lucide="map-pin" class="icon-sm"></i> ${specialForStudent.room}</div>`:''}
              </div>`; })():''}
              ${teacherSpecials.map(sp=>{ const subj=getSubject(sp.subjectId); return `<div class="schedule-cell lesson-event rounded-xl p-3 text-xs cursor-pointer" data-special="${sp.id}" data-date="${cellDate}" style="--event-color:${subj?.color||'#64748b'}">
                <div class="font-extrabold text-[15px] leading-tight">${sp.title||subj?.name||'Posebni čas'}</div>
                <div class="muted text-xs mt-1 flex items-center gap-1"><i data-lucide="star" class="icon-sm"></i> Posebni čas</div>
                <div class="muted text-xs mt-0.5 line-clamp-2">${specialStudentNames(sp)}</div>
              </div>`; }).join('')}
              ${slots.map(slot=>{
                const sub=getSubject(slot.subjectId), tch=getUser(slot.teacherId), cls=getClass(slot.classId);
                const subbed = dateForSubs && db.substitutions.find(s=>s.scheduleId===slot.id && s.date===cellDate && s.status==='accepted');
                const hw = db.homework.filter(h=>shouldShowHomeworkOnSlot(h, slot, cellDate));
                const ass = db.assessments.filter(a=>shouldShowAssessmentOnSlot(a, slot, cellDate) && assessmentVisibleForCurrentUser(a));
                return `<div class="schedule-cell lesson-event rounded-xl p-3 text-xs ${onSlotClick?'cursor-pointer':''} ${subbed?'subbed':''}" data-slot="${slot.id}" data-date="${cellDate}" style="--event-color:${sub?.color||'#64748b'}">
                  <div class="font-extrabold text-[15px] leading-tight">${sub?.name||'?'}</div>
                  <div class="muted text-xs mt-1 flex items-center gap-1">
                    <i data-lucide="${classId?'user':'school'}" class="icon-sm"></i> ${classId?(tch?.name||''):(cls?.name||'')}
                  </div>
                  ${slot.room?`<div class="muted text-xs mt-0.5 flex items-center gap-1"><i data-lucide="map-pin" class="icon-sm"></i> ${slot.room}</div>`:''}
                  ${hw.length||ass.length?`<div class="mt-2 flex flex-wrap gap-1">
                    ${hw.map(h=>`<span class="badge bg-amber-50 text-amber-700" title="${h.title}">Zadaća</span>`).join('')}
                    ${ass.map(a=>`<span class="badge ${a.type==='test'?'bg-red-50 text-red-700':'bg-blue-50 text-blue-700'}" title="${a.title}">${assessmentLabel(a.type)}</span>`).join('')}
                  </div>`:''}
                  ${subbed?`<div class="text-[11px] mt-2 bg-slate-100 text-slate-600 rounded-full px-2 py-0.5 inline-flex">Zamjena: ${getUser(subbed.substituteTeacherId)?.name||''}</div>`:''}
                  ${editable?`<button data-rmv="${slot.id}" class="float-right text-slate-400 hover:text-red-600"><i data-lucide="x" class="icon-sm"></i></button>`:''}
                </div>`;
              }).join('')}
              ${extraSubs.map(({sc,sub})=>{
                const subj=getSubject(sc.subjectId), origT=getUser(sc.teacherId), cls=getClass(sc.classId);
                return `<div class="schedule-cell lesson-event substitute-stripe rounded-xl p-3 text-xs cursor-pointer" data-slot="${sc.id}" data-date="${cellDate}" style="--event-color:${subj?.color||'#64748b'}">
                  <div class="font-extrabold text-[15px] flex items-center gap-1"><i data-lucide="replace" class="icon-sm"></i> ${subj?.name||'?'}</div>
                  <div class="muted text-xs mt-1">${cls?.name||''} · zamjena za ${origT?.name||''}</div>
                </div>`;
              }).join('')}
            </div>`;
          }
          return `<div class="schedule-slot p-3 border-b border-r border-slate-100 min-h-[96px] empty-slot ${editable?'cursor-pointer hover:bg-blue-50':''}" data-day="${di}" data-period="${pi}"><span class="text-slate-400 text-sm">${editable?'+':'-'}</span></div>`;
        }).join('')}
      `).join('')}
    </div>
  </div>
  ${renderMobileSchedule()}
  </div>`);
  if(editable){
    tbl.querySelectorAll('.empty-slot').forEach(s=>s.addEventListener('click', ()=>openSlotModal(classId, +s.dataset.day, +s.dataset.period)));
    tbl.querySelectorAll('[data-rmv]').forEach(b=>b.addEventListener('click', e=>{
      e.stopPropagation();
      db.schedule=db.schedule.filter(s=>s.id!==b.dataset.rmv); saveDB(); render();
    }));
  }
  if(onSlotClick){
    tbl.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click', ()=>onSlotClick(b.dataset.slot, b.dataset.date || dateForSubs || todayStr())));
    tbl.querySelectorAll('[data-special]').forEach(b=>b.addEventListener('click', ()=>openSpecialClassInfoModal(b.dataset.special)));
  }
  return tbl;
}

/* ====== ADMIN SCHEDULE ====== */
function renderAdminSchedule(){
  if(!view.classId) view.classId = db.classes[0]?.id;
  getScheduleDate('admin_schedule');
  const wrap=el(`<div>
    ${pageHeader('Raspored časova','Sedmični raspored po razredima','calendar-days',
      `<select id="clsSel" class="form-input" style="width:auto;">
        ${db.classes.map(c=>`<option value="${c.id}" ${c.id===view.classId?'selected':''}>${c.name}</option>`).join('')}
      </select><button id="prevWeek" class="btn btn-soft"><i data-lucide="arrow-left"></i> Prošla sedmica</button><input id="dateSel" type="date" class="form-input" style="width:auto;" value="${view.date}"><button id="nextWeek" class="btn btn-soft">Sljedeća sedmica <i data-lucide="arrow-right"></i></button>
      <button id="clearScheduleBtn" class="btn btn-danger"><i data-lucide="trash-2"></i> Obriši cijeli raspored</button>`)}
    <div class="p-8" id="schedHolder"></div>
  </div>`);
  wrap.querySelector('#clsSel').addEventListener('change', e=>{ view.classId=e.target.value; render(); });
  wrap.querySelector('#dateSel').addEventListener('change', e=>{ setScheduleDate('admin_schedule', e.target.value); render(); });
  wrap.querySelector('#prevWeek').addEventListener('click', ()=>shiftScheduleWeek('admin_schedule', -1));
  wrap.querySelector('#nextWeek').addEventListener('click', ()=>shiftScheduleWeek('admin_schedule', 1));
  wrap.querySelector('#clearScheduleBtn').addEventListener('click', ()=>{
    if(!confirm('Obrisati CIJELI raspored za sve razrede i profesore? Ovo će ukloniti sve časove iz rasporeda svima.')) return;
    if(!confirm('Potvrdi još jednom: svi rasporedi će biti prazni. Održani časovi i ocjene ostaju, ali sedmični raspored se briše.')) return;
    db.schedule=[];
    db.substitutions=[];
    db.homework.forEach(h=>{ h.scheduleId=''; });
    db.assessments.forEach(a=>{ a.scheduleId=''; });
    db.materials.forEach(m=>{ m.scheduleId=''; m.scheduleIds=[]; });
    saveDB(); render();
  });
  wrap.querySelector('#schedHolder').appendChild(buildScheduleGrid({classId:view.classId, editable:true, dateForSubs:view.date}));
  return wrap;
}

function renderAdminSpecialClasses(){

    ${pageHeader('Posebni časovi','Časovi za odabrane učenike koji im zamjenjuju redovan čas','calendar-plus',`<button id="addSpecial" class="btn btn-primary"><i data-lucide="plus"></i> Novi posebni čas</button>`)}
    <div class="p-8"><div class="card overflow-hidden">
      ${list.length?`<table class="w-full text-sm"><thead class="bg-slate-50 text-xs uppercase text-slate-500 text-left"><tr><th class="px-4 py-3">Datum</th><th class="px-4 py-3">Čas</th><th class="px-4 py-3">Naziv</th><th class="px-4 py-3">Predmet</th><th class="px-4 py-3">Profesor</th><th class="px-4 py-3">Učenici</th><th class="px-4 py-3 text-right">Akcije</th></tr></thead><tbody>${list.map(c=>`<tr class="border-t border-slate-100 hover:bg-slate-50"><td class="px-4 py-3 font-mono text-xs">${c.date}</td><td class="px-4 py-3">${(+c.period)+1}. čas</td><td class="px-4 py-3 font-bold">${c.title}</td><td class="px-4 py-3"><span class="badge text-white" style="background:${getSubject(c.subjectId)?.color||'#64748b'}">${getSubject(c.subjectId)?.name||''}</span></td><td class="px-4 py-3 text-slate-600">${getUser(c.teacherId)?.name||''}</td><td class="px-4 py-3 text-slate-600 max-w-sm"><div class="line-clamp-2">${specialStudentNames(c)||'-'}</div></td><td class="px-4 py-3 text-right"><button data-edit-special="${c.id}" class="btn btn-soft" style="padding:5px 10px;font-size:12px;"><i data-lucide="pencil" class="icon-sm"></i> Uredi</button><button data-del-special="${c.id}" class="btn btn-danger" style="padding:5px 10px;font-size:12px;"><i data-lucide="trash-2" class="icon-sm"></i></button></td></tr>`).join('')}</tbody></table>`:'<div class="p-10 text-center text-slate-500">Nema posebnih časova.</div>'}
    </div></div>
  </div>`);
  wrap.querySelector('#addSpecial').addEventListener('click', ()=>openSpecialClassModal());

  return wrap;
}

function openSpecialClassModal(id=null){
  const c=id?db.specialClasses.find(x=>x.id===id):{ id:uid('spc'), title:'', date:todayStr(), period:0, subjectId:'', teacherId:'', room:'', description:'', studentIds:[], createdBy:session.userId, createdAt:Date.now() };
  const m=openModal(id?'Uredi posebni čas':'Novi posebni čas', `<div class="space-y-3"><div><label class="text-sm font-medium">Naziv</label><input id="sp_title" class="form-input" value="${c.title||''}" placeholder="npr. Popravni iz matematike"></div><div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-medium">Datum</label><input id="sp_date" type="date" class="form-input" value="${c.date||todayStr()}"></div><div><label class="text-sm font-medium">Čas</label><select id="sp_period" class="form-input">${PERIODS.map((p,i)=>`<option value="${i}" ${+c.period===i?'selected':''}>${i+1}. čas (${p.s})</option>`).join('')}</select></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-medium">Predmet</label><select id="sp_subject" class="form-input"><option value="">- odaberi -</option>${db.subjects.map(s=>`<option value="${s.id}" ${c.subjectId===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div><div><label class="text-sm font-medium">Profesor</label><select id="sp_teacher" class="form-input"></select></div></div><div><label class="text-sm font-medium">Učionica</label><input id="sp_room" class="form-input" value="${c.room||''}" placeholder="npr. kabinet 12"></div><div><label class="text-sm font-medium">Opis</label><textarea id="sp_desc" rows="3" class="form-input">${c.description||''}</textarea></div><div><label class="text-sm font-medium">Učenici (mogu biti iz različitih razreda)</label><input id="sp_search" class="form-input" placeholder="Pretraži učenike..."><div id="sp_students" class="grid md:grid-cols-2 gap-2 mt-2 max-h-72 overflow-y-auto scrollbar-thin border border-slate-200 rounded-xl p-3"></div></div></div>`, ()=>{
    c.title=m.querySelector('#sp_title').value.trim(); c.date=m.querySelector('#sp_date').value; c.period=+m.querySelector('#sp_period').value; c.subjectId=m.querySelector('#sp_subject').value; c.teacherId=m.querySelector('#sp_teacher').value; c.room=m.querySelector('#sp_room').value.trim(); c.description=m.querySelector('#sp_desc').value.trim(); c.studentIds=Array.from(m.querySelectorAll('.sp_student:checked')).map(x=>x.value);
    if(!c.title||!c.date||!c.subjectId||!c.teacherId||!c.studentIds.length){ alert('Popunite naziv, datum, predmet, profesora i učenike.'); return false; }
    if(id) Object.assign(db.specialClasses.find(x=>x.id===id), c); else db.specialClasses.push(c);
    saveDB(); render(); return true;
  });
  function syncTeachers(){ const sid=m.querySelector('#sp_subject').value; const teachers=db.users.filter(u=>u.role==='teacher' && (!sid || (u.subjects||[]).includes(sid))); if(!teachers.some(t=>t.id===c.teacherId)) c.teacherId=teachers[0]?.id||''; m.querySelector('#sp_teacher').innerHTML=teachers.map(t=>`<option value="${t.id}" ${c.teacherId===t.id?'selected':''}>${t.name}</option>`).join(''); }
  function renderStudents(){ const q=(m.querySelector('#sp_search')?.value||'').toLowerCase(); const students=db.users.filter(u=>u.role==='student').filter(u=>(u.name+' '+(getClass(u.classId)?.name||'')).toLowerCase().includes(q)); m.querySelector('#sp_students').innerHTML=students.map(s=>`<label class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50"><input type="checkbox" class="sp_student" value="${s.id}" ${(c.studentIds||[]).includes(s.id)?'checked':''}> <span>${s.name} <span class="text-xs text-slate-500">(${getClass(s.classId)?.name||''})</span></span></label>`).join(''); }
  m.querySelector('#sp_subject').addEventListener('change', syncTeachers); m.querySelector('#sp_search').addEventListener('input', renderStudents); syncTeachers(); renderStudents();
}

      <div><label class="text-sm font-medium">Predmet</label>
        <select id="f_sub" class="form-input"><option value="">- odaberi -</option>${db.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div>

    sel.innerHTML='<option value="">- odaberi -</option>'+db.users.filter(u=>u.role==='teacher' && (!sid||(u.subjects||[]).includes(sid))).map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
  }
  m.querySelector('#f_sub').addEventListener('change', syncTeachers); syncTeachers();
}

            <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100">

              <div class="flex gap-1">
                <button data-edit="${l.id}" class="btn-ghost"><i data-lucide="pencil"></i></button>
                <button data-del="${l.id}" class="btn-ghost text-red-600 hover:bg-red-50"><i data-lucide="trash-2"></i></button>
              </div>
            </div>
          </div>`;
        }).join('') || '<div class="col-span-3 text-center text-slate-500 py-12">Nema lekcija. Kliknite na "Nova lekcija" da dodate prvu.</div>'}
      </div>
    </div>
  </div>`);
  wrap.querySelector('#addBtn').addEventListener('click', ()=>openLessonModal(null,isAdmin));
  wrap.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openLessonModal(b.dataset.edit,isAdmin)));
  wrap.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Obrisati lekciju?')){ db.lessons=db.lessons.filter(l=>l.id!==b.dataset.del); saveDB(); render(); }
  }));
  return wrap;
}
function openLessonModal(id, allowAnyTeacher){
  const me=getUser(session.userId);
  const l=id?db.lessons.find(x=>x.id===id):{ id:uid('l'), subjectId:'', teacherId: me.role==='teacher'?me.id:'', title:'', content:'', createdAt:Date.now() };
  const teacherSubs=me.role==='teacher'?(me.subjects||[]):db.subjects.map(s=>s.id);
  const subOpts=db.subjects.filter(s=>allowAnyTeacher||teacherSubs.includes(s.id));
  const m=openModal(id?'Uredi lekciju':'Nova lekcija',`
    <div class="space-y-3">
      <div><label class="text-sm font-medium">Predmet</label>
        <select id="f_sub" class="form-input"><option value="">- odaberi -</option>${subOpts.map(s=>`<option value="${s.id}" ${l.subjectId===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
      ${allowAnyTeacher?`<div><label class="text-sm font-medium">Profesor</label>
        <select id="f_tch" class="form-input">${db.users.filter(u=>u.role==='teacher').map(u=>`<option value="${u.id}" ${l.teacherId===u.id?'selected':''}>${u.name}</option>`).join('')}</select></div>`:''}
      <div><label class="text-sm font-medium">Naslov</label><input id="f_title" class="form-input" value="${l.title}"></div>
      <div><label class="text-sm font-medium">Sadržaj / opis</label><textarea id="f_cont" rows="5" class="form-input">${l.content}</textarea></div>
    </div>`, ()=>{
    l.subjectId=m.querySelector('#f_sub').value;
    if(allowAnyTeacher) l.teacherId=m.querySelector('#f_tch').value;
    l.title=m.querySelector('#f_title').value.trim();
    l.content=m.querySelector('#f_cont').value.trim();
    if(!l.subjectId||!l.title) return false;
    if(id) Object.assign(db.lessons.find(x=>x.id===id),l); else db.lessons.push(l);
    saveDB(); render(); return true;
  });
}

/* ====== CLASS SESSION ====== */
function renderClassSession(scheduleId, date){
  const sc=db.schedule.find(s=>s.id===scheduleId);
  if(!sc) return el('<div class="p-8">Čas nije pronađen.</div>');
  const me=getUser(session.userId);
  const effTeacherId = effectiveTeacherFor(scheduleId, date);
  if(me.role==='teacher' && me.id!==effTeacherId){
    return el(`<div class="p-8"><div class="card p-6 bg-amber-50 border-amber-200">
      <div class="flex items-center gap-3 text-amber-800"><i data-lucide="alert-triangle"></i><b>Nemate pristup ovom času</b></div>
      <p class="text-sm text-amber-700 mt-2">Ovaj čas ne pripada vama, niti imate prihvaćenu zamjenu za njega na datum ${date}.</p>
      <button id="back" class="btn btn-soft mt-4">Nazad</button>
    </div></div>`);
  }

  const sub=getSubject(sc.subjectId), cls=getClass(sc.classId), origTeacher=getUser(sc.teacherId);
  const students=studentsOfClass(sc.classId);
  const dutyNames=dutyNamesForDate(sc.classId, date);
  let s_=db.classSessions.find(cs=>cs.scheduleId===scheduleId && cs.date===date);
  if(!s_){
    s_={ id:uid('cs'), scheduleId, date, semesterId: semesterForDate(date)?.id||null, lessonId:null, notes:'', privateNotes:{}, conductedBy: me.id, attendance: students.map(s=>({studentId:s.id,status:'present'})), grades:[] };
    db.classSessions.push(s_); saveDB();
  }
  if(!s_.semesterId){ s_.semesterId=semesterForDate(date)?.id||null; }
  if(!s_.privateNotes) s_.privateNotes={};
  students.forEach(s=>{ if(!s_.attendance.find(a=>a.studentId===s.id)) s_.attendance.push({studentId:s.id,status:'present'}); });
  students.forEach(s=>{
    const req=absenceDecisionFor(s.id, scheduleId, date);
    const att=s_.attendance.find(a=>a.studentId===s.id);
    if(req && att && att.status==='present'){
      att.status='absent'; att.excused=req.status==='approved_excused'; att.absenceRequestId=req.id;
    }
  });

  const sem=getSemester(s_.semesterId);
  const semClosed = sem?.closed;
  const myLessons=db.lessons.filter(l=>l.teacherId===me.id && l.subjectId===sc.subjectId);
  const subjectHomework = db.homework.filter(h=>h.classId===sc.classId && h.subjectId===sc.subjectId && h.teacherId===me.id);
  const homeworkThisSlot = subjectHomework.filter(h=>shouldShowHomeworkOnSlot(h, sc, date));
  const assessmentsThisSlot = db.assessments.filter(a=>shouldShowAssessmentOnSlot(a, sc, date));
  const materialsThisSlot = db.materials.filter(m=>materialMatchesSlot(m, sc));

  const wrap=el(`<div>
    <div class="bg-white border-b border-slate-200 px-8 py-5 flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-4">
        <button id="backBtn" class="btn-ghost"><i data-lucide="arrow-left"></i></button>
        <div class="w-12 h-12 rounded-xl text-white flex items-center justify-center icon-lg" style="background:${sub.color}">
          <i data-lucide="book-open"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold">${sub.name} · ${cls.name}</h1>
          <p class="text-sm text-slate-500">${DAYS[sc.day]}, ${PERIODS[sc.period].s}–${PERIODS[sc.period].e} ${sc.room?'· učionica '+sc.room:''} · ${sem?sem.name:''}</p>
          <p class="text-xs mt-1 flex items-center gap-1 ${dutyNames.length?'text-blue-700':'text-slate-500'}"><i data-lucide="clipboard-check" class="icon-sm"></i> Redari: <b>${dutyNames.length?dutyNames.join(', '):'nisu određeni za ovaj datum'}</b></p>
          ${origTeacher.id!==me.id?`<p class="text-xs text-amber-700 flex items-center gap-1 mt-1"><i data-lucide="replace" class="icon-sm"></i> Mijenjate <b>${origTeacher.name}</b></p>`:''}
          ${semClosed?`<p class="text-xs text-red-700 flex items-center gap-1 mt-1"><i data-lucide="lock" class="icon-sm"></i> Semestar je zatvoren - ocjene zaključane</p>`:''}
        </div>
      </div>
      <div class="flex items-center gap-2">
        <label class="text-sm text-slate-600">Datum:</label>
        <input id="dateSel" type="date" value="${date}" class="form-input" style="width:auto;">
      </div>
    </div>

    <div class="px-8 pt-4 border-b border-slate-200 flex gap-2 flex-wrap" id="csTabs">
      <button data-tab="main" class="tab-btn active"><i data-lucide="book-open" class="icon-sm inline"></i> Lekcija i prisustvo</button>
      <button data-tab="homework" class="tab-btn"><i data-lucide="clipboard-pen-line" class="icon-sm inline"></i> Zadaće (${homeworkThisSlot.length})</button>
      <button data-tab="materials" class="tab-btn"><i data-lucide="paperclip" class="icon-sm inline"></i> Materijali (${materialsThisSlot.length})</button>
      <button data-tab="assessments" class="tab-btn"><i data-lucide="file-check-2" class="icon-sm inline"></i> Ispitivanja (${assessmentsThisSlot.length})</button>
      <button data-tab="private" class="tab-btn"><i data-lucide="sticky-note" class="icon-sm inline"></i> Moje napomene</button>
    </div>
    <div class="p-8" id="csBody"></div>
  </div>`);

  function setupTabs(activeTab){
    wrap.querySelectorAll('#csTabs .tab-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab===activeTab);
      b.onclick=()=>renderTab(b.dataset.tab);
    });
  }
  function renderTab(tab){
    setupTabs(tab);
    const body=wrap.querySelector('#csBody');
    body.innerHTML='';
    if(tab==='main') body.appendChild(renderMainTab());
    else if(tab==='homework') body.appendChild(renderHomeworkTab());
    else if(tab==='materials') body.appendChild(renderMaterialTab());
    else if(tab==='assessments') body.appendChild(renderAssessmentTab());
    else body.appendChild(renderPrivateTab());
    if(window.lucide) lucide.createIcons();
  }

  function renderMainTab(){
    const w=el(`<div class="grid lg:grid-cols-3 gap-6">
      <div class="card p-5">
        <div class="flex items-center justify-between gap-2 mb-3">
          <h2 class="font-bold flex items-center gap-2"><i data-lucide="users"></i> Učenici (${students.length})</h2>
          <button id="resetAttendanceBtn" class="btn btn-soft" style="padding:5px 10px;font-size:12px;"><i data-lucide="rotate-ccw" class="icon-sm"></i> Reset</button>
        </div>
        <div class="text-xs text-slate-500 mb-3 bg-slate-50 rounded-lg p-2">
          <div><b>Klik</b> na učenika mijenja prisustvo</div>
          <div><b>Dvoklik</b> otvara unos ocjene</div>
          <div>Dugme <b>+</b> odmah dodaje ocjenu.</div>
          <div>Dugmad <b>P</b>/<b>O</b> dodaju pohvalu ili opomenu.</div>
        </div>
        <div class="space-y-2 max-h-[500px] overflow-y-auto scrollbar-thin pr-2" id="studList"></div>
      </div>

      <div class="card p-5">
        <h2 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="book-open"></i> Lekcija ovog časa</h2>
        <div id="currentLesson"></div>
        <div class="mt-4">
          <label class="text-sm font-medium">Bilješke o času (vidljivo svima)</label>
          <textarea id="notesArea" rows="4" class="form-input" placeholder="Šta je rađeno na času...">${s_.notes||''}</textarea>
        </div>
      </div>

      <div class="card p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold flex items-center gap-2"><i data-lucide="library"></i> Moje lekcije</h2>
          <button id="newLessonBtn" class="btn btn-soft"><i data-lucide="plus" class="icon-sm"></i> Nova</button>
        </div>
        <p class="text-xs text-slate-500 mb-3">Prevucite lekciju ili kliknite "Koristi". Iste lekcije se mogu koristiti više puta.</p>
        <div class="space-y-2 max-h-[500px] overflow-y-auto scrollbar-thin pr-2">
          ${myLessons.map(l=>`<div class="lesson-card border border-slate-200 rounded-lg p-3 hover:border-indigo-300 hover:shadow-sm transition" draggable="true" data-lesson="${l.id}">
            <div class="font-semibold text-sm">${l.title}</div>
            <p class="text-xs text-slate-600 mt-1 line-clamp-2">${l.content}</p>
            <div class="flex justify-between items-center mt-2">
              <span class="text-xs text-slate-400 flex items-center gap-1"><i data-lucide="grip-vertical" class="icon-sm"></i> Prevuci</span>
              <button data-use="${l.id}" class="btn btn-soft" style="padding:4px 8px; font-size:11px;"><i data-lucide="copy" class="icon-sm"></i> Koristi</button>
            </div>
          </div>`).join('') || '<div class="text-center text-slate-500 py-6 text-sm">Nemate lekcija. Kliknite "Nova".</div>'}
        </div>
      </div>
    </div>`);

    function refreshStudents(){
      const list=w.querySelector('#studList');
      list.innerHTML = students.map(s=>{
        const att=s_.attendance.find(a=>a.studentId===s.id);
        const st=att?.status||'present';
        const color=st==='present'?'bg-emerald-50 border-emerald-200':st==='absent'?'bg-red-50 border-red-200':'bg-amber-50 border-amber-200';
        const icon=st==='present'?'check':st==='absent'?'x':'clock';
        const iconColor=st==='present'?'text-emerald-600':st==='absent'?'text-red-600':'text-amber-600';
        const myGrades=s_.grades.filter(g=>g.studentId===s.id);
        return `<div class="att-row border ${color} rounded-lg p-3 cursor-pointer hover:shadow-sm transition" data-stud="${s.id}">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full text-white flex items-center justify-center font-bold text-xs" style="background:linear-gradient(135deg,#3b82f6,#6366f1)">${s.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div>
            <div class="flex-1 min-w-0">
              <div class="font-medium text-sm truncate">${s.name}</div>
              <div class="text-xs text-slate-500">${st==='present'?'Prisutan/na':st==='absent'?'ODSUTAN/NA':'Kasni'}${att?.status==='absent'?(att.excused===true?' · opravdano':att.excused===false?' · neopravdano':' · čeka pravdanje'):''}</div>
            </div>
            <div class="${iconColor}"><i data-lucide="${icon}"></i></div>
            <div class="flex gap-1">
              <button data-add-grade="${s.id}" class="px-2 py-1 rounded bg-slate-100 text-slate-700 text-xs font-bold hover:bg-slate-200" title="Dodaj ocjenu">+</button>
              <button data-note-student="${s.id}" data-note-type="pohvala" class="px-2 py-1 rounded bg-emerald-50 text-emerald-700 text-xs font-bold hover:bg-emerald-100" title="Dodaj pohvalu">P</button>
              <button data-note-student="${s.id}" data-note-type="opomena" class="px-2 py-1 rounded bg-red-50 text-red-700 text-xs font-bold hover:bg-red-100" title="Dodaj opomenu">O</button>
            </div>
            ${myGrades.length?`<div class="flex gap-1 flex-wrap">${myGrades.map(g=>`<span class="inline-flex items-center gap-0.5"><span class="seat-grade" title="${g.note||''}">${g.value}${g.improved?'*':''}</span><button data-del-grade="${g.id}" class="text-red-500 hover:bg-red-50 rounded px-1" title="Obriši ocjenu"><i data-lucide="trash-2" class="icon-sm"></i></button></span>`).join('')}</div>`:''}
          </div>
        </div>`;
      }).join('') || '<div class="text-center text-slate-500 py-8">U razredu nema učenika.</div>';
      if(window.lucide) lucide.createIcons();

      w.querySelectorAll('.att-row').forEach(r=>{
        let clickT;
        r.addEventListener('click', ()=>{
          clearTimeout(clickT);
          clickT=setTimeout(()=>{
            const att=s_.attendance.find(a=>a.studentId===r.dataset.stud);
            att.status=att.status==='present'?'absent':att.status==='absent'?'late':'present';
            saveDB(); refreshStudents();
          },220);
        });
        r.addEventListener('dblclick', ()=>{
          clearTimeout(clickT);
          if(semClosed){ alert('Semestar je zatvoren - ocjene se ne mogu mijenjati.'); return; }
          if(subjectUsesCompletion(sc.subjectId)){ alert('Ovaj predmet nema brojčane ocjene. Razrednik u evidenciji označava odradio/nije odradio.'); return; }
          openGradeModal(s_, r.dataset.stud, refreshStudents);
        });
      });
      w.querySelectorAll('[data-del-grade]').forEach(b=>b.addEventListener('click', e=>{
        e.stopPropagation();
        if(semClosed){ alert('Semestar je zatvoren - ocjene se ne mogu brisati.'); return; }
        if(confirm('Obrisati ovu ocjenu?')){
          s_.grades=s_.grades.filter(g=>g.id!==b.dataset.delGrade);
          saveDB(); refreshStudents();
        }
      }));
      w.querySelectorAll('[data-add-grade]').forEach(b=>b.addEventListener('click', e=>{
        e.stopPropagation();
        if(semClosed){ alert('Semestar je zatvoren - ocjene se ne mogu mijenjati.'); return; }
        if(subjectUsesCompletion(sc.subjectId)){ alert('Ovaj predmet nema brojčane ocjene. Razrednik u evidenciji označava odradio/nije odradio.'); return; }
        openGradeModal(s_, b.dataset.addGrade, refreshStudents);
      }));
      w.querySelectorAll('[data-note-student]').forEach(b=>b.addEventListener('click', e=>{
        e.stopPropagation();
        openBehaviorNoteModal({classId:sc.classId, studentId:b.dataset.noteStudent, type:b.dataset.noteType});
      }));
    }
    refreshStudents();
    w.querySelector('#resetAttendanceBtn').addEventListener('click', ()=>{
      if(!confirm('Resetovati prisustvo za ovaj čas na "prisutan"? Ocjene, lekcija i napomene ostaju.')) return;
      s_.attendance=students.map(s=>({studentId:s.id,status:'present'}));
      saveDB(); refreshStudents();
    });
    renderCurrent(w);
    w.querySelectorAll('.lesson-card').forEach(c=>{ c.addEventListener('dragstart', e=>e.dataTransfer.setData('text/lesson', c.dataset.lesson)); });
    w.querySelectorAll('[data-use]').forEach(b=>b.addEventListener('click', ()=>{ s_.lessonId=b.dataset.use; saveDB(); renderCurrent(w); }));
    w.querySelector('#newLessonBtn').addEventListener('click', ()=>openLessonModal(null,false));
    w.querySelector('#notesArea').addEventListener('input', e=>{ s_.notes=e.target.value; debouncedSaveDB(900); });

    return w;
  }

  function renderSeatingTab(){
    const plan=getSeatingPlan(sc.classId);
    const w=el(`<div class="space-y-4">
      <div class="card p-4 flex items-center justify-between gap-3 flex-wrap">
        <div>
          <div class="font-bold flex items-center gap-2"><i data-lucide="armchair"></i> Raspored učenika u učionici</div>
          <div class="text-sm text-slate-500">Klik na učenika mijenja prisustvo. Dvoklik otvara ocjenu. Prevucite karticu da promijenite mjesto.</div>
        </div>
        <button id="resetSeats" class="btn btn-soft"><i data-lucide="rotate-ccw"></i> Resetuj raspored</button>
      </div>
      <div id="classroomBoard" class="classroom-board">
        <div class="classroom-title">Ovo je u času: ${sub.name} · ${cls.name}</div>
        <div class="classroom-subtitle">Učenici</div>
        ${students.map((s,i)=>{
          const pos=plan.seats[s.id]||defaultSeatPosition(i);
          const att=s_.attendance.find(a=>a.studentId===s.id);
          const st=att?.status||'present';
          const statusLabel=st==='present'?'prisutan':st==='absent'?'odsutan':'kasni';
          const grades=s_.grades.filter(g=>g.studentId===s.id);
          return `<div class="seat-token" draggable="true" data-seat-student="${s.id}" style="left:${pos.x}%;top:${pos.y}%">
            <div class="seat-card ${st}">
              <div class="font-bold text-sm truncate">${s.name}</div>
              <div class="text-xs text-slate-500 mt-0.5">${statusLabel}</div>
              ${grades.length?`<div class="flex flex-wrap gap-1 mt-2">${grades.map(g=>`<span class="seat-grade" title="${g.note||''}">${g.value}</span>`).join('')}</div>`:''}
              <div class="seat-actions">
                <button data-seat-att="${s.id}" class="bg-slate-100 hover:bg-slate-200">pris.</button>
                <button data-seat-note="${s.id}|pohvala" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100">P</button>
                <button data-seat-note="${s.id}|opomena" class="bg-red-50 text-red-700 hover:bg-red-100">O</button>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`);
    const board=w.querySelector('#classroomBoard');
    let dragged=null;
    w.querySelectorAll('[data-seat-student]').forEach(token=>{
      token.addEventListener('dragstart', e=>{ dragged=token.dataset.seatStudent; e.dataTransfer.setData('text/plain', dragged); });
      token.addEventListener('click', e=>{
        if(e.target.closest('button')) return;
        const att=s_.attendance.find(a=>a.studentId===token.dataset.seatStudent);
        att.status=att.status==='present'?'absent':att.status==='absent'?'late':'present';
        saveDB(); renderTab('seating');
      });
      token.addEventListener('dblclick', e=>{
        e.preventDefault();
        if(semClosed){ alert('Semestar je zatvoren - ocjene se ne mogu mijenjati.'); return; }
        if(subjectUsesCompletion(sc.subjectId)){ alert('Ovaj predmet nema brojčane ocjene.'); return; }
        openGradeModal(s_, token.dataset.seatStudent, ()=>renderTab('seating'));
      });
    });
    board.addEventListener('dragover', e=>e.preventDefault());
    board.addEventListener('drop', e=>{
      e.preventDefault();
      const sid=dragged || e.dataTransfer.getData('text/plain'); if(!sid) return;
      const rect=board.getBoundingClientRect();

function collectGradesFor(studentId, subjectId, teacherId, semesterId){
  const out=[];
  db.classSessions.forEach(cs=>{
    const sc=db.schedule.find(s=>s.id===cs.scheduleId); if(!sc) return;
    if(sc.subjectId!==subjectId) return;
    if(teacherId && sc.teacherId!==teacherId && (cs.conductedBy||sc.teacherId)!==teacherId) return;
    if(semesterId){ const sid=cs.semesterId||semesterForDate(cs.date)?.id; if(sid!==semesterId) return; }
    (cs.grades||[]).filter(g=>g.studentId===studentId).forEach(g=>out.push({...g, date:cs.date, sessionId:cs.id}));
  });
  return out;
}

function openRegularGradeImproveModal(sessionId, gradeId){
  const cs=db.classSessions.find(x=>x.id===sessionId);
  const grade=cs?.grades?.find(g=>g.id===gradeId);
  if(!cs||!grade) return;
  const sem=getSemester(cs.semesterId||semesterForDate(cs.date)?.id);
  if(sem?.closed){ alert('Semestar je zatvoren - ocjene se ne mogu mijenjati.'); return; }
  const student=getUser(grade.studentId);
  let selected=null;
  const m=openModal(`Popravljanje ocjene · ${student?.name||''}`, `
    <div class="space-y-3">
      <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm">
        Trenutna ocjena: <span class="grade-pill ${gradeClass(grade.value)}" style="display:inline-flex;">${grade.value}</span>. Odaberite novu, veću ocjenu.
      </div>
      <div><label class="text-sm font-medium">Nova ocjena</label>
        <div class="flex gap-2 mt-2">
          ${[1,2,3,4,5].map(n=>`<button data-g="${n}" class="grade-pick flex-1 py-3 border-2 border-slate-200 rounded-lg font-bold text-xl hover:bg-blue-50 hover:border-blue-400 ${n<=grade.value?'opacity-40':''}" ${n<=grade.value?'disabled':''}>${n}</button>`).join('')}
        </div>
      </div>
      <div><label class="text-sm font-medium">Napomena</label><input id="f_note" class="form-input" placeholder="npr. popravni odgovor, dodatni zadatak"></div>
    </div>`, ()=>{
    if(!selected){ alert('Odaberite veću ocjenu.'); return false; }
    grade.previousValue=grade.value;
    grade.value=selected;
    grade.improved=true;
    grade.improveDate=todayStr();
    grade.improveNote=m.querySelector('#f_note').value.trim();
    saveDB(); render(); return true;
  });
  m.querySelectorAll('.grade-pick:not([disabled])').forEach(b=>b.addEventListener('click', ()=>{
    selected=+b.dataset.g;
    m.querySelectorAll('.grade-pick').forEach(x=>x.classList.remove('bg-blue-500','text-white','border-blue-500'));
    b.classList.add('bg-blue-500','text-white','border-blue-500');
  }));
}

function openQuickGradeModal(studentId, classId, subjectId){
  const me=getUser(session.userId);
  const stud=getUser(studentId);
  const subj=getSubject(subjectId);
  if(subjectUsesCompletion(subjectId)){ alert('Ovaj predmet se ne ocjenjuje brojevima. Razrednik označava odradio/nije odradio.'); return; }
  const schedule=db.schedule.find(s=>s.classId===classId && s.subjectId===subjectId && s.teacherId===me.id);
  if(!schedule){ alert('Nema raspoređenog časa za ovaj predmet i razred.'); return; }
  let selectedG=null;
  const m=openModal(`Brza ocjena · ${stud?.name||''}`, `
    <div class="space-y-3">
      <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 text-sm text-slate-600">
        Predmet: <b>${subj?.name||''}</b>. Ocjena se dodaje bez otvaranja časa, na datum koji odaberete.
      </div>
      <div><label class="text-sm font-medium">Datum</label><input id="q_date" type="date" class="form-input" value="${todayStr()}"></div>
      <div><label class="text-sm font-medium">Ocjena</label>
        <div class="grid grid-cols-5 gap-2 mt-2">
          ${[1,2,3,4,5].map(n=>`<button data-g="${n}" class="grade-pick py-3 border-2 border-slate-200 rounded-lg font-bold text-xl hover:bg-yellow-50 hover:border-yellow-400">${n}</button>`).join('')}
        </div>
      </div>
      <div><label class="text-sm font-medium">Tip</label><select id="q_type" class="form-input">${GRADE_TYPES.map(t=>`<option value="${t.v}">${t.label}</option>`).join('')}</select></div>
      <div><label class="text-sm font-medium">Napomena</label><input id="q_note" class="form-input" placeholder="npr. usmeno, aktivnost, test..."></div>
    </div>`, ()=>{
    const date=m.querySelector('#q_date').value;
    const sem=semesterForDate(date)||activeSemester();
    if(sem?.closed){ alert('Semestar je zatvoren - ocjene se ne mogu dodavati.'); return false; }
    if(!selectedG){ alert('Odaberite ocjenu.'); return false; }
    let cs=db.classSessions.find(x=>x.scheduleId===schedule.id && x.date===date);
    if(!cs){
      const students=studentsOfClass(classId);
      cs={ id:uid('cs'), scheduleId:schedule.id, date, semesterId:sem?.id||null, lessonId:null, notes:'Brzi unos ocjene', privateNotes:{}, conductedBy:me.id, attendance:students.map(s=>({studentId:s.id,status:'present'})), grades:[] };
      db.classSessions.push(cs);
    }
    cs.grades.push({ id:uid('g'), studentId, value:selectedG, type:m.querySelector('#q_type').value, note:m.querySelector('#q_note').value.trim(), ts:Date.now(), quick:true });
    saveDB(); render(); return true;
  });
  m.querySelectorAll('.grade-pick').forEach(b=>b.addEventListener('click', ()=>{
    selectedG=+b.dataset.g;
    m.querySelectorAll('.grade-pick').forEach(x=>x.classList.remove('bg-yellow-400','text-white','border-yellow-400'));
    b.classList.add('bg-yellow-400','text-white','border-yellow-400');
  }));
}

function deleteRegularGrade(sessionId, gradeId){
  const cs=db.classSessions.find(x=>x.id===sessionId);
  const grade=cs?.grades?.find(g=>g.id===gradeId);
  if(!cs||!grade) return;
  const sem=getSemester(cs.semesterId||semesterForDate(cs.date)?.id);
  if(sem?.closed){ alert('Semestar je zatvoren - ocjene se ne mogu brisati.'); return; }
  if(confirm('Obrisati ovu ocjenu?')){
    cs.grades=cs.grades.filter(g=>g.id!==gradeId);
    saveDB(); render();
  }
}

/* ====== TEACHER SESSIONS ====== */
function renderTeacherSessions(){
  const me=getUser(session.userId);
  const my=db.classSessions.filter(cs=>{ const sc=db.schedule.find(s=>s.id===cs.scheduleId); return sc && (sc.teacherId===me.id || cs.conductedBy===me.id); });
  return renderSessionsList(my,'Moji održani časovi','Pregled vaših časova (uključujući zamjene)');

function renderSessionsList(list,title,sub){
  return el(`<div>
    ${pageHeader(title,sub,'clipboard-list')}
    <div class="p-8">
      <div class="card overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-xs uppercase text-slate-500 text-left">
            <tr><th class="px-4 py-3">Datum</th><th class="px-4 py-3">Predmet</th><th class="px-4 py-3">Razred</th><th class="px-4 py-3">Profesor</th><th class="px-4 py-3">Lekcija</th><th class="px-4 py-3">Prisutni</th><th class="px-4 py-3">Ocjene</th></tr>
          </thead>
          <tbody>
            ${list.slice().reverse().map(cs=>{
              const sc=db.schedule.find(s=>s.id===cs.scheduleId); if(!sc) return '';
              const sub=getSubject(sc.subjectId), cls=getClass(sc.classId);
              const tch=getUser(cs.conductedBy||sc.teacherId);
              const lesson=cs.lessonId?db.lessons.find(l=>l.id===cs.lessonId):null;
              const present=(cs.attendance||[]).filter(a=>a.status==='present').length;
              const total=studentsOfClass(sc.classId).length;
              const wasSub = (cs.conductedBy && cs.conductedBy!==sc.teacherId);
              return `<tr class="border-t border-slate-100 hover:bg-slate-50">
                <td class="px-4 py-3 font-medium">${cs.date}</td>
                <td class="px-4 py-3"><span class="badge text-white" style="background:${sub?.color}">${sub?.name||''}</span></td>
                <td class="px-4 py-3">${cls?.name||''}</td>
                <td class="px-4 py-3 text-slate-600">${tch?.name||''} ${wasSub?'<span class="badge bg-amber-50 text-amber-700">zamjena</span>':''}</td>
                <td class="px-4 py-3 text-slate-600">${lesson?lesson.title:cs.notes||'-'}</td>
                <td class="px-4 py-3">${present}/${total}</td>
                <td class="px-4 py-3">${(cs.grades||[]).length}</td>
              </tr>`;
            }).join('') || '<tr><td colspan="7" class="text-center py-8 text-slate-500">Nema održanih časova.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  </div>`);
}

/* ====== TEACHER FINALIZE (sa popravkom ocjene) ====== */
function renderTeacherFinalize(){
  const me=getUser(session.userId);
  if(!view.semesterId) view.semesterId=activeSemester()?.id;
  const sem=getSemester(view.semesterId);
  const semClosed = sem?.closed;
  const reqGrades = sem?.requiredGrades||4;
  const homeroom=homeroomClassOf(me.id);
  const gradedClassIds=[...new Set(db.schedule.filter(s=>s.teacherId===me.id && !subjectUsesCompletion(s.subjectId)).map(s=>s.classId))];
  const completionClassIds=[...new Set([
    ...(homeroom?[homeroom.id]:[]),
    ...db.schedule.filter(s=>s.teacherId===me.id && subjectUsesCompletion(s.subjectId)).map(s=>s.classId)
  ])];
  const mySchedClasses=[...new Set([...gradedClassIds, ...completionClassIds])];
  if(!view.classId) view.classId=mySchedClasses[0];
  const gradedSubjects=view.classId?[...new Set(db.schedule.filter(s=>s.teacherId===me.id && s.classId===view.classId && !subjectUsesCompletion(s.subjectId)).map(s=>s.subjectId))]:[];
  const completionSubjects=view.classId?[...new Set([
    ...(homeroom?.id===view.classId?completionSubjectsForClass(view.classId).map(s=>s.id):[]),
    ...db.schedule.filter(s=>s.teacherId===me.id && s.classId===view.classId && subjectUsesCompletion(s.subjectId)).map(s=>s.subjectId)
  ])]:[];
  const mySubjectsInClass=[...new Set([...gradedSubjects, ...completionSubjects])];
  if(!view.subjectId || !mySubjectsInClass.includes(view.subjectId)) view.subjectId=mySubjectsInClass[0];

  const cls=getClass(view.classId);
  const sub=getSubject(view.subjectId);
  const isCompletionSubject=subjectUsesCompletion(view.subjectId);
  const sts=cls?studentsOfClass(cls.id):[];

  const wrap=el(`<div>
    ${pageHeader('Zaključivanje','Finalne ocjene i status odradio za predmete bez ocjene','check-circle-2',
      `<select id="clsSel" class="form-input" style="width:auto;">
        ${mySchedClasses.map(cid=>`<option value="${cid}" ${cid===view.classId?'selected':''}>${getClass(cid)?.name}</option>`).join('')}
      </select>
      <select id="subSel" class="form-input" style="width:auto;">
        ${mySubjectsInClass.map(sid=>`<option value="${sid}" ${sid===view.subjectId?'selected':''}>${getSubject(sid)?.name}${subjectUsesCompletion(sid)?' (odradio)':''}</option>`).join('')}
      </select>
      <select id="semSel" class="form-input" style="width:auto;">
        ${db.semesters.map(s=>`<option value="${s.id}" ${s.id===view.semesterId?'selected':''}>${s.name}${s.closed?' (zatvoren)':''}</option>`).join('')}
      </select>`)}
    <div class="p-8">
      ${semClosed?`<div class="card p-4 mb-4 bg-red-50 border-red-200 text-red-800 flex items-center gap-2"><i data-lucide="lock"></i> Semestar je zatvoren - nije moguće dodavati niti mijenjati ocjene.</div>`:''}
      ${(!cls||!sub||!sem)?'<div class="text-center text-slate-500 py-12">Odaberite razred, predmet i semestar.</div>':isCompletionSubject?renderFinalizeCompletionMarkup(cls, sub, sem, sts, semClosed):`
      <div class="card overflow-hidden">
        <div class="p-4 bg-slate-50 border-b border-slate-100 flex items-center gap-3 flex-wrap">
          <span class="badge bg-pink-50 text-pink-700">${cls.name}</span>
          <span class="badge text-white" style="background:${sub.color}">${sub.name}</span>
          <span class="badge bg-indigo-50 text-indigo-700">${sem.name}</span>
          <span class="ml-auto text-xs text-slate-600">Min. ocjena: <b>${reqGrades}</b></span>
        </div>
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-xs uppercase text-slate-500 text-left">
            <tr>
              <th class="px-4 py-3">Učenik</th>
              <th class="px-4 py-3">Ocjene (semestar)</th>
              <th class="px-4 py-3">Prosjek</th>
              <th class="px-4 py-3">Zaključeno</th>
              <th class="px-4 py-3">Popravni</th>
              <th class="px-4 py-3 text-right">Akcije</th>
            </tr>
          </thead>
          <tbody>
            ${sts.map(s=>{
              const grades=collectGradesFor(s.id, sub.id, me.id, sem.id);
              const avg=grades.length?(grades.reduce((a,b)=>a+b.value,0)/grades.length):0;
              const final=db.finalGrades.find(f=>f.studentId===s.id && f.subjectId===sub.id && f.semesterId===sem.id);
              const hasEnough = grades.length>=reqGrades;
              return `<tr class="border-t border-slate-100 ${!hasEnough?'bg-amber-50/40':''}">
                <td class="px-4 py-3 font-medium flex items-center gap-2">${s.name}
                  ${!hasEnough?`<span class="badge bg-amber-100 text-amber-700" title="Manje od ${reqGrades} ocjena">${grades.length}/${reqGrades}</span>`:''}
                </td>
                <td class="px-4 py-3"><div class="flex flex-wrap gap-1">${grades.map(g=>`<span class="grade-pill ${gradeClass(g.value)}" title="${g.note||''}">${g.value}</span>`).join('')||'<span class="text-slate-400 text-xs">nema</span>'}</div></td>
                <td class="px-4 py-3">${grades.length?`<b>${avg.toFixed(2)}</b> <span class="text-xs text-slate-500">(≈ ${Math.round(avg)})</span>`:'-'}</td>
                <td class="px-4 py-3">${final?`<span class="grade-pill ${gradeClass(final.value)}" style="height:28px; min-width:36px; font-size:14px;">${final.value}</span>${final.improved?'<span class="badge bg-blue-100 text-blue-700 ml-2">popravljeno</span>':''}${final.status==='popravni'?'<span class="badge bg-amber-100 text-amber-700 ml-2">popravni</span>':''}${final.status==='passed'?'<span class="badge bg-emerald-100 text-emerald-700 ml-2">prošao</span>':''}${final.status==='failed'?'<span class="badge bg-red-100 text-red-700 ml-2">pao</span>':''}`:'<span class="text-slate-400 text-xs">nije zaključeno</span>'}</td>
                <td class="px-4 py-3 text-sm">${final && final.popravniValue?`<span class="grade-pill ${gradeClass(final.popravniValue)}">${final.popravniValue}</span> <span class="text-xs text-slate-500">${final.popravniDate||''}</span>`:final && final.status==='popravni'?'<span class="text-amber-600 text-xs">čeka termin</span>':'-'}</td>
                <td class="px-4 py-3 text-right">
                  ${semClosed?'<span class="text-xs text-slate-400">zaključano</span>':`
                    ${!final?`<button data-close="${s.id}" data-avg="${avg.toFixed(2)}" class="btn btn-primary" style="padding:4px 8px; font-size:11px;" ${!hasEnough?'title="Manje od minimuma ocjena"':''}><i data-lucide="check" class="icon-sm"></i> Zaključi</button>`:''}
                    ${final && final.status==='closed' && final.value===1?`<button data-pop="${s.id}" class="btn" style="padding:4px 8px; font-size:11px; background:#f59e0b; color:white;"><i data-lucide="alert-circle" class="icon-sm"></i> Popravni</button>`:''}
                    ${final && final.status==='popravni'?`<button data-popgrade="${s.id}" class="btn" style="padding:4px 8px; font-size:11px; background:#10b981; color:white;"><i data-lucide="check-square" class="icon-sm"></i> Unesi popravni</button>`:''}
                    ${final && (final.status==='closed'||final.status==='passed') && final.value>1?`<button data-improve="${s.id}" class="btn btn-soft" style="padding:4px 8px; font-size:11px;"><i data-lucide="trending-up" class="icon-sm"></i> Popravi</button>`:''}
                    ${final?`<button data-unlock="${s.id}" class="btn-ghost" title="Otključaj"><i data-lucide="unlock" class="icon-sm"></i></button>`:''}
                  `}
                </td>
              </tr>`;
            }).join('') || '<tr><td colspan="6" class="text-center py-8 text-slate-500">Nema učenika.</td></tr>'}
          </tbody>
        </table>
      </div>`}
    </div>
  </div>`);
  wrap.querySelector('#clsSel')?.addEventListener('change', e=>{
    view.classId=e.target.value;
    const subs=[...new Set([
      ...db.schedule.filter(s=>s.teacherId===me.id && s.classId===view.classId && !subjectUsesCompletion(s.subjectId)).map(s=>s.subjectId),
      ...(homeroom?.id===view.classId?completionSubjectsForClass(view.classId).map(s=>s.id):[]),
      ...db.schedule.filter(s=>s.teacherId===me.id && s.classId===view.classId && subjectUsesCompletion(s.subjectId)).map(s=>s.subjectId)
    ])];
    view.subjectId=subs[0]; render();
  });
  wrap.querySelector('#subSel')?.addEventListener('change', e=>{ view.subjectId=e.target.value; render(); });
  wrap.querySelector('#semSel')?.addEventListener('change', e=>{ view.semesterId=e.target.value; render(); });
  wrap.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>openCloseGradeModal(b.dataset.close, sub.id, sem.id, +b.dataset.avg, reqGrades)));
  wrap.querySelectorAll('[data-pop]').forEach(b=>b.addEventListener('click', ()=>{
    const f=db.finalGrades.find(x=>x.studentId===b.dataset.pop && x.subjectId===sub.id && x.semesterId===sem.id);
    f.status='popravni'; f.popravniDate=null; f.popravniValue=null;
    saveDB(); render();
  }));
  wrap.querySelectorAll('[data-popgrade]').forEach(b=>b.addEventListener('click', ()=>openPopravniModal(b.dataset.popgrade, sub.id, sem.id)));
  wrap.querySelectorAll('[data-improve]').forEach(b=>b.addEventListener('click', ()=>openImproveModal(b.dataset.improve, sub.id, sem.id)));
  wrap.querySelectorAll('[data-unlock]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Otključati i obrisati zaključenu ocjenu?')){
      db.finalGrades=db.finalGrades.filter(f=>!(f.studentId===b.dataset.unlock && f.subjectId===sub.id && f.semesterId===sem.id));
      saveDB(); render();
    }
  }));
  wrap.querySelectorAll('[data-finalize-comp]').forEach(b=>b.addEventListener('click', ()=>{
    const [studentId, status]=b.dataset.finalizeComp.split('|');
    const old=getCompletion(studentId, sub.id, sem.id);
    setCompletion(studentId, cls.id, sub.id, sem.id, status, old?.note||'');
    saveDB(); render();
  }));
  wrap.querySelectorAll('[data-finalize-comp-note]').forEach(b=>b.addEventListener('click', ()=>{
    const studentId=b.dataset.finalizeCompNote;
    const old=getCompletion(studentId, sub.id, sem.id);
    const note=prompt('Napomena:', old?.note||'');
    if(note===null) return;
    setCompletion(studentId, cls.id, sub.id, sem.id, old?.status||'pending', note);
    saveDB(); render();
  }));
  return wrap;
}

function renderFinalizeCompletionMarkup(cls, sub, sem, sts, semClosed){
  return `<div class="card overflow-hidden">
    <div class="p-4 bg-emerald-50 border-b border-emerald-100 flex items-center gap-3 flex-wrap">
      <span class="badge bg-pink-50 text-pink-700">${cls.name}</span>
      <span class="badge text-white" style="background:${sub.color}">${sub.name}</span>
      <span class="badge bg-emerald-100 text-emerald-700">bez brojčanih ocjena</span>
      <span class="badge bg-indigo-50 text-indigo-700">${sem.name}</span>
      <span class="ml-auto text-xs text-emerald-800">Zaključivanje ovdje znači: odradio / nije odradio / čeka.</span>
    </div>
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-xs uppercase text-slate-500 text-left">
        <tr><th class="px-4 py-3">Učenik</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Napomena</th><th class="px-4 py-3 text-right">Akcije</th></tr>
      </thead>
      <tbody>
        ${sts.map(s=>{ const c=getCompletion(s.id, sub.id, sem.id); return `<tr class="border-t border-slate-100 hover:bg-slate-50">
          <td class="px-4 py-3 font-medium">${s.name}</td>
          <td class="px-4 py-3">${completionBadge(c?.status)}</td>
          <td class="px-4 py-3 text-slate-600">${c?.note||'-'}</td>

            ${semClosed?'<span class="text-xs text-slate-400">zaključano</span>':`
              <button data-finalize-comp="${s.id}|completed" class="btn btn-soft" style="padding:5px 10px;font-size:12px;">Odradio</button>
              <button data-finalize-comp="${s.id}|not_completed" class="btn btn-danger" style="padding:5px 10px;font-size:12px;">Nije</button>
              <button data-finalize-comp="${s.id}|pending" class="btn btn-soft" style="padding:5px 10px;font-size:12px;">Čeka</button>
              <button data-finalize-comp-note="${s.id}" class="btn btn-soft" style="padding:5px 10px;font-size:12px;"><i data-lucide="sticky-note" class="icon-sm"></i></button>
            `}
          </td>
        </tr>`; }).join('') || '<tr><td colspan="4" class="text-center py-8 text-slate-500">Nema učenika.</td></tr>'}
      </tbody>
    </table>
  </div>`;
}

function openCloseGradeModal(studentId, subjectId, semesterId, suggestedAvg, reqGrades){
  const stud=getUser(studentId);
  const me=getUser(session.userId);
  const grades=collectGradesFor(studentId, subjectId, me.id, semesterId);
  if(grades.length<reqGrades){
    if(!confirm(`Učenik ima samo ${grades.length} ocjena (minimum je ${reqGrades}). Sigurno želite zaključiti?`)) return;
  }
  let selectedG=Math.max(1, Math.round(suggestedAvg||3));
  const m=openModal(`Zaključna ocjena · ${stud.name}`,`
    <div class="space-y-3">
      <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-3 text-sm">
        <i data-lucide="info" class="inline icon-sm text-indigo-600"></i> Predloženi prosjek: <b>${suggestedAvg.toFixed(2)}</b> → <b>${Math.round(suggestedAvg)||'-'}</b>
      </div>
      <div><label class="text-sm font-medium">Zaključna ocjena (1=nedovoljan)</label>
        <div class="flex gap-2 mt-2">
          ${[1,2,3,4,5].map(n=>`<button data-g="${n}" class="grade-pick flex-1 py-3 border-2 ${n===selectedG?'bg-indigo-600 text-white border-indigo-600':'border-slate-200'} rounded-lg font-bold text-xl">${n}</button>`).join('')}
        </div>
      </div>
      <div><label class="text-sm font-medium">Napomena</label><input id="f_note" class="form-input" placeholder="opcionalno"></div>
    </div>`, ()=>{
    db.finalGrades.push({ id:uid('fg'), studentId, subjectId, semesterId, teacherId:me.id, value:selectedG, status:'closed', note:m.querySelector('#f_note').value, ts:Date.now() });
    saveDB(); render(); return true;
  });
  m.querySelectorAll('.grade-pick').forEach(b=>b.addEventListener('click', ()=>{
    selectedG=+b.dataset.g;
    m.querySelectorAll('.grade-pick').forEach(x=>{ x.classList.remove('bg-indigo-600','text-white','border-indigo-600'); x.classList.add('border-slate-200'); });
    b.classList.add('bg-indigo-600','text-white','border-indigo-600');
  }));
}

function openImproveModal(studentId, subjectId, semesterId){
  const stud=getUser(studentId);
  const f=db.finalGrades.find(x=>x.studentId===studentId && x.subjectId===subjectId && x.semesterId===semesterId);
  let selectedG=null;
  const m=openModal(`Popravljanje ocjene · ${stud.name}`, `
    <div class="space-y-3">
      <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm">
        <i data-lucide="info" class="inline icon-sm text-blue-600"></i> Trenutna ocjena: <span class="grade-pill ${gradeClass(f.value)}" style="display:inline-flex;">${f.value}</span> · Možete je zamijeniti većom.
      </div>
      <div><label class="text-sm font-medium">Nova ocjena</label>
        <div class="flex gap-2 mt-2">
          ${[1,2,3,4,5].map(n=>`<button data-g="${n}" class="grade-pick flex-1 py-3 border-2 border-slate-200 rounded-lg font-bold text-xl hover:bg-blue-50 hover:border-blue-400 ${n<=f.value?'opacity-40':''}" ${n<=f.value?'disabled':''}>${n}</button>`).join('')}
        </div>
        <div class="text-xs text-slate-500 mt-1">Možete odabrati samo veću od trenutne.</div>
      </div>
      <div><label class="text-sm font-medium">Razlog/napomena</label><input id="f_note" class="form-input" placeholder="npr. Dodatno ispitivanje, popravak"></div>
    </div>`, ()=>{
    if(!selectedG){ alert('Odaberite ocjenu'); return false; }
    f.previousValue = f.value;
    f.value = selectedG;

function openHomeworkModal(id, presetClassId, presetSubjectId, presetTeacherId, presetScheduleId=''){
  const me=getUser(session.userId);
  const h=id?db.homework.find(x=>x.id===id):{ id:uid('hw'), classId:presetClassId||'', subjectId:presetSubjectId||'', teacherId:presetTeacherId||me.id, scheduleId:presetScheduleId||'', title:'', description:'', assignedDate:todayStr(), dueDate:'', doneBy:[], marks:{} };

  const myScheds = db.schedule.filter(s=>s.teacherId===me.id);
  const myClasses = [...new Set(myScheds.map(s=>s.classId))];
  const m=openModal(id?'Uredi zadaću':'Nova zadaća', `
    <div class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-sm font-medium">Razred</label>
          <select id="f_cls" class="form-input">${myClasses.map(cid=>`<option value="${cid}" ${h.classId===cid?'selected':''}>${getClass(cid)?.name}</option>`).join('')}</select></div>

      </div>
      <div><label class="text-sm font-medium">Naslov</label><input id="f_t" class="form-input" value="${h.title}"></div>
      <div><label class="text-sm font-medium">Opis</label><textarea id="f_d" rows="4" class="form-input">${h.description||''}</textarea></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-sm font-medium">Zadana</label><input id="f_a" type="date" class="form-input" value="${h.assignedDate}"></div>
        <div><label class="text-sm font-medium">Rok</label><input id="f_due" type="date" class="form-input" value="${h.dueDate||''}"></div>
      </div>
      <div><label class="text-sm font-medium">Prikaži u rasporedu na času</label><select id="f_slot" class="form-input"></select>
        <div class="text-xs text-slate-500 mt-1">Ako ima više časova istog predmeta na isti datum, zadaća će se prikazati samo na ovdje odabranom času.</div>
      </div>
    </div>
  `, ()=>{
    h.classId=m.querySelector('#f_cls').value;
    h.subjectId=m.querySelector('#f_sub').value;
    h.title=m.querySelector('#f_t').value.trim();
    h.description=m.querySelector('#f_d').value.trim();
    h.assignedDate=m.querySelector('#f_a').value;
    h.dueDate=m.querySelector('#f_due').value;
    h.scheduleId=m.querySelector('#f_slot').value;
    if(!Array.isArray(h.doneBy)) h.doneBy=[];
    if(!h.marks || typeof h.marks!=='object') h.marks={};
    if(!h.title||!h.classId||!h.subjectId){ alert('Razred, predmet i naslov su obavezni'); return false; }
    if(id) Object.assign(db.homework.find(x=>x.id===id),h); else db.homework.push(h);
    saveDB(); render(); return true;
  });
  function syncSubs(){
    const cid=m.querySelector('#f_cls').value;
    const subsForClass=[...new Set(db.schedule.filter(s=>s.teacherId===me.id && s.classId===cid).map(s=>s.subjectId))];
    m.querySelector('#f_sub').innerHTML = subsForClass.map(sid=>`<option value="${sid}" ${h.subjectId===sid?'selected':''}>${getSubject(sid)?.name}</option>`).join('');
    syncSlots();
  }
  function syncSlots(){
    const cid=m.querySelector('#f_cls').value;
    const sid=m.querySelector('#f_sub').value || h.subjectId;
    const slots=db.schedule.filter(s=>s.teacherId===me.id && s.classId===cid && s.subjectId===sid).sort((a,b)=>a.day-b.day||a.period-b.period);
    m.querySelector('#f_slot').innerHTML='<option value="">Prvi odgovarajući čas tog datuma</option>'+slots.map(s=>`<option value="${s.id}" ${h.scheduleId===s.id?'selected':''}>${DAYS_SHORT[s.day]} · ${s.period+1}. čas (${PERIODS[s.period].s}) ${s.room?'· '+s.room:''}</option>`).join('');
  }
  m.querySelector('#f_cls').addEventListener('change', syncSubs);
  m.querySelector('#f_sub').addEventListener('change', syncSlots);
  syncSubs();
}

function renderTeacherSubstitutions(){

    const s=db.substitutions.find(x=>x.id===b.dataset.id); s.status=b.dataset.act; saveDB(); render();

function renderSubRequestsTable(list, incoming){

  return `<div class="card overflow-hidden">
    <table class="w-full text-sm">

      </thead>
      <tbody>
        ${list.slice().reverse().map(s=>{
          const sc=db.schedule.find(x=>x.id===s.scheduleId); if(!sc) return '';
          const sub=getSubject(sc.subjectId), cls=getClass(sc.classId);
          const otherName = incoming ? getUser(s.substituteTeacherId)?.name : getUser(s.originalTeacherId)?.name;
          const statusBadge = s.status==='pending'?'bg-amber-50 text-amber-700':s.status==='accepted'?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700';
          const statusLabel = s.status==='pending'?'Na čekanju':s.status==='accepted'?'Prihvaćeno':'Odbijeno';
          return `<tr class="border-t border-slate-100">
            <td class="px-4 py-3 font-medium">${s.date}</td>
            <td class="px-4 py-3"><span class="badge text-white" style="background:${sub?.color}">${sub?.name||''}</span> <span class="text-xs text-slate-500">${DAYS_SHORT[sc.day]}, ${sc.period+1}.č</span></td>
            <td class="px-4 py-3">${cls?.name||''}</td>
            <td class="px-4 py-3">${otherName||''}</td>
            <td class="px-4 py-3 text-slate-600 text-xs">${s.reason||'-'}</td>
            <td class="px-4 py-3"><span class="badge ${statusBadge}">${statusLabel}</span></td>
            <td class="px-4 py-3 text-right">
              ${incoming && s.status==='pending'?`
                <button data-act="accepted" data-id="${s.id}" class="btn btn-primary" style="padding:4px 8px; font-size:11px;"><i data-lucide="check" class="icon-sm"></i> Prihvati</button>
                <button data-act="declined" data-id="${s.id}" class="btn btn-danger" style="padding:4px 8px; font-size:11px;"><i data-lucide="x" class="icon-sm"></i> Odbij</button>
              `:''}
              ${!incoming && s.status==='pending'?`<button data-cancel="${s.id}" class="btn btn-danger" style="padding:4px 8px; font-size:11px;"><i data-lucide="trash-2" class="icon-sm"></i> Otkaži</button>`:''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function openSubRequestModal(){
  const me=getUser(session.userId);
  const others=db.users.filter(u=>u.role==='teacher' && u.id!==me.id);
  const m=openModal('Zahtjev za zamjenu','<div id="sb"></div>', ()=>{
    const tid=m.querySelector('#f_t').value;
    const date=m.querySelector('#f_d').value;
    const sched=m.querySelector('#f_sc').value;
    const reason=m.querySelector('#f_r').value;
    if(!tid||!date||!sched){ alert('Sve podatke popunite'); return false; }
    db.substitutions.push({ id:uid('sub'), originalTeacherId:tid, substituteTeacherId:me.id, scheduleId:sched, date, reason, status:'pending', ts:Date.now() });
    saveDB(); render(); return true;
  });
  function build(){
    const tid=m.querySelector('#f_t')?.value || others[0]?.id;
    const date=m.querySelector('#f_d')?.value || todayStr();
    const dow=(new Date(date).getDay()+6)%7;
    const slots=tid?db.schedule.filter(s=>s.teacherId===tid && s.day===dow):[];
    m.querySelector('#sb').innerHTML=`
      <div class="space-y-3">
        <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm text-blue-800">
          <i data-lucide="info" class="inline icon-sm"></i> Tražite da <b>VI</b> mijenjate odabranog kolegu. Kolega mora prihvatiti.
        </div>
        <div><label class="text-sm font-medium">Profesor kojeg mijenjate</label>
          <select id="f_t" class="form-input">${others.map(o=>`<option value="${o.id}" ${o.id===tid?'selected':''}>${o.name}</option>`).join('')}</select></div>
        <div><label class="text-sm font-medium">Datum</label><input id="f_d" type="date" class="form-input" value="${date}"></div>
        <div><label class="text-sm font-medium">Čas (${DAYS[dow]})</label>
          <select id="f_sc" class="form-input">
            ${slots.length?slots.map(s=>{ const sub=getSubject(s.subjectId), cls=getClass(s.classId); return `<option value="${s.id}">${s.period+1}. čas (${PERIODS[s.period].s}) - ${sub?.name} - ${cls?.name}</option>`; }).join(''):'<option value="">Nema časova</option>'}
          </select>
        </div>
        <div><label class="text-sm font-medium">Razlog</label><input id="f_r" class="form-input" placeholder="opcionalno"></div>
      </div>`;
    m.querySelector('#f_t').addEventListener('change', build);
    m.querySelector('#f_d').addEventListener('change', build);
    if(window.lucide) lucide.createIcons();
  }
  build();
}

function openBehaviorNoteModal({classId, studentId='', type='pohvala'}={}){
  const me=getUser(session.userId);
  const cls=getClass(classId) || getClass(getUser(studentId)?.classId) || getClass(teacherClassIds(me.id)[0]);
  const students=cls?studentsOfClass(cls.id):[];
  const m=openModal(type==='pohvala'?'Nova pohvala':'Nova opomena', `
    <div class="space-y-3">
      <div><label class="text-sm font-medium">Razred</label><input class="form-input" value="${cls?.name||''}" disabled></div>
      <div><label class="text-sm font-medium">Učenik</label>
        <select id="f_student" class="form-input">${students.map(s=>`<option value="${s.id}" ${s.id===studentId?'selected':''}>${s.name}</option>`).join('')}</select></div>
      <div><label class="text-sm font-medium">Tip</label>
        <select id="f_type" class="form-input"><option value="pohvala" ${type==='pohvala'?'selected':''}>Pohvala</option><option value="opomena" ${type==='opomena'?'selected':''}>Opomena</option></select></div>
      <div><label class="text-sm font-medium">Tekst</label><textarea id="f_text" rows="4" class="form-input" placeholder="Upišite razlog i detalje..."></textarea></div>
    </div>`, ()=>{
    const sid=m.querySelector('#f_student').value;

    db.classNotes.push({ id:uid('n'), studentId:sid, classId:cls.id, type:t, text, byTeacherId:me.id, date:todayStr() });

  wrap.querySelector('#semSel').addEventListener('change', e=>{ view.semesterId=e.target.value; render(); });
  wrap.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ view.hrTab=b.dataset.tab; render(); }));

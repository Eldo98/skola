<!DOCTYPE html>
<html lang="bs">

<style>
  :root{
    --bg:#eef2f8; --card:#ffffff; --border:#dbe3ef; --text:#0f172a; --muted:#5f6f86;
    --primary:#2563eb; --primary-50:#eaf2ff; --navy:#082f57;
    --shadow:0 18px 45px rgba(15,23,42,.08);
  }
  body { font-family: 'Inter','Segoe UI', system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .drag-over { background: #eef2ff !important; outline: 2px dashed var(--primary); }
  .lesson-card { cursor: grab; }
  .lesson-card:active { cursor: grabbing; }
  .fadeIn { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:none;} }
  [data-lucide] { width: 18px; height: 18px; flex-shrink:0; }
  .icon-lg [data-lucide] { width: 22px; height: 22px; }
  .icon-xl [data-lucide] { width: 28px; height: 28px; }
  .icon-sm [data-lucide] { width: 14px; height: 14px; }
  .form-input { width:100%; margin-top:0.25rem; padding:0.58rem 0.85rem; border:1px solid var(--border); border-radius:0.85rem; outline:none; font-size:14px; background:white; transition:all .15s; }
  .form-input:focus { box-shadow: 0 0 0 3px rgba(37,99,235,.15); border-color:#93b7f5; }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:9999px; font-size:12px; font-weight:500; white-space:nowrap; border:1px solid rgba(148,163,184,.25);}
  input.hw_mark:checked + .badge { outline:2px solid #2563eb; outline-offset:2px; }
  .tab-btn { padding: 10px 16px; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; cursor: pointer; font-size:14px; }
  .tab-btn.active { color: var(--primary); border-color: var(--primary); }
  .tab-btn:hover:not(.active) { color:#334155; }
  .substitute-stripe { background-image: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(255,255,255,.18) 8px, rgba(255,255,255,.18) 16px); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:0.85rem; font-size:14px; font-weight:600; transition:all .15s; cursor:pointer; border:none; }
  .btn-primary { background:var(--primary); color:white; }
  .btn-primary:hover { background:#4338ca; }
  .btn-soft { background:#f8fafc; color:#334155; border:1px solid var(--border); }
  .btn-soft:hover { background:#eef4fb; }
  .btn-ghost { background:transparent; color:#475569; padding:6px; border-radius:0.65rem; }
  .btn-ghost:hover { background:#eef4fb; }
  .btn-danger { background:#fef2f2; color:#dc2626; }
  .btn-danger:hover { background:#fee2e2; }
  .card { background:white; border:1px solid var(--border); border-radius:18px; box-shadow:0 1px 0 rgba(15,23,42,.02); }
  .card-soft { background:white; border:1px solid #edf2f7; border-radius:18px; }
  .schedule-cell { transition: transform .15s, box-shadow .15s, border-color .15s; }
  .schedule-cell:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(15,23,42,.09); }
  .grade-pill { display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px; padding:0 6px; border-radius:6px; font-weight:700; font-size:12px; color:white; }
  .grade-1{background:#ef4444}.grade-2{background:#f97316}.grade-3{background:#eab308}.grade-4{background:#22c55e}.grade-5{background:#10b981}
  .app-shell{ min-height:100vh; background:linear-gradient(180deg,var(--navy) 0 14px,var(--bg) 14px 100%); }
  .app-frame{ width:min(1640px,calc(100vw - 64px)); margin:0 auto; padding:32px 0 40px; }
  .top-card{ background:rgba(255,255,255,.96); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
  .brand-mark{ width:40px; height:40px; border-radius:12px; background:#426ee8; display:flex; align-items:center; justify-content:center; color:white; }
  .status-chip{ display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px; border-radius:999px; border:1px solid var(--border); background:#f7faff; color:#52627a; font-size:14px; }
  .status-dot{ width:12px; height:12px; border-radius:999px; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.13); }
  .workspace{ display:grid; grid-template-columns:312px minmax(0,1fr); gap:16px; margin-top:16px; align-items:start; }
  .sidebar-card{ background:rgba(255,255,255,.95); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); padding:14px 12px; position:sticky; top:24px; }

  .lesson-event.subbed{ opacity:.58; }

  .classroom-board{ position:relative; min-height:620px; background:#fff; border:1px solid #d8e2ef; border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
  .classroom-board::before{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 22% 18%,rgba(37,99,235,.045),transparent 24%),linear-gradient(#fff,#fff); pointer-events:none; }
  .classroom-title{ position:absolute; left:5.5%; top:7%; font-size:24px; font-weight:900; letter-spacing:-.02em; font-style:italic; }
  .classroom-subtitle{ position:absolute; left:8%; top:45%; font-size:22px; font-weight:900; font-style:italic; }
  .seat-token{ position:absolute; min-width:150px; max-width:190px; transform:translate(-50%,-50%); cursor:grab; user-select:none; }
  .seat-token:active{ cursor:grabbing; }
  .seat-card{ background:white; border:1px solid #dbe3ef; border-radius:16px; padding:10px 12px; box-shadow:0 10px 24px rgba(15,23,42,.08); }
  .seat-card.present,.seat-card.absent,.seat-card.late{ border-left:1px solid #dbe3ef; background:white; }
  .seat-actions{ display:flex; gap:4px; margin-top:6px; }
  .seat-actions button{ font-size:10px; padding:2px 6px; border-radius:999px; }
  .seat-grade{ display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 8px; border-radius:8px; background:#f1f5f9; color:#0f172a; font-weight:900; font-size:16px; border:1px solid #dbe3ef; }
  .rich-toolbar{ display:flex; flex-wrap:wrap; gap:6px; padding:8px; border:1px solid var(--border); border-bottom:0; border-radius:14px 14px 0 0; background:#f8fafc; }
  .rich-toolbar button,.rich-toolbar select{ border:1px solid var(--border); background:white; border-radius:9px; padding:6px 9px; font-size:13px; color:#0f172a; }
  .rich-editor{ min-height:170px; padding:14px 16px; border:1px solid var(--border); border-radius:0 0 14px 14px; background:white; outline:none; line-height:1.6; }
  .rich-editor:empty:before{ content:attr(data-placeholder); color:#94a3b8; }
  .notebook-shell{ perspective:1400px; }
  .notebook-page{ background:#fffdf7; border:1px solid #eadfc8; border-radius:18px; box-shadow:0 20px 45px rgba(88,64,32,.12); min-height:620px; transform-origin:left center; transition:transform .45s ease, box-shadow .45s ease; position:relative; overflow:hidden; }
  .notebook-page.flip{ transform:rotateY(-8deg); box-shadow:0 26px 60px rgba(88,64,32,.18); }
  .notebook-page::before{ content:""; position:absolute; left:52px; top:0; bottom:0; width:2px; background:#f2c7c7; opacity:.8; }
  .notebook-lines{ background-image:linear-gradient(to bottom, transparent 31px, rgba(59,130,246,.12) 32px); background-size:100% 32px; }
  body.high-contrast{ --bg:#f7f9fc; --primary:#0f4c81; --primary-50:#e8f2ff; }
  .app-main > div > .bg-white.border-b.border-slate-200{ border:1px solid var(--border)!important; border-radius:20px; box-shadow:var(--shadow); }
  @media (max-width: 980px){ .app-frame{ width:calc(100vw - 24px); padding-top:20px; } .workspace{ grid-template-columns:1fr; } .sidebar-card{ position:static; } }
  @media (max-width: 700px){
    body{ font-size:15px; }
    .app-shell{ background:linear-gradient(180deg,var(--navy) 0 10px,var(--bg) 10px 100%); }
    .app-frame{ width:calc(100vw - 16px); padding:14px 0 22px; }
    .top-card{ border-radius:18px; padding:12px; align-items:flex-start; flex-direction:column; }
    .top-card > div{ width:100%; }
    .top-card .status-chip{ height:28px; padding:0 9px; font-size:12px; }
    .top-card .status-chip:nth-of-type(3){ display:none; }
    .workspace{ gap:10px; margin-top:10px; }
    .sidebar-card{ border-radius:16px; padding:10px; overflow:hidden; }
    .menu-caption{ display:none; }
    .sidebar-card nav{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
    .menu-item{ flex:0 0 auto; padding:10px 12px; font-size:13px; white-space:nowrap; border-radius:12px; }
    .menu-item span.flex-1{ flex:0 0 auto; }
    .page-toolbar{ border-radius:16px; padding:14px; gap:10px; }
    .page-toolbar > div:last-child{ width:100%; justify-content:flex-start; }
    .page-toolbar .form-input{ min-width:0; max-width:100%; }
    .page-toolbar .btn{ flex:1 1 auto; justify-content:center; }
    .page-title{ font-size:18px; }
    .page-subtitle{ white-space:normal; }
    .app-main > div{ gap:10px; }
    .desktop-schedule{ display:none; }
    .mobile-schedule{ display:block; }
    .mobile-day-card{ background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
    .mobile-day-head{ padding:13px 14px; background:#f6f8fb; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .mobile-event{ background:#fff; border:1px solid #dbe3ef; border-left:4px solid var(--event-color,#2563eb); border-radius:13px; padding:12px; }
    .classroom-board{ min-height:720px; overflow:auto; }
    .classroom-title{ top:4%; left:6%; font-size:20px; }
    .classroom-subtitle{ top:18%; left:6%; font-size:18px; }
    .seat-token{ min-width:140px; }
    .card{ border-radius:14px; }
    .card.overflow-hidden{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .card table{ min-width:620px; }
    .card.p-5,.card.p-6{ padding:14px!important; }
    #csTabs, .px-8.pt-4.border-b.border-slate-200.flex{ overflow-x:auto; padding-left:12px!important; padding-right:12px!important; }
    .tab-btn{ flex:0 0 auto; }
    .p-8{ padding:12px!important; }
    .grid.lg\:grid-cols-3, .grid.md\:grid-cols-4, .grid.md\:grid-cols-3, .grid.md\:grid-cols-2{ grid-template-columns:1fr!important; }
    .fixed.inset-0{ align-items:flex-start; overflow-y:auto; }
    .fixed.inset-0 > .bg-white{ margin-top:8px; max-width:calc(100vw - 16px)!important; }
  }
</style>

<script>
/* =========================================================
   eŠkola - SPA  v3
   ========================================================= */

const LS_KEY = 'eskola_db_v3';

const DEFAULT_DB = {
  users: [{ id:'u1', username:'admin', password:'admin', role:'admin', name:'Administrator', email:'admin@skola.ba' }],
  classes: [],
  subjects: [],
  semesters: [],   // { id,name,start,end,active,closed,requiredGrades }
  schedule: [],    // { id,classId,day,period,subjectId,teacherId,room }
  specialClasses: [], // { id,title,date,period,subjectId,teacherId,room,studentIds,description,createdBy,createdAt }
  lessons: [],
  classSessions: [], // { id,scheduleId,date,semesterId,lessonId,notes,privateNotes:{teacherId:text},conductedBy,attendance,grades }
  substitutions: [],
  finalGrades: [], // { id,studentId,subjectId,semesterId,teacherId,value,previousValue,improved,popravniValue,popravniDate,note,status,ts }
  completions: [], // { id,studentId,classId,subjectId,semesterId,status:'pending|completed|not_completed',note,byTeacherId,ts }
  classDuties: [], // { id,classId,start,end,studentIds,note,createdBy,createdAt }
  seatingPlans: [], // { classId,seats:{studentId:{x,y}} }
  studentProfiles: [], // { studentId, about, health, talents, support, family, notes, updatedBy, updatedAt, sentAt }
  absenceRequests: [], // { id,parentId,studentId,classId,scheduleId,date,type,reason,status,note,decidedBy,decidedAt,createdAt }
  classNotes: [],
  homework: [],    // { id,classId,subjectId,teacherId,scheduleId,title,description,assignedDate,dueDate,doneBy,marks:{studentId:'+'|'-'|'o'} }
  assessments: [], // { id,classId,subjectId,teacherId,scheduleId,type,title,description,date,createdBy,studentIds:[] }
  materials: [],   // { id,title,description,source:'url|local',url,dataUrl,mime,fileName,classId,subjectId,scheduleId,scheduleIds:[],createdBy,createdAt }
  notebookPages: [], // { id,teacherId,title,content,createdAt,updatedAt }
  botLogs: [],     // { id,userId,date,kind,ts }
  messages: []     // { id,fromId,toId,subject,body,ts,readAt,attachments:[] }
};

const DAYS = ['Ponedjeljak','Utorak','Srijeda','Četvrtak','Petak'];
const DAYS_SHORT = ['PON','UTO','SRI','ČET','PET'];
const PERIODS = [
  { s:'08:00', e:'08:45' }, { s:'08:50', e:'09:35' }, { s:'09:55', e:'10:40' }, { s:'10:45', e:'11:30' },
  { s:'11:50', e:'12:35' }, { s:'12:40', e:'13:25' }, { s:'13:30', e:'14:15' }, { s:'14:20', e:'15:05' }
];
const SUBJECT_COLORS = ['#4f46e5','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#3b82f6'];
const GRADE_TYPES = [
  { v:'oral', label:'Usmeno' }, { v:'written', label:'Pismeno' },
  { v:'test', label:'Kontrolni' }, { v:'activity', label:'Aktivnost' }, { v:'homework', label:'Zadaća' }
];
const ASSESSMENT_TYPES = [
  { v:'test', label:'Test' }, { v:'oral', label:'Usmeno ispitivanje' },
  { v:'quiz', label:'Kviz/Kontrolni' }, { v:'project', label:'Projekat' }
];

const FIREBASE_CONFIG_KEY = 'eskola_firebase_config_v1';
const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "AIzaSyBOG1TyQvTqBrljvaetqAiTT2SObYqKOe4",
  authDomain: "helloworld-d6cf3.firebaseapp.com",
  databaseURL: "https://helloworld-d6cf3-default-rtdb.firebaseio.com",
  projectId: "helloworld-d6cf3",
  storageBucket: "helloworld-d6cf3.firebasestorage.app",
  messagingSenderId: "5547576635",
  appId: "1:5547576635:web:3ae2abd72950da9a93fb1e",
  measurementId: "G-641E84M8B6"
};
let firebaseRef = null;
let firebaseStatus = 'local';
let firebaseError = '';
let firebaseApplyingRemote = false;
let firebaseSyncTimer = null;
let localSaveTimer = null;
let pendingRemoteSnapshot = null;
const FIREBASE_CLIENT_ID_KEY = 'eskola_client_id_v1';
const FIREBASE_CLIENT_ID = (()=>{
  let id = localStorage.getItem(FIREBASE_CLIENT_ID_KEY);
  if(!id){ id = 'client_' + Math.random().toString(36).slice(2,10); localStorage.setItem(FIREBASE_CLIENT_ID_KEY, id); }
  return id;
})();

let db = loadDB();
let session = null;
let view = { name: 'login' };

function loadDB(){
  try { const raw = localStorage.getItem(LS_KEY); if(raw) return normalizeDB(JSON.parse(raw)); } catch(e){}
  return seedDB();
}
function saveDB(){
  db = normalizeDB(db);
  localStorage.setItem(LS_KEY, JSON.stringify(db));
  scheduleFirebasePush();
}
function debouncedSaveDB(delay=700){
  clearTimeout(localSaveTimer);
  localSaveTimer=setTimeout(saveDB, delay);
}

function normalizeDB(data){
  const d = data || JSON.parse(JSON.stringify(DEFAULT_DB));
  ['users','classes','subjects','semesters','schedule','specialClasses','lessons','classSessions','substitutions','finalGrades','completions','classDuties','seatingPlans','studentProfiles','absenceRequests','classNotes','homework','assessments','materials','notebookPages','botLogs','messages'].forEach(k=>{
    if(!Array.isArray(d[k])) d[k]=[];
  });
  d.users.forEach(u=>{ if(u.role==='parent' && !Array.isArray(u.childrenIds)) u.childrenIds=[]; if(typeof u.isBot!=='boolean') u.isBot=false; if(!Array.isArray(u.botDates)) u.botDates=[]; if(!u.botStyle) u.botStyle='normal'; });
  d.absenceRequests.forEach(r=>{ if(!r.status) r.status='pending'; if(!r.type) r.type='planned'; if(typeof r.scheduleId==='undefined') r.scheduleId=''; });
  d.seatingPlans.forEach(p=>{ if(!p.seats || typeof p.seats!=='object' || Array.isArray(p.seats)) p.seats={}; });
  d.subjects.forEach(s=>{ if(!s.gradingMode) s.gradingMode='grades'; });
  d.semesters.forEach(s=>{ if(typeof s.requiredGrades!=='number') s.requiredGrades=4; if(typeof s.closed!=='boolean') s.closed=false; });
  d.schedule.forEach(s=>{ if(typeof s.room==='undefined') s.room=''; });
  d.specialClasses.forEach(c=>{ if(!Array.isArray(c.studentIds)) c.studentIds=[]; if(typeof c.period==='string') c.period=+c.period; if(typeof c.room==='undefined') c.room=''; if(typeof c.description==='undefined') c.description=''; });
  d.homework.forEach(h=>{
    if(!Array.isArray(h.doneBy)) h.doneBy=[];
    if(typeof h.scheduleId==='undefined') h.scheduleId='';
    if(!h.marks || typeof h.marks!=='object' || Array.isArray(h.marks)) h.marks={};
    h.doneBy.forEach(id=>{ if(!h.marks[id]) h.marks[id]='+'; });
  });
  d.assessments.forEach(a=>{ if(typeof a.scheduleId==='undefined') a.scheduleId=''; if(!Array.isArray(a.studentIds)) a.studentIds=[]; });
  d.materials.forEach(m=>{
    if(!m.source) m.source=m.url?'url':'local';
    if(typeof m.scheduleId==='undefined') m.scheduleId='';
    if(!Array.isArray(m.scheduleIds)) m.scheduleIds=[];
    if(m.scheduleId && !m.scheduleIds.includes(m.scheduleId)) m.scheduleIds.push(m.scheduleId);
    if(!m.scheduleId && m.scheduleIds.length===1) m.scheduleId=m.scheduleIds[0];
    if(typeof m.classId==='undefined') m.classId='';
    if(typeof m.subjectId==='undefined') m.subjectId='';
  });
  d.messages.forEach(m=>{ if(!Array.isArray(m.attachments)) m.attachments=[]; });
  d.classSessions.forEach(cs=>{ if(!cs.privateNotes) cs.privateNotes={}; if(!Array.isArray(cs.grades)) cs.grades=[]; if(!Array.isArray(cs.attendance)) cs.attendance=[]; });
  return d;
}

function seedDB(){
  const d = JSON.parse(JSON.stringify(DEFAULT_DB));
  d.semesters = [
    { id:'sem1', name:'I polugodište 2025/26', start:'2025-09-01', end:'2026-01-31', active:true,  closed:false, requiredGrades:4 },
    { id:'sem2', name:'II polugodište 2025/26', start:'2026-02-01', end:'2026-06-20', active:false, closed:false, requiredGrades:4 }
  ];
  d.subjects = [
    { id:'s1', name:'Matematika', color:'#4f46e5' },
    { id:'s2', name:'Bosanski jezik', color:'#ef4444' },
    { id:'s3', name:'Engleski jezik', color:'#10b981' },
    { id:'s4', name:'Historija', color:'#f59e0b' },
    { id:'s5', name:'Biologija', color:'#8b5cf6' },
    { id:'s6', name:'Informatika', color:'#06b6d4' },
    { id:'s7', name:'Fizika', color:'#ec4899' }
  ];

function absenceRequestMatches(req, studentId, scheduleId, date){
  if(req.studentId!==studentId || req.date!==date) return false;
  if(req.scheduleId) return req.scheduleId===scheduleId;
  const sc=db.schedule.find(s=>s.id===scheduleId);

}
function absenceDecisionFor(studentId, scheduleId, date){

    .filter(r=>['approved_excused','rejected_unexcused'].includes(r.status) && absenceRequestMatches(r, studentId, scheduleId, date))

}

}
function simpleHash(str){
  let h=0;
  for(let i=0;i<str.length;i++) h=((h<<5)-h)+str.charCodeAt(i)|0;
  return Math.abs(h);
}
function botRan(userId,date,kind){ return db.botLogs.some(l=>l.userId===userId && l.date===date && l.kind===kind); }
function markBotRan(userId,date,kind){ db.botLogs.push({id:uid('botlog'),userId,date,kind,ts:Date.now()}); }
function botShouldRun(user,date,force=false){ return user?.isBot && (force || (user.botDates||[]).includes(date)); }
function ensureSessionForSchedule(scheduleId,date,conductedBy){
  const sc=db.schedule.find(s=>s.id===scheduleId); if(!sc) return null;
  let cs=db.classSessions.find(x=>x.scheduleId===scheduleId && x.date===date);
  if(!cs){
    const students=studentsOfClass(sc.classId);
    cs={ id:uid('cs'), scheduleId, date, semesterId:semesterForDate(date)?.id||activeSemester()?.id||null, lessonId:null, notes:'', privateNotes:{}, conductedBy, attendance:students.map(s=>({studentId:s.id,status:'present'})), grades:[] };
    db.classSessions.push(cs);
  }
  if(!Array.isArray(cs.attendance)) cs.attendance=[];
  studentsOfClass(sc.classId).forEach(s=>{ if(!cs.attendance.find(a=>a.studentId===s.id)) cs.attendance.push({studentId:s.id,status:'present'}); });
  return cs;
}
function runTeacherBot(user,date,force=false){
  if(!botShouldRun(user,date,force) || (!force && botRan(user.id,date,'teacher'))) return 0;
  const dow=(parseLocalDate(date).getDay()+6)%7;
  const slots=db.schedule.filter(s=>s.teacherId===user.id && s.day===dow);
  let actions=0;
  slots.forEach(sc=>{
    const cs=ensureSessionForSchedule(sc.id,date,user.id); if(!cs) return;
    const students=studentsOfClass(sc.classId);
    cs.notes = cs.notes || `Bot ${user.name} je evidentirao čas (${getSubject(sc.subjectId)?.name||''}).`;
    cs.conductedBy=user.id;
    students.forEach((st,i)=>{
      const att=cs.attendance.find(a=>a.studentId===st.id);
      const h=simpleHash(`${user.id}-${date}-${sc.id}-${st.id}`);
      att.status = h%13===0 ? 'absent' : h%11===0 ? 'late' : 'present';
      if(att.status==='present' && !cs.grades.some(g=>g.studentId===st.id) && h%5===0 && !subjectUsesCompletion(sc.subjectId)){
        cs.grades.push({id:uid('g'),studentId:st.id,value:(h%5)+1,type:'activity',note:'Bot unos - aktivnost na času',ts:Date.now(),bot:true});
      }
    });
    const lesson=db.lessons.find(l=>l.teacherId===user.id && l.subjectId===sc.subjectId);
    if(lesson && !cs.lessonId) cs.lessonId=lesson.id;
    const msgKey=`bot-msg-${user.id}-${date}-${sc.id}`;
    if(!db.botLogs.some(l=>l.kind===msgKey)){
      students.forEach(st=>db.messages.push({id:uid('msg'),fromId:user.id,toId:st.id,subject:`Obavještenje: ${getSubject(sc.subjectId)?.name||''}`,body:`Automatsko obavještenje za ${getClass(sc.classId)?.name||''}: čas je evidentiran za ${date}.`,ts:Date.now(),readAt:null,attachments:[],bot:true}));
      markBotRan(user.id,date,msgKey);
    }
    actions++;
  });
  markBotRan(user.id,date,'teacher');
  return actions;
}
function runParentBot(user,date,force=false){
  if(!botShouldRun(user,date,force) || (!force && botRan(user.id,date,'parent'))) return 0;
  let actions=0;
  childrenOfParent(user.id).forEach(child=>{
    const dow=(parseLocalDate(date).getDay()+6)%7;
    const slot=db.schedule.find(s=>s.classId===child.classId && s.day===dow);
    if(!slot) return;
    const exists=db.absenceRequests.some(r=>r.parentId===user.id && r.studentId===child.id && r.date===date && r.scheduleId===slot.id);
    if(!exists){
      db.absenceRequests.push({id:uid('abs'),parentId:user.id,studentId:child.id,classId:child.classId,scheduleId:slot.id,date,type:'planned',reason:'Bot roditelj: najavljeno odsustvo.',status:'pending',note:'',decidedBy:null,decidedAt:null,createdAt:Date.now(),bot:true});
      actions++;
    }
  });
  markBotRan(user.id,date,'parent');
  return actions;
}
function runStudentBot(user,date,force=false){
  if(!botShouldRun(user,date,force) || (!force && botRan(user.id,date,'student'))) return 0;
  let actions=0;
  db.homework.filter(h=>h.classId===user.classId && h.dueDate && h.dueDate>=date).slice(0,3).forEach(h=>{
    if(homeworkMark(h,user.id)!=='+'){ setHomeworkMark(h,user.id,'+'); actions++; }
  });
  const teachers=[...new Set(db.schedule.filter(s=>s.classId===user.classId).map(s=>s.teacherId))].map(getUser).filter(Boolean);
  teachers.slice(0,1).forEach(t=>db.messages.push({id:uid('msg'),fromId:user.id,toId:t.id,subject:'Bot učenik - potvrda',body:`Učenik bot ${user.name} je automatski potvrdio aktivnosti za ${date}.`,ts:Date.now(),readAt:null,attachments:[],bot:true}));
  markBotRan(user.id,date,'student');
  return actions;
}
function runBots(date=todayStr(), force=false){
  let count=0;
  db.users.filter(u=>u.isBot).forEach(u=>{
    if(u.role==='teacher') count+=runTeacherBot(u,date,force);
    if(u.role==='parent') count+=runParentBot(u,date,force);
    if(u.role==='student') count+=runStudentBot(u,date,force);
  });
  if(count) saveDB();
  return count;
}
function applyAbsenceRequestDecision(req){
  db.classSessions.forEach(cs=>{
    if(cs.date!==req.date) return;
    const sc=db.schedule.find(s=>s.id===cs.scheduleId);
    if(!sc || sc.classId!==req.classId) return;
    if(req.scheduleId && req.scheduleId!==sc.id) return;
    if(!Array.isArray(cs.attendance)) cs.attendance=[];
    let att=cs.attendance.find(a=>a.studentId===req.studentId);
    if(!att){ att={studentId:req.studentId,status:'absent'}; cs.attendance.push(att); }
    att.status='absent';
    att.excused=req.status==='approved_excused';
    att.absenceRequestId=req.id;
  });
}

function parseLocalDate(dateStr){
  const [y,m,d]=(dateStr||todayStr()).split('-').map(Number);
  return new Date(y, (m||1)-1, d||1);
}
function toDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function startOfWeek(dateStr){
  const d=parseLocalDate(dateStr||todayStr());
  const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return toDateStr(d);
}
function addDays(dateStr, days){
  const d=parseLocalDate(dateStr||todayStr());
  d.setDate(d.getDate()+days);
  return toDateStr(d);
}
function shortDate(dateStr){

function isOfficeFile(material){
  const name=(material.fileName||material.url||material.title||'').toLowerCase();
  return /\.(ppt|pptx|doc|docx|xls|xlsx)$/i.test(name) || /powerpoint|presentation|word|excel|officedocument/i.test(material.mime||'');
}
function isPdfFile(material){
  const name=(material.fileName||material.url||'').toLowerCase();
  return (material.mime||'').includes('pdf') || name.endsWith('.pdf');
}
function isImageFile(material){ return (material.mime||'').startsWith('image/'); }
function isTextFile(material){ return (material.mime||'').startsWith('text/') || /\.(txt|md|csv|json)$/i.test(material.fileName||material.url||''); }
function materialUrl(material){ return material.source==='url' ? material.url : material.dataUrl; }
function materialIcon(material){
  if(isOfficeFile(material)) return 'presentation';
  if(isPdfFile(material)) return 'file-text';
  if(isImageFile(material)) return 'image';
  if(isTextFile(material)) return 'file-type';
  return 'paperclip';
}
function materialScheduleIds(material){
  const ids=Array.isArray(material.scheduleIds)?material.scheduleIds.slice():[];
  if(material.scheduleId && !ids.includes(material.scheduleId)) ids.push(material.scheduleId);
  return ids.filter(Boolean);
}
function materialVisibleTo(material, user){
  if(user.role==='admin') return true;
  if(material.createdBy===user.id) return true;
  const scheduleIds=materialScheduleIds(material);
  if(user.role==='teacher'){
    const classIds=teacherClassIds(user.id);
    return (!material.classId && !material.subjectId && !scheduleIds.length) ||
      (material.classId && classIds.includes(material.classId)) ||
      (material.subjectId && (user.subjects||[]).includes(material.subjectId)) ||
      (scheduleIds.length && db.schedule.some(s=>scheduleIds.includes(s.id) && s.teacherId===user.id));
  }
  if(user.role==='student'){
    return (!material.classId && !material.subjectId && !scheduleIds.length) ||
      material.classId===user.classId ||
      (scheduleIds.length && db.schedule.some(s=>scheduleIds.includes(s.id) && s.classId===user.classId)) ||
      (material.subjectId && db.schedule.some(s=>s.classId===user.classId && s.subjectId===material.subjectId));
  }
  return false;
}
function materialScopeLabel(material){
  const scheduleIds=materialScheduleIds(material);
  if(scheduleIds.length===1){ const s=db.schedule.find(x=>x.id===scheduleIds[0]); return `Čas: ${getClass(s?.classId)?.name||''} · ${getSubject(s?.subjectId)?.name||''} · ${DAYS_SHORT[s?.day]||''} ${typeof s?.period==='number'?s.period+1:''}. čas`; }
  if(scheduleIds.length>1) return `Uvezeno u ${scheduleIds.length} časova`;
  if(material.classId && material.subjectId) return `${getClass(material.classId)?.name||''} · ${getSubject(material.subjectId)?.name||''}`;
  if(material.classId) return `Razred ${getClass(material.classId)?.name||''}`;
  if(material.subjectId) return getSubject(material.subjectId)?.name||'Predmet';
  return 'Svi korisnici';
}
function materialSortValue(material){
  const firstScheduleId=materialScheduleIds(material)[0];
  const s=firstScheduleId?db.schedule.find(x=>x.id===firstScheduleId):null;
  const className=getClass(material.classId || s?.classId)?.name || 'ZZZ';
  const subjectName=getSubject(material.subjectId || s?.subjectId)?.name || 'ZZZ';
  const day=typeof s?.day==='number'?s.day:9;
  const period=typeof s?.period==='number'?s.period:99;
  return `${className}|${day}|${period}|${subjectName}|${material.title||''}`;
}
function sortMaterialsByClassAndPeriod(a,b){
  const av=materialSortValue(a), bv=materialSortValue(b);
  if(av!==bv) return av.localeCompare(bv);
  return (b.createdAt||0)-(a.createdAt||0);
}
function materialMatchesSlot(material, slot){
  return materialScheduleIds(material).includes(slot.id);
}
function materialCanImportToSlot(material, slot){
  if(materialScheduleIds(material).includes(slot.id)) return false;
  if(material.subjectId && material.subjectId!==slot.subjectId) return false;
  if(material.classId && material.classId!==slot.classId) return false;
  return true;
}
function specialClassForStudent(studentId, date, period){

function specialClassesForTeacher(teacherId, date, period){

function isTypingNow(){
  const a=document.activeElement;
  return !!a && (a.tagName==='TEXTAREA' || a.tagName==='INPUT' || a.isContentEditable);
}

function getFirebaseConfig(){
  return { ...DEFAULT_FIREBASE_CONFIG, path: 'eskola/main' };
}
function ensureFirebaseApp(){
  if(typeof firebase==='undefined') throw new Error('Firebase SDK nije učitan.');
  const cfg=getFirebaseConfig();
  return firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
}
function firebaseLabel(){
  if(firebaseStatus==='connected') return 'Firebase RTDB connected';
  if(firebaseStatus==='connecting') return 'Firebase connecting';
  if(firebaseStatus==='error') return 'Firebase error';
  return 'local mode';
}
function initFirebaseSync(){
  const cfg = getFirebaseConfig();
  if(!cfg || !cfg.apiKey || !cfg.databaseURL){ firebaseStatus='local'; return; }
  if(typeof firebase==='undefined' || !firebase.database){ firebaseStatus='error'; firebaseError='Firebase SDK nije učitan.'; return; }
  try{
    firebaseStatus='connecting';
    const app = ensureFirebaseApp();
    firebaseRef = firebase.database(app).ref(cfg.path || 'eskola/main');
    firebaseRef.on('value', snap=>{
      const remote = snap.val();
      firebaseStatus='connected';
      firebaseError='';
      if(remote && remote.clientId===FIREBASE_CLIENT_ID) return;
      if(remote && remote.db && isTypingNow()){
        pendingRemoteSnapshot = remote;
        return;
      }
      if(remote && remote.db){
        firebaseApplyingRemote = true;
        db = normalizeDB(remote.db);
        localStorage.setItem(LS_KEY, JSON.stringify(db));
        firebaseApplyingRemote = false;
        if(session && !getUser(session.userId)){ session=null; localStorage.removeItem('eskola_session'); }
        render();
      } else {
        firebasePushNow();
      }
    }, err=>{
      firebaseStatus='error'; firebaseError=err.message || String(err); render();
    });
  } catch(err){
    firebaseStatus='error'; firebaseError=err.message || String(err);
  }
}
function scheduleFirebasePush(){
  if(!firebaseRef || firebaseApplyingRemote) return;
  clearTimeout(firebaseSyncTimer);
  firebaseSyncTimer=setTimeout(firebasePushNow, 350);
}
function firebasePushNow(){
  if(!firebaseRef || firebaseApplyingRemote) return;
  firebaseRef.set({ db: normalizeDB(db), updatedAt: Date.now(), clientId:FIREBASE_CLIENT_ID }).then(()=>{
    firebaseStatus='connected'; firebaseError='';
  }).catch(err=>{
    firebaseStatus='error'; firebaseError=err.message || String(err); render();
  });
}

function safeStorageName(name){
  return (name||'file').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(0,120);
}
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function uploadFileForApp(file, folder='files', onProgress=()=>{}){
  const maxFallback=8*1024*1024;
  const maxStorageFile=150*1024*1024;
  if(file.size>maxStorageFile) throw new Error('Datoteka je veća od 150MB. Pošaljite manju datoteku ili internet link.');
  if(typeof firebase!=='undefined' && firebase.storage){
    const app=ensureFirebaseApp();
    const path=`eskola/${folder}/${Date.now()}_${uid('file')}_${safeStorageName(file.name)}`;
    const task=firebase.storage(app).ref(path).put(file, { contentType:file.type||'application/octet-stream' });
    await new Promise((resolve,reject)=>{
      let lastProgressAt=Date.now();
      const watchdog=setInterval(()=>{
        if(Date.now()-lastProgressAt>25000){
          clearInterval(watchdog);
          try { task.cancel(); } catch(e) {}
          reject(new Error('Upload je zapeo na 0%. Provjerite Firebase Storage rules/CORS ili pošaljite materijal kao internet link.'));
        }
      }, 3000);
      task.on('state_changed', snap=>{
        lastProgressAt=Date.now();
        const pct=snap.totalBytes?Math.round((snap.bytesTransferred/snap.totalBytes)*100):0;
        onProgress(pct);
      }, err=>{ clearInterval(watchdog); reject(err); }, ()=>{ clearInterval(watchdog); resolve(); });
    });
    const url=await task.snapshot.ref.getDownloadURL();
    return { source:'url', url, dataUrl:'', mime:file.type||'application/octet-stream', fileName:file.name, size:file.size, storagePath:path };
  }
  if(file.size>maxFallback) throw new Error('Za datoteke veće od 8MB treba Firebase Storage. Provjerite storage rules ili koristite internet link.');
  const dataUrl=await readFileAsDataURL(file);
  return { source:'local', url:'', dataUrl, mime:file.type||'application/octet-stream', fileName:file.name, size:file.size };
}

document.addEventListener('focusout', ()=>{
  if(!pendingRemoteSnapshot) return;
  setTimeout(()=>{
    if(isTypingNow() || !pendingRemoteSnapshot) return;
    firebaseApplyingRemote=true;
    db=normalizeDB(pendingRemoteSnapshot.db);
    localStorage.setItem(LS_KEY, JSON.stringify(db));
    pendingRemoteSnapshot=null;
    firebaseApplyingRemote=false;
    render();
  }, 250);
});

          </thead>
          <tbody>
            ${list.map(m=>{ const other=getUser(view.msgTab==='sent'?m.toId:m.fromId); return `<tr class="border-t border-slate-100 hover:bg-slate-50 ${!m.readAt && view.msgTab==='inbox'?'bg-blue-50/50':''}">
              <td class="px-4 py-3 font-medium">${other?.name||'Korisnik'}</td>

              <td class="px-4 py-3 text-right">

                <button data-reply="${m.id}" class="btn btn-soft" style="padding:5px 10px;font-size:12px;"><i data-lucide="reply" class="icon-sm"></i> Odgovori</button>
              </td>
            </tr>`; }).join('')}
          </tbody>
        </table>`:`<div class="p-10 text-center text-slate-500">Nema poruka.</div>`}
      </div>
    </div>
  </div>`);
  wrap.querySelector('#composeBtn').addEventListener('click', ()=>openMessageModal());
  wrap.querySelector('#deleteMyMessages').addEventListener('click', ()=>{
    if(confirm('Obrisati sve vaše primljene i poslane poruke?')){
      db.messages=db.messages.filter(m=>m.fromId!==me.id && m.toId!==me.id);
      saveDB(); render();
    }
  });
  wrap.querySelector('#deleteAllMessages')?.addEventListener('click', ()=>{
    if(confirm('Obrisati SVE poruke u aplikaciji?')){ db.messages=[]; saveDB(); render(); }
  });
  wrap.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ view.msgTab=b.dataset.tab; render(); }));
  wrap.querySelectorAll('[data-open-msg]').forEach(b=>b.addEventListener('click', ()=>openMessageView(b.dataset.openMsg)));
  wrap.querySelectorAll('[data-reply]').forEach(b=>b.addEventListener('click', ()=>{
    const m=db.messages.find(x=>x.id===b.dataset.reply);
    const toId=m.fromId===me.id?m.toId:m.fromId;
    openMessageModal(toId, `Re: ${m.subject||''}`);
  }));
  return wrap;
}

/* ====== TEACHER NOTEBOOK ====== */
function renderTeacherNotebook(){
  const me=getUser(session.userId);
  let pages=db.notebookPages.filter(p=>p.teacherId===me.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  if(!pages.length){
    const p={id:uid('page'),teacherId:me.id,title:'Nova stranica',content:'',createdAt:Date.now(),updatedAt:Date.now()};
    db.notebookPages.push(p); pages=[p]; saveDB();
  }
  if(!view.pageId || !pages.some(p=>p.id===view.pageId)) view.pageId=pages[0].id;
  const page=pages.find(p=>p.id===view.pageId)||pages[0];
  const index=pages.findIndex(p=>p.id===page.id);
  const wrap=el(`<div>
    ${pageHeader('eSveska','Privatna profesorska bilježnica sa stranicama','notebook-tabs',
      `<button id="prevPage" class="btn btn-soft"><i data-lucide="arrow-left"></i> Prethodna</button>
       <span class="badge bg-slate-50 text-slate-700">Stranica ${index+1}/${pages.length}</span>
       <button id="nextPage" class="btn btn-soft">Sljedeća <i data-lucide="arrow-right"></i></button>
       <button id="newPage" class="btn btn-primary"><i data-lucide="plus"></i> Nova stranica</button>`)}
    <div class="p-8 grid lg:grid-cols-[260px_1fr] gap-4">
      <div class="card p-3 max-h-[720px] overflow-y-auto scrollbar-thin">
        <div class="font-bold px-2 py-2 flex items-center gap-2"><i data-lucide="list"></i> Stranice</div>
        <div class="space-y-1">
          ${pages.map((p,i)=>`<button data-page="${p.id}" class="w-full text-left px-3 py-2 rounded-xl ${p.id===page.id?'bg-blue-50 text-blue-700':'hover:bg-slate-50'}"><div class="font-semibold text-sm truncate">${i+1}. ${p.title||'Bez naslova'}</div><div class="text-xs text-slate-500">${p.updatedAt?new Date(p.updatedAt).toLocaleDateString('bs-BA'):''}</div></button>`).join('')}
        </div>
      </div>
      <div class="notebook-shell">
        <div id="notebookPage" class="notebook-page notebook-lines p-8 pl-20">
          <input id="pageTitle" class="w-full bg-transparent text-3xl font-black outline-none mb-5" value="${page.title||''}" placeholder="Naslov stranice">
          ${richTextEditorHTML('pageEditor', page.content||'', 'Pišite bilješke kao u svesci...')}
          <div class="flex items-center justify-between mt-4 gap-2 flex-wrap">
            <div class="text-xs text-slate-500">Automatsko čuvanje. Zadnja izmjena: ${page.updatedAt?new Date(page.updatedAt).toLocaleString('bs-BA'):'-'}</div>
            <button id="deletePage" class="btn btn-danger"><i data-lucide="trash-2"></i> Obriši stranicu</button>
          </div>
        </div>
      </div>
    </div>
  </div>`);
  function savePage(){
    page.title=wrap.querySelector('#pageTitle').value.trim()||'Bez naslova';
    page.content=richTextValue(wrap,'pageEditor');
    page.updatedAt=Date.now();
    debouncedSaveDB(700);
  }
  function turnTo(pageId){
    const nb=wrap.querySelector('#notebookPage');
    nb.classList.add('flip');
    setTimeout(()=>{ view.pageId=pageId; render(); }, 220);
  }
  wrap.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click', ()=>{ savePage(); turnTo(b.dataset.page); }));
  wrap.querySelector('#prevPage').addEventListener('click', ()=>{ savePage(); turnTo(pages[Math.max(0,index-1)].id); });
  wrap.querySelector('#nextPage').addEventListener('click', ()=>{ savePage(); turnTo(pages[Math.min(pages.length-1,index+1)].id); });
  wrap.querySelector('#newPage').addEventListener('click', ()=>{
    savePage();
    const p={id:uid('page'),teacherId:me.id,title:`Stranica ${pages.length+1}`,content:'',createdAt:Date.now(),updatedAt:Date.now()};
    db.notebookPages.push(p); saveDB(); turnTo(p.id);
  });
  wrap.querySelector('#deletePage').addEventListener('click', ()=>{
    if(pages.length<=1){ alert('Mora ostati barem jedna stranica.'); return; }
    if(confirm('Obrisati ovu stranicu iz eSveske?')){
      db.notebookPages=db.notebookPages.filter(p=>p.id!==page.id);
      saveDB(); view.pageId=(pages[index-1]||pages[index+1])?.id; render();
    }
  });
  wrap.querySelector('#pageTitle').addEventListener('input', savePage);
  wrap.querySelector('#pageEditor').addEventListener('input', savePage);
  setupRichText(wrap);
  return wrap;
}

function initMessageFileUpload(modal, setAttachments, setLoading){
  const input=modal.querySelector('#f_files');
  if(!input) return;
  input.addEventListener('change', e=>{
    const files=Array.from(e.target.files||[]);
    setAttachments([]);
    const saveBtn=modal.querySelector('#mSave');
    const info=modal.querySelector('#msgFileInfo');
    const listBox=modal.querySelector('#msgAttachList');
    if(!files.length){ if(info) info.textContent='Nema odabranih datoteka.'; if(listBox) listBox.innerHTML=''; return; }
    const total=files.reduce((sum,f)=>sum+f.size,0);
    if(total>250*1024*1024){ alert('Ukupna veličina datoteka je veća od 250MB. Pošaljite manje datoteka ili link.'); e.target.value=''; return; }
    setLoading(true);
    if(saveBtn){ saveBtn.disabled=true; saveBtn.classList.add('opacity-60','cursor-not-allowed'); }
    if(listBox) listBox.innerHTML=files.map(f=>`<div class="text-xs border border-slate-200 rounded-lg p-2"><b>${f.name}</b><div class="text-slate-500">čeka upload...</div></div>`).join('');
    Promise.all(files.map((file,idx)=>uploadFileForApp(file,'messages',pct=>{
      if(info) info.textContent=`Učitavanje ${idx+1}/${files.length}: ${file.name} (${pct}%)`;
      if(listBox){
        const children=[...listBox.children];
        if(children[idx]) children[idx].innerHTML=`<b>${file.name}</b><div class="text-slate-500">${pct}%</div>`;
      }
    }).then(payload=>({ id:uid('att'), name:file.name, mime:file.type||payload.mime, size:file.size, dataUrl:payload.dataUrl||'', url:payload.url||'', source:payload.source, storagePath:payload.storagePath||'' })))).then(list=>{
      setAttachments(list);
      setLoading(false);
      if(saveBtn){ saveBtn.disabled=false; saveBtn.classList.remove('opacity-60','cursor-not-allowed'); }
      if(info) info.textContent=`Spremno za slanje: ${list.map(a=>a.name).join(', ')}`;
      if(listBox) listBox.innerHTML=list.map(a=>`<div class="text-xs border border-emerald-200 bg-emerald-50 rounded-lg p-2"><b>${a.name}</b><div class="text-emerald-700">učitano ${a.source==='url'?'u cloud':'lokalno'}</div></div>`).join('');
    }).catch(err=>{
      setLoading(false);
      if(saveBtn){ saveBtn.disabled=false; saveBtn.classList.remove('opacity-60','cursor-not-allowed'); }
      if(info) info.textContent='Greška pri učitavanju. Provjerite Firebase Storage ili pošaljite kao link.';
      if(listBox) listBox.innerHTML=`<div class="text-xs border border-red-200 bg-red-50 text-red-700 rounded-lg p-2">${err.message||'Upload nije uspio.'}</div>`;
      alert(err.message||'Greška pri učitavanju datoteka.');
    });
  });
}

function openMessageModal(toId='', subject=''){
  const me=getUser(session.userId);
  const allUsers=db.users.filter(u=>u.id!==me.id);
  const taughtClassIds=me.role==='teacher'?teacherClassIds(me.id):[];
  const taughtStudents=db.users.filter(u=>u.role==='student' && taughtClassIds.includes(u.classId));
  const taughtStudentIds=taughtStudents.map(u=>u.id);
  const taughtParents=db.users.filter(u=>u.role==='parent' && (u.childrenIds||[]).some(id=>taughtStudentIds.includes(id)));
  let recipientOptions=[];
  if(me.role==='admin') recipientOptions=allUsers;
  else if(me.role==='teacher') recipientOptions=[...db.users.filter(u=>u.role==='teacher'&&u.id!==me.id), ...taughtStudents, ...taughtParents, ...db.users.filter(u=>u.role==='admin')];
  else recipientOptions=allUsers;
  recipientOptions=[...new Map(recipientOptions.map(u=>[u.id,u])).values()].sort((a,b)=>a.name.localeCompare(b.name));

  const groups=[];
  if(me.role==='admin'){
    groups.push({label:'Svi profesori', ids:db.users.filter(u=>u.role==='teacher').map(u=>u.id)});
    groups.push({label:'Svi roditelji', ids:db.users.filter(u=>u.role==='parent').map(u=>u.id)});
    groups.push({label:'Svi učenici', ids:db.users.filter(u=>u.role==='student').map(u=>u.id)});
  }
  if(me.role==='teacher'){
    groups.push({label:'Svi profesori', ids:db.users.filter(u=>u.role==='teacher'&&u.id!==me.id).map(u=>u.id)});
    groups.push({label:'Svi učenici koje učim', ids:taughtStudentIds});
    groups.push({label:'Svi roditelji učenika koje učim', ids:taughtParents.map(u=>u.id)});
    taughtClassIds.forEach(cid=>{
      const cls=getClass(cid);
      const classStudents=db.users.filter(u=>u.role==='student'&&u.classId===cid);
      const classStudentIds=classStudents.map(u=>u.id);
      const classParents=db.users.filter(u=>u.role==='parent'&&(u.childrenIds||[]).some(id=>classStudentIds.includes(id)));
      groups.push({label:`Učenici ${cls?.name||''}`, ids:classStudentIds});
      groups.push({label:`Roditelji ${cls?.name||''}`, ids:classParents.map(u=>u.id)});
    });
  }
  const preselected=new Set(toId?[toId]:[]);
  let attachments=[];
  let filesLoading=false;
  const m=openModal('Nova poruka', `
    <div class="space-y-3">
      <div>
        <label class="text-sm font-medium">Primaoci</label>
        ${groups.length?`<div class="flex flex-wrap gap-2 mt-2">
          ${groups.filter(g=>g.ids.length).map((g,i)=>`<button type="button" data-select-group="${i}" class="btn btn-soft" style="padding:5px 10px;font-size:12px;">${g.label}</button>`).join('')}
          <button type="button" id="clearRecipients" class="btn btn-danger" style="padding:5px 10px;font-size:12px;">Poništi</button>
        </div>`:''}
        <input id="recipientSearch" class="form-input mt-2" placeholder="Pretraži primaoce po imenu, ulozi ili razredu...">
        <div class="border border-slate-200 rounded-xl p-3 mt-2 max-h-56 overflow-y-auto scrollbar-thin grid md:grid-cols-2 gap-2" id="recipientList">
          ${recipientOptions.map(u=>`<label data-recipient-row="${(u.name+' '+roleLabel(u.role)+' '+(getClass(u.classId)?.name||'')).toLowerCase()}" class="flex items-center gap-2 text-sm p-2 rounded-lg hover:bg-slate-50"><input type="checkbox" class="msg_to" value="${u.id}" ${preselected.has(u.id)?'checked':''}> <span>${u.name} <span class="text-xs text-slate-500">(${roleLabel(u.role)}${u.classId?' · '+(getClass(u.classId)?.name||''):''})</span></span></label>`).join('') || '<div class="text-sm text-slate-500">Nema dostupnih primalaca.</div>'}
        </div>
        <div id="recipientCount" class="text-xs text-slate-500 mt-1">Odabrano: ${preselected.size}</div>
      </div>
      <div><label class="text-sm font-medium">Naslov</label><input id="f_subj" class="form-input" value="${subject}"></div>
      <div><label class="text-sm font-medium">Poruka</label>${richTextEditorHTML('f_body_editor','', 'Napišite poruku...')}</div>
      <div><label class="text-sm font-medium">Datoteke (opcionalno)</label><input id="f_files" type="file" multiple class="form-input" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.txt,.md,.csv,.json,image/*"><div id="msgFileInfo" class="text-xs text-slate-500 mt-1">Čim izaberete datoteke, one se odmah učitavaju.</div><div id="msgAttachList" class="grid gap-2 mt-2"></div></div>
    </div>`, ()=>{
    if(filesLoading){ alert('Datoteke se još učitavaju, sačekajte.'); return false; }
    const recipients=[...new Set(Array.from(m.querySelectorAll('.msg_to:checked')).map(x=>x.value).filter(id=>id!==me.id))];
    const body=richTextPlain(m,'f_body_editor');
    if(!recipients.length||(!body && !attachments.length)){ alert('Odaberite barem jednog primaoca i unesite poruku ili dodajte datoteku.'); return false; }
    const subjectValue=m.querySelector('#f_subj').value.trim();
    const bodyHtml=richTextValue(m,'f_body_editor');
    recipients.forEach(toId=>db.messages.push({ id:uid('msg'), fromId:me.id, toId, subject:subjectValue, body, bodyHtml, ts:Date.now(), readAt:null, broadcast:recipients.length>1?'multi':null, attachments:attachments.map(a=>({...a})) }));
    saveDB(); render(); return true;
  });
  function syncRecipientCount(){ m.querySelector('#recipientCount').textContent='Odabrano: '+m.querySelectorAll('.msg_to:checked').length; }
  m.querySelectorAll('.msg_to').forEach(c=>c.addEventListener('change', syncRecipientCount));
  m.querySelectorAll('[data-select-group]').forEach(b=>b.addEventListener('click', ()=>{
    const group=groups[+b.dataset.selectGroup];
    m.querySelectorAll('.msg_to').forEach(c=>{ if(group.ids.includes(c.value)) c.checked=true; });
    syncRecipientCount();
  }));
  m.querySelector('#clearRecipients')?.addEventListener('click', ()=>{ m.querySelectorAll('.msg_to').forEach(c=>c.checked=false); syncRecipientCount(); });
  m.querySelector('#recipientSearch')?.addEventListener('input', e=>{
    const q=e.target.value.toLowerCase().trim();
    m.querySelectorAll('[data-recipient-row]').forEach(row=>row.classList.toggle('hidden', q && !row.dataset.recipientRow.includes(q)));
  });
  syncRecipientCount();
  setupRichText(m);
  initMessageFileUpload(m, v=>attachments=v, v=>filesLoading=v);
}

function openMessageView(id){
  const msg=db.messages.find(m=>m.id===id); if(!msg) return;
  const me=getUser(session.userId);
  if(msg.toId===me.id && !msg.readAt){ msg.readAt=Date.now(); saveDB(); }
  const from=getUser(msg.fromId), to=getUser(msg.toId);
  const modal=openModal(msg.subject||'Poruka', `
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div class="bg-slate-50 rounded-xl p-3"><div class="text-xs text-slate-500">Od</div><b>${from?.name||''}</b></div>
        <div class="bg-slate-50 rounded-xl p-3"><div class="text-xs text-slate-500">Prima</div><b>${to?.name||''}</b></div>
      </div>
      <div class="text-xs text-slate-500">${new Date(msg.ts).toLocaleString('bs-BA')}</div>
      <div class="border border-slate-200 rounded-xl p-4 text-sm leading-6">${msg.bodyHtml||`<div class="whitespace-pre-wrap">${msg.body||''}</div>`}</div>
      ${(msg.attachments||[]).length?`<div class="space-y-2"><div class="font-semibold text-sm">Datoteke</div>${msg.attachments.map(a=>`<div class="flex items-center justify-between gap-3 border border-slate-200 rounded-xl p-3"><div class="min-w-0"><div class="font-medium truncate">${a.name}</div><div class="text-xs text-slate-500">${a.mime||'datoteka'} · ${Math.round((a.size||0)/1024)} KB ${a.source==='url'?'· cloud':''}</div></div><button data-open-attachment="${a.id}" class="btn btn-soft" style="padding:5px 10px;font-size:12px;"><i data-lucide="download" class="icon-sm"></i> Otvori</button></div>`).join('')}</div>`:''}
    </div>`, ()=>true);
  modal.querySelector('#mSave').innerHTML='<i data-lucide="check"></i> Zatvori';
  modal.querySelectorAll('[data-open-attachment]').forEach(b=>b.addEventListener('click', ()=>{
    const att=(msg.attachments||[]).find(a=>a.id===b.dataset.openAttachment); if(!att) return;
    const a=document.createElement('a'); a.href=att.url||att.dataUrl; a.target='_blank'; if(!att.url) a.download=att.name||'datoteka'; document.body.appendChild(a); a.click(); a.remove();
  }));
  if(window.lucide) lucide.createIcons();
}

      path:wrap.querySelector('#fb_path').value.trim()||'eskola/main'
    };

    localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(next));
    alert('Firebase konfiguracija je sačuvana. Stranica će se osvježiti i povezati.');
    location.reload();
  });
  wrap.querySelector('#pushFb').addEventListener('click', ()=>{ firebasePushNow(); alert('Lokalni podaci su poslani ako je Firebase povezan.'); });

/* ====== HOMEWORK OVERVIEW ====== */
function homeworkScope(mode){
  const me=getUser(session.userId);
  if(mode==='admin') return db.homework.slice();
  if(mode==='teacher') return db.homework.filter(h=>h.teacherId===me.id);
  return db.homework.filter(h=>h.classId===me.classId);
}
function renderHomeworkOverview(mode='admin'){
  const list=homeworkScope(mode).sort((a,b)=>(a.dueDate||a.assignedDate||'').localeCompare(b.dueDate||b.assignedDate||''));
  const groups={};
  list.forEach(h=>{
    const key=h.dueDate || h.assignedDate || 'bez-datuma';
    if(!groups[key]) groups[key]=[];

/* ====== MATERIALS / FILES ====== */
function renderMaterials(mode){

    <div class="p-8">

            <button data-download-material="${m.id}" class="btn btn-soft" style="padding:6px 10px;font-size:12px;"><i data-lucide="download" class="icon-sm"></i> Preuzmi</button>
            ${(me.role==='admin'||m.createdBy===me.id)?`<button data-del-material="${m.id}" class="btn btn-danger" style="padding:6px 10px;font-size:12px;"><i data-lucide="trash-2" class="icon-sm"></i></button>`:''}

        </div>`).join(''):'<div class="col-span-3 card p-10 text-center text-slate-500">Nema materijala.</div>'}
      </div>

  wrap.querySelector('#addMaterial')?.addEventListener('click', ()=>openMaterialModal({}));

  wrap.querySelectorAll('[data-download-material]').forEach(b=>b.addEventListener('click', ()=>downloadMaterial(b.dataset.downloadMaterial)));

  return wrap;

function openMaterialModal(preset={}){
  const me=getUser(session.userId);
  let filePayload=null;
  let fileLoading=false;
  const lockedSchedule = preset.scheduleId ? db.schedule.find(s=>s.id===preset.scheduleId) : null;
  const lockedClassId = lockedSchedule?.classId || preset.classId || '';
  const lockedSubjectId = lockedSchedule?.subjectId || preset.subjectId || '';
  const availableSchedules = me.role==='admin' ? db.schedule : db.schedule.filter(s=>s.teacherId===me.id);
  const availableSubjects = me.role==='admin' ? db.subjects : db.subjects.filter(s=>(me.subjects||[]).includes(s.id));
  const classOptions = db.classes.map(c=>`<option value="${c.id}" ${lockedClassId===c.id?'selected':''}>${c.name}</option>`).join('');
  const subjectOptions = availableSubjects.map(s=>`<option value="${s.id}" ${lockedSubjectId===s.id?'selected':''}>${s.name}</option>`).join('');
  const scheduleOptions = (lockedSchedule?[lockedSchedule]:availableSchedules).map(s=>`<option value="${s.id}" ${preset.scheduleId===s.id?'selected':''}>${getClass(s.classId)?.name||''} · ${getSubject(s.subjectId)?.name||''} · ${DAYS_SHORT[s.day]} ${s.period+1}. čas</option>`).join('');
  const modal=openModal('Dodaj materijal', `
    <div class="space-y-3">
      <div><label class="text-sm font-medium">Naziv</label><input id="mat_title" class="form-input" placeholder="npr. Prezentacija - fotosinteza"></div>
      <div><label class="text-sm font-medium">Opis</label><textarea id="mat_desc" rows="3" class="form-input" placeholder="Kratak opis materijala..."></textarea></div>
      <div><label class="text-sm font-medium">Izvor</label>
        <select id="mat_source" class="form-input"><option value="url">Internet link</option><option value="local">Lokalna datoteka</option></select>
      </div>
      <div id="urlBox"><label class="text-sm font-medium">URL</label><input id="mat_url" class="form-input" placeholder="https://...pptx, pdf, docs..."></div>
      <div id="fileBox" class="hidden"><label class="text-sm font-medium">Datoteka</label><input id="mat_file" type="file" class="form-input" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.txt,.md,.csv,.json,image/*"><div id="fileInfo" class="text-xs text-slate-500 mt-1">Veće datoteke se šalju preko Firebase Storage. Za PowerPoint linkove se koristi Office online viewer.</div></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-sm font-medium">Razred</label><select id="mat_class" class="form-input" ${lockedSchedule?'disabled':''}><option value="">Svi</option>${classOptions}</select></div>
        <div><label class="text-sm font-medium">Predmet</label><select id="mat_subject" class="form-input" ${lockedSchedule?'disabled':''}>${lockedSchedule?'':'<option value="">Svi</option>'}${subjectOptions}</select></div>
      </div>
      <div><label class="text-sm font-medium">Tačan čas (opcionalno)</label><select id="mat_schedule" class="form-input" ${lockedSchedule?'disabled':''}>${lockedSchedule?'':'<option value="">Nije vezano za jedan čas</option>'}${scheduleOptions}</select>
        ${lockedSchedule?'<div class="text-xs text-blue-700 mt-1">Materijal dodajete iz časa, zato je zaključan na taj razred, predmet i čas.</div>':''}
      </div>
    </div>`, ()=>{
    if(fileLoading){ alert('Datoteka se još učitava, sačekajte trenutak.'); return false; }
    const source=modal.querySelector('#mat_source').value;
    const title=modal.querySelector('#mat_title').value.trim();
    if(!title){ alert('Naziv je obavezan.'); return false; }
    const mat={ id:uid('mat'), title, description:modal.querySelector('#mat_desc').value.trim(), source, url:'', dataUrl:'', mime:'', fileName:'', classId:modal.querySelector('#mat_class').value, subjectId:modal.querySelector('#mat_subject').value, scheduleId:modal.querySelector('#mat_schedule').value, scheduleIds:[], createdBy:me.id, createdAt:Date.now() };
    if(lockedSchedule){
      mat.classId=lockedSchedule.classId;
      mat.subjectId=lockedSchedule.subjectId;
      mat.scheduleId=lockedSchedule.id;
      mat.scheduleIds=[lockedSchedule.id];
    } else if(mat.scheduleId){
      const s=db.schedule.find(x=>x.id===mat.scheduleId);
      if(s){ mat.classId=s.classId; mat.subjectId=s.subjectId; }
      mat.scheduleIds=[mat.scheduleId];
    }
    if(source==='url'){
      mat.url=modal.querySelector('#mat_url').value.trim();
      if(!mat.url){ alert('URL je obavezan.'); return false; }
    } else {
      if(!filePayload){ alert('Odaberite datoteku.'); return false; }
      Object.assign(mat, filePayload);
    }
    db.materials.push(mat); saveDB(); render(); return true;
  });
  const sourceSel=modal.querySelector('#mat_source');
  function syncSource(){
    modal.querySelector('#urlBox').classList.toggle('hidden', sourceSel.value!=='url');
    modal.querySelector('#fileBox').classList.toggle('hidden', sourceSel.value!=='local');
  }
  sourceSel.addEventListener('change', syncSource); syncSource();
  modal.querySelector('#mat_file').addEventListener('change', e=>{
    const file=e.target.files?.[0]; if(!file) return;
    fileLoading=true; modal.querySelector('#fileInfo').textContent='Učitavanje datoteke...';
    uploadFileForApp(file,'materials',pct=>{
      modal.querySelector('#fileInfo').textContent=`Učitavanje: ${file.name} (${pct}%)`;
    }).then(payload=>{
      filePayload=payload;
      fileLoading=false;
      modal.querySelector('#fileInfo').textContent=`Učitano: ${file.name} (${Math.round(file.size/1024)} KB)${payload.source==='url'?' · cloud':''}`;
    }).catch(err=>{ fileLoading=false; e.target.value=''; alert(err.message||'Greška pri učitavanju datoteke.'); });
  });
}

function openImportMaterialModal(slot){
  const me=getUser(session.userId);
  const subject=getSubject(slot.subjectId);
  const cls=getClass(slot.classId);
  const candidates=db.materials
    .filter(m=>materialVisibleTo(m, me))
    .filter(m=>materialCanImportToSlot(m, slot))
    .sort(sortMaterialsByClassAndPeriod);
  let selectedId=candidates[0]?.id||'';
  const modal=openModal('Uvezi postojeći materijal', `
    <div class="space-y-3">
      <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 text-sm text-blue-800">
        Uvoz je ograničen na kompatibilne materijale. U čas <b>${subject?.name||''}</b> ne može se uvesti materijal iz drugog predmeta.
      </div>
      <div class="text-sm text-slate-600">Cilj: <b>${cls?.name||''}</b> · <b>${subject?.name||''}</b> · ${DAYS_SHORT[slot.day]} ${slot.period+1}. čas</div>
      <div class="space-y-2 max-h-80 overflow-y-auto scrollbar-thin">
        ${candidates.length?candidates.map(m=>`<label class="flex items-start gap-3 p-3 border border-slate-200 rounded-xl hover:bg-slate-50 cursor-pointer">
          <input type="radio" name="mat_import" class="mt-1" value="${m.id}" ${m.id===selectedId?'checked':''}>
          <div class="flex-1 min-w-0">
            <div class="font-bold truncate">${m.title}</div>
            <div class="text-xs text-slate-500 mt-1">${materialScopeLabel(m)} · ${m.source==='url'?'link':(m.fileName||'datoteka')}</div>
            ${m.description?`<div class="text-sm text-slate-600 mt-1 line-clamp-2">${m.description}</div>`:''}
          </div>
        </label>`).join(''):'<div class="text-center text-slate-500 py-8">Nema kompatibilnih materijala za uvoz.</div>'}
      </div>
    </div>`, ()=>{
    const chosen=modal.querySelector('input[name="mat_import"]:checked')?.value;
    if(!chosen){ alert('Odaberite materijal za uvoz.'); return false; }
    const src=db.materials.find(m=>m.id===chosen);
    if(!src) return false;
    if(!materialCanImportToSlot(src, slot)){ alert('Ovaj materijal ne pripada ovom predmetu/razredu.'); return false; }
    if(!Array.isArray(src.scheduleIds)) src.scheduleIds=[];
    if(src.scheduleId && !src.scheduleIds.includes(src.scheduleId)) src.scheduleIds.push(src.scheduleId);
    if(!src.scheduleIds.includes(slot.id)) src.scheduleIds.push(slot.id);
    if(!src.classId) src.classId=slot.classId;
    if(!src.subjectId) src.subjectId=slot.subjectId;
    src.importedTo=(src.importedTo||0)+1;
    saveDB(); render(); return true;
  });
}

function openMaterialViewer(id){
  const mat=db.materials.find(m=>m.id===id); if(!mat) return;
  const url=materialUrl(mat);
  let viewer='';
  if(mat.source==='url' && isOfficeFile(mat)) viewer=`<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}" class="w-full h-[70vh] rounded-xl border border-slate-200"></iframe>`;
  else if(isPdfFile(mat) || isImageFile(mat) || isTextFile(mat) || mat.source==='url') viewer=`<iframe src="${url}" class="w-full h-[70vh] rounded-xl border border-slate-200"></iframe>`;
  else viewer=`<div class="p-6 bg-amber-50 border border-amber-100 rounded-xl text-sm text-amber-800">Ova lokalna datoteka se ne može pregledati direktno u browseru. Kliknite "Preuzmi/Otvori". Za PowerPoint pregled bez instalacije najbolje je dodati javni internet URL, tada se otvara Office viewer.</div>`;
  const modal=openModal(mat.title, `<div class="space-y-3">
    <div class="text-sm text-slate-600">${mat.description||''}</div>
    ${viewer}
    <div class="flex gap-2"><button id="matOpenNew" class="btn btn-primary"><i data-lucide="external-link"></i> Otvori u novom tabu</button><button id="matDownload" class="btn btn-soft"><i data-lucide="download"></i> Preuzmi/Otvori</button></div>
  </div>`, ()=>true, 'max-w-5xl');
  modal.querySelector('#mSave').innerHTML='<i data-lucide="check"></i> Zatvori';
  modal.querySelector('#matOpenNew').addEventListener('click', ()=>window.open(url,'_blank'));
  modal.querySelector('#matDownload').addEventListener('click', ()=>downloadMaterial(id));
  if(window.lucide) lucide.createIcons();
}

function downloadMaterial(id){
  const mat=db.materials.find(m=>m.id===id); if(!mat) return;
  const a=document.createElement('a');
  a.href=materialUrl(mat); a.target='_blank'; a.rel='noopener';
  if(mat.source==='local') a.download=mat.fileName||mat.title||'materijal';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ====== ASSESSMENTS ====== */
function assessmentLabel(type){ return ASSESSMENT_TYPES.find(t=>t.v===type)?.label || type || 'Ispitivanje'; }
function assessmentScope(mode){
  const me=getUser(session.userId);
  if(mode==='admin') return db.assessments.slice();
  if(mode==='teacher') return db.assessments.filter(a=>a.teacherId===me.id || a.createdBy===me.id);
  return db.assessments.filter(a=>a.classId===me.classId && assessmentAppliesToStudent(a, me.id));
}

    a.classId=m.querySelector('#f_class').value;
    a.subjectId=m.querySelector('#f_subject').value;
    a.teacherId=isAdmin?m.querySelector('#f_teacher').value:me.id;
    a.scheduleId=m.querySelector('#f_slot').value;
    a.type=m.querySelector('#f_type').value;
    a.date=m.querySelector('#f_date').value;
    a.title=m.querySelector('#f_title').value.trim();
    a.description=m.querySelector('#f_desc').value.trim();
    a.studentIds=m.querySelector('#f_target').value==='selected' ? Array.from(m.querySelectorAll('.assess_student:checked')).map(x=>x.value) : [];
    if(!a.classId||!a.subjectId||!a.teacherId||!a.date||!a.title){ alert('Popunite razred, predmet, profesora, datum i naziv.'); return false; }
    if(m.querySelector('#f_target').value==='selected' && !a.studentIds.length){ alert('Odaberite barem jednog učenika ili izaberite cijeli razred.'); return false; }
    if(id) Object.assign(db.assessments.find(x=>x.id===id), a); else db.assessments.push(a);
    saveDB(); render(); return true;
  });
  function syncSubjectsAndTeachers(){
    const cid=m.querySelector('#f_class').value;
    const scheds=(isAdmin?db.schedule:db.schedule.filter(s=>s.teacherId===me.id)).filter(s=>s.classId===cid);
    const subjectIds=[...new Set(scheds.map(s=>s.subjectId))];
    if(!subjectIds.includes(a.subjectId)) a.subjectId=subjectIds[0]||'';
    m.querySelector('#f_subject').innerHTML=subjectIds.map(sid=>`<option value="${sid}" ${a.subjectId===sid?'selected':''}>${getSubject(sid)?.name||''}</option>`).join('');
    if(isAdmin){
      const sid=m.querySelector('#f_subject').value || a.subjectId;
      const teacherIds=[...new Set(db.schedule.filter(s=>s.classId===cid && (!sid||s.subjectId===sid)).map(s=>s.teacherId))];
      if(!teacherIds.includes(a.teacherId)) a.teacherId=teacherIds[0]||'';
      m.querySelector('#f_teacher').innerHTML=teacherIds.map(tid=>`<option value="${tid}" ${a.teacherId===tid?'selected':''}>${getUser(tid)?.name||''}</option>`).join('');
    }
    syncAssessmentStudents();
    syncAssessmentSlots();
  }
  function syncAssessmentStudents(){
    const cid=m.querySelector('#f_class').value;
    const students=studentsOfClass(cid);
    m.querySelector('#studentsChecks').innerHTML=students.map(s=>`<label class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50"><input type="checkbox" class="assess_student" value="${s.id}" ${a.studentIds.includes(s.id)?'checked':''}> <span>${s.name}</span></label>`).join('') || '<div class="text-sm text-slate-500">Nema učenika u razredu.</div>';
  }
  function syncAssessmentSlots(){
    const cid=m.querySelector('#f_class').value;
    const sid=m.querySelector('#f_subject').value || a.subjectId;
    const tid=isAdmin?(m.querySelector('#f_teacher')?.value||a.teacherId):me.id;
    const slots=db.schedule.filter(s=>s.classId===cid && s.subjectId===sid && (!tid||s.teacherId===tid)).sort((a,b)=>a.day-b.day||a.period-b.period);
    m.querySelector('#f_slot').innerHTML='<option value="">Prvi odgovarajući čas tog datuma</option>'+slots.map(s=>`<option value="${s.id}" ${a.scheduleId===s.id?'selected':''}>${DAYS_SHORT[s.day]} · ${s.period+1}. čas (${PERIODS[s.period].s}) ${s.room?'· '+s.room:''}</option>`).join('');
  }
  m.querySelector('#f_class').addEventListener('change', syncSubjectsAndTeachers);
  m.querySelector('#f_subject').addEventListener('change', syncSubjectsAndTeachers);
  m.querySelector('#f_teacher')?.addEventListener('change', syncAssessmentSlots);
  m.querySelector('#f_target').addEventListener('change', ()=>m.querySelector('#studentsBox').classList.toggle('hidden', m.querySelector('#f_target').value!=='selected'));
  syncSubjectsAndTeachers();
}

  const wrap=el(`<div>
    ${pageHeader('CV učenika','Administrativni profil učenika koji se šalje razredniku','id-card',

        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <label class="text-sm font-medium">Opšti opis<textarea id="p_about" rows="5" class="form-input">${profile.about||''}</textarea></label>
          <label class="text-sm font-medium">Zdravlje / važne napomene<textarea id="p_health" rows="5" class="form-input">${profile.health||''}</textarea></label>
          <label class="text-sm font-medium">Talenti / aktivnosti<textarea id="p_talents" rows="4" class="form-input">${profile.talents||''}</textarea></label>
          <label class="text-sm font-medium">Podrška u učenju<textarea id="p_support" rows="4" class="form-input">${profile.support||''}</textarea></label>
          <label class="text-sm font-medium">Porodica / kontakt<textarea id="p_family" rows="4" class="form-input">${profile.family||''}</textarea></label>
          <label class="text-sm font-medium">Dodatne napomene<textarea id="p_notes" rows="4" class="form-input">${profile.notes||''}</textarea></label>
        </div>
        <div class="flex gap-2 mt-5">
          <button id="saveProfile" class="btn btn-primary"><i data-lucide="save"></i> Sačuvaj CV</button>
          <div class="text-xs text-slate-500 self-center">Zadnja izmjena: ${profile.updatedAt?new Date(profile.updatedAt).toLocaleString('bs-BA'):'nikad'} ${profile.sentAt?'· poslano: '+new Date(profile.sentAt).toLocaleString('bs-BA'):''}</div>
        </div>
      </div>`:'<div class="card p-10 text-center text-slate-500">Nema učenika.</div>'}
    </div>
  </div>`);
  wrap.querySelector('#studentSel')?.addEventListener('change', e=>{ view.studentId=e.target.value; render(); });
  function collectProfile(){
    profile.about=wrap.querySelector('#p_about').value.trim();
    profile.health=wrap.querySelector('#p_health').value.trim();
    profile.talents=wrap.querySelector('#p_talents').value.trim();
    profile.support=wrap.querySelector('#p_support').value.trim();
    profile.family=wrap.querySelector('#p_family').value.trim();
    profile.notes=wrap.querySelector('#p_notes').value.trim();
    profile.updatedBy=session.userId; profile.updatedAt=Date.now();
  }
  wrap.querySelector('#saveProfile')?.addEventListener('click', ()=>{ collectProfile(); saveDB(); render(); });
  wrap.querySelector('#sendProfile')?.addEventListener('click', ()=>{
    if(!hr){ alert('Razred nema dodijeljenog razrednika.'); return; }
    collectProfile(); profile.sentAt=Date.now();
    db.messages.push({ id:uid('msg'), fromId:session.userId, toId:hr.id, subject:`CV učenika: ${student.name}`, body:`Admin je poslao CV profil učenika ${student.name}.\n\nOpšti opis:\n${profile.about||'-'}\n\nZdravlje:\n${profile.health||'-'}\n\nTalenti:\n${profile.talents||'-'}\n\nPodrška:\n${profile.support||'-'}\n\nPorodica/kontakt:\n${profile.family||'-'}\n\nNapomene:\n${profile.notes||'-'}`, ts:Date.now(), readAt:null, attachments:[] });
    saveDB(); alert('CV je poslan razredniku.'); render();
  });
  return wrap;
}

    u.botStyle=m.querySelector('#f_bot_style').value;

    if(u.role==='student'){ u.classId=m.querySelector('#f_class')?.value||''; delete u.subjects; }
    if(u.role==='teacher'){ u.subjects=Array.from(m.querySelectorAll('.f_sub:checked')).map(c=>c.value); delete u.classId; }
    if(u.role==='parent'){ u.childrenIds=Array.from(m.querySelectorAll('.f_child:checked')).map(c=>c.value); delete u.subjects; delete u.classId; }
    if(!u.name||!u.username){ alert('Ime i korisničko ime su obavezni.'); return false; }
    if(isNew) db.users.push(u); else Object.assign(getUser(id), u);
    saveDB(); render(); return true;
  });
  const extra=m.querySelector('#extra');
  function syncExtra(){
    const r=m.querySelector('#f_role').value;
    if(r==='student'){
      extra.innerHTML=`<label class="text-sm font-medium">Razred</label>
        <select id="f_class" class="form-input"><option value="">- odaberi -</option>
          ${db.classes.map(c=>`<option value="${c.id}" ${u.classId===c.id?'selected':''}>${c.name}</option>`).join('')}
        </select>`;
    } else if(r==='teacher'){
      extra.innerHTML=`<label class="text-sm font-medium">Predmeti</label>
        <div class="grid grid-cols-2 gap-2 mt-1 p-3 border border-slate-200 rounded-lg max-h-40 overflow-y-auto">
          ${db.subjects.map(s=>`<label class="flex items-center gap-2 text-sm"><input type="checkbox" class="f_sub" value="${s.id}" ${(u.subjects||[]).includes(s.id)?'checked':''}> ${s.name}</label>`).join('')}

        </div>`;

  }
  m.querySelector('#f_role').addEventListener('change', syncExtra); syncExtra();
  if(window.lucide) lucide.createIcons();

function deleteSubjectDeep(subjectId){
  const removedScheduleIds=db.schedule.filter(s=>s.subjectId===subjectId).map(s=>s.id);
  db.subjects=db.subjects.filter(s=>s.id!==subjectId);
  db.users.forEach(u=>{ if(Array.isArray(u.subjects)) u.subjects=u.subjects.filter(id=>id!==subjectId); });
  db.schedule=db.schedule.filter(s=>s.subjectId!==subjectId);
  db.lessons=db.lessons.filter(l=>l.subjectId!==subjectId);
  db.classSessions=db.classSessions.filter(cs=>!removedScheduleIds.includes(cs.scheduleId));
  db.substitutions=db.substitutions.filter(s=>!removedScheduleIds.includes(s.scheduleId));
  db.finalGrades=db.finalGrades.filter(f=>f.subjectId!==subjectId);
  db.completions=db.completions.filter(c=>c.subjectId!==subjectId);
  db.homework=db.homework.filter(h=>h.subjectId!==subjectId);
  db.assessments=db.assessments.filter(a=>a.subjectId!==subjectId);
  db.materials=db.materials.filter(m=>m.subjectId!==subjectId).map(m=>{
    const ids=materialScheduleIds(m).filter(id=>!removedScheduleIds.includes(id));
    m.scheduleIds=ids;
    m.scheduleId=ids[0]||'';
    return m;
  });
  db.absenceRequests.forEach(r=>{ if(removedScheduleIds.includes(r.scheduleId)) r.scheduleId=''; });
}

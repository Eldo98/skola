function renderHRAbsences(cls, sts){
  const semId=view.semesterId;
  const rows=[];
  db.classSessions.forEach(cs=>{
    const sc=db.schedule.find(s=>s.id===cs.scheduleId); if(!sc||sc.classId!==cls.id) return;
    if(semId){ const sid=cs.semesterId||semesterForDate(cs.date)?.id; if(sid!==semId) return; }
    (cs.attendance||[]).filter(a=>a.status!=='present').forEach(a=>{
      rows.push({ date:cs.date, subject:getSubject(sc.subjectId), studentId:a.studentId, status:a.status, excused:a.excused===true, resolved:typeof a.excused==='boolean' });
    });
  });
  const byStud={}; sts.forEach(s=>byStud[s.id]={absent:0, late:0, excused:0, unexcused:0, pending:0, items:[]});
  rows.forEach(r=>{ const b=byStud[r.studentId]; if(!b) return; b.items.push(r); if(r.status==='absent'){ b.absent++; if(!r.resolved) b.pending++; else if(r.excused) b.excused++; else b.unexcused++; } else b.late++; });

  return el(`<div class="space-y-4">
    <div class="grid md:grid-cols-5 gap-3">
      <div class="card p-5"><div class="text-sm text-slate-500">Ukupno odsustva</div><div class="text-3xl font-bold text-red-600">${rows.filter(r=>r.status==='absent').length}</div></div>
      <div class="card p-5"><div class="text-sm text-slate-500">Ukupno kašnjenja</div><div class="text-3xl font-bold text-amber-600">${rows.filter(r=>r.status==='late').length}</div></div>
      <div class="card p-5"><div class="text-sm text-slate-500">Opravdani</div><div class="text-3xl font-bold text-emerald-600">${rows.filter(r=>r.status==='absent'&&r.excused).length}</div></div>
      <div class="card p-5"><div class="text-sm text-slate-500">Neopravdani</div><div class="text-3xl font-bold text-red-700">${rows.filter(r=>r.status==='absent'&&r.resolved&&!r.excused).length}</div></div>
      <div class="card p-5"><div class="text-sm text-slate-500">Čeka pravdanje</div><div class="text-3xl font-bold text-amber-600">${rows.filter(r=>r.status==='absent'&&!r.resolved).length}</div></div>
    </div>
    <div class="card overflow-hidden">
      <div class="p-4 border-b border-slate-100 font-bold flex items-center gap-2"><i data-lucide="user-x"></i> Po učeniku</div>
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-xs uppercase text-slate-500 text-left">
          <tr><th class="px-4 py-3">Učenik</th><th class="px-4 py-3">Odsustva</th><th class="px-4 py-3">Opravdani</th><th class="px-4 py-3">Neopravdani</th><th class="px-4 py-3">Čeka</th><th class="px-4 py-3">Kašnjenja</th><th class="px-4 py-3">Detalji</th></tr>
        </thead>
        <tbody>
          ${sts.map(s=>{ const b=byStud[s.id]; return `<tr class="border-t border-slate-100">
            <td class="px-4 py-3 font-medium">${s.name}</td>
            <td class="px-4 py-3"><span class="badge bg-red-50 text-red-700">${b.absent}</span></td>
            <td class="px-4 py-3"><span class="badge bg-emerald-50 text-emerald-700">${b.excused}</span></td>
            <td class="px-4 py-3"><span class="badge bg-red-50 text-red-700">${b.unexcused}</span></td>
            <td class="px-4 py-3"><span class="badge bg-amber-50 text-amber-700">${b.pending}</span></td>
            <td class="px-4 py-3"><span class="badge bg-amber-50 text-amber-700">${b.late}</span></td>
            <td class="px-4 py-3"><div class="flex flex-wrap gap-1">${b.items.slice(0,12).map(it=>`<span class="text-[10px] ${it.status==='absent'?(!it.resolved?'bg-amber-50 text-amber-700':it.excused?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'):'bg-amber-50 text-amber-700'} px-1.5 py-0.5 rounded" title="${it.subject?.name}">${it.date} · ${it.subject?.name||''}${it.status==='absent'?(!it.resolved?' · ?':it.excused?' · O':' · N'):''}</span>`).join('')||'<span class="text-slate-400 text-xs">-</span>'}${b.items.length>12?`<span class="text-xs text-slate-400">+${b.items.length-12}</span>`:''}</div></td>
          </tr>`; }).join('')}
        </tbody>
      </table>
    </div>
  </div>`);
}

            ${r.status==='pending'?`<button data-abs-act="${r.id}|approved_excused" class="btn btn-soft" style="padding:5px 10px;font-size:12px;">Opravdaj</button><button data-abs-act="${r.id}|rejected_unexcused" class="btn btn-danger" style="padding:5px 10px;font-size:12px;">Neopravdano</button>`:''}
            <button data-abs-note="${r.id}" class="btn btn-soft" style="padding:5px 10px;font-size:12px;"><i data-lucide="sticky-note" class="icon-sm"></i></button>
          </td>
        </tr>`; }).join('')}
      </tbody>
    </table>`:'<div class="p-10 text-center text-slate-500">Nema zahtjeva roditelja.</div>'}
  </div>
  </div>`);
  w.querySelectorAll('[data-teacher-abs]').forEach(b=>b.addEventListener('click', ()=>{
    const [csId, studentId, status]=b.dataset.teacherAbs.split('|');
    const cs=db.classSessions.find(x=>x.id===csId); if(!cs) return;
    const att=(cs.attendance||[]).find(a=>a.studentId===studentId); if(!att) return;
    att.status='absent';
    att.excused=status==='approved_excused';
    att.decidedBy=session.userId;
    att.decidedAt=Date.now();
    saveDB(); render();
  }));
  w.querySelectorAll('[data-abs-act]').forEach(b=>b.addEventListener('click', ()=>{
    const [id,status]=b.dataset.absAct.split('|'); const req=db.absenceRequests.find(r=>r.id===id); if(!req) return;
    req.status=status; req.decidedBy=session.userId; req.decidedAt=Date.now();
    applyAbsenceRequestDecision(req);
    if(status==='approved_excused') db.absenceRequests=db.absenceRequests.filter(r=>r.id!==id);
    saveDB(); render();
  }));
  w.querySelectorAll('[data-abs-note]').forEach(b=>b.addEventListener('click', ()=>{
    const req=db.absenceRequests.find(r=>r.id===b.dataset.absNote); if(!req) return;
    const note=prompt('Napomena razrednika:', req.note||''); if(note===null) return;
    req.note=note; saveDB(); render();
  }));
  return w;
}

    <div class="space-y-3">

          ${sts.map(s=>`<label class="flex items-center gap-2 p-2 border border-slate-200 rounded-lg hover:bg-slate-50"><input type="checkbox" class="d_student" value="${s.id}" ${(duty.studentIds||[]).includes(s.id)?'checked':''}> <span>${s.name}</span></label>`).join('')}

      </div>

    </div>`, ()=>{
    duty.start=m.querySelector('#d_start').value;
    duty.end=m.querySelector('#d_end').value;
    duty.studentIds=Array.from(m.querySelectorAll('.d_student:checked')).map(x=>x.value);
    duty.note=m.querySelector('#d_note').value.trim();

        return `<div data-dossier-detail="${sub.id}" class="border border-slate-200 rounded-xl p-4"><div class="font-bold flex items-center gap-2"><span class="badge text-white" style="background:${sub.color}">${sub.name}</span>${completionBadge(c?.status)}</div><div class="text-xs text-slate-500 mt-2">${c?.note||'Nema napomene.'}</div></div>`;
      }
      const grades=collectGradesFor(studentId, sub.id, null, semId);

      const avg=grades.length?(grades.reduce((a,b)=>a+b.value,0)/grades.length).toFixed(2):'-';
      return `<div data-dossier-detail="${sub.id}" class="border border-slate-200 rounded-xl p-4">
        <div class="flex items-center justify-between gap-2 flex-wrap"><div class="font-bold flex items-center gap-2"><span class="badge text-white" style="background:${sub.color}">${sub.name}</span><span class="text-xs text-slate-500">Prosjek ${avg}</span></div>${finals.length?`<div class="flex gap-1 flex-wrap">${finals.map(f=>`<span class="badge ${f.value===1?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-700'}">Zaključna ${f.value}${f.status==='passed'?' (popravni prošao)':f.status==='failed'?' (pao)':''}</span>`).join('')}</div>`:''}</div>
        <div class="flex flex-wrap gap-2 mt-3">${grades.length?grades.map(g=>`<div class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2"><span class="grade-pill ${gradeClass(g.value)}">${g.value}</span><span class="text-xs text-slate-600 ml-2">${g.date} · ${(GRADE_TYPES.find(t=>t.v===g.type)?.label)||'ocjena'}${g.note?' · '+g.note:''}</span></div>`).join(''):'<span class="text-sm text-slate-400">Nema ocjena.</span>'}</div>
      </div>`;
    }).join('') || '<div class="text-sm text-slate-500">Nema predmeta.</div>'}
    </div>
  </div>`;
}

function dossierAbsencesHTML(studentId, classId, semId){
  const rows=[];
  db.classSessions.forEach(cs=>{
    const sc=db.schedule.find(s=>s.id===cs.scheduleId); if(!sc||sc.classId!==classId) return;
    if(semId){ const sid=cs.semesterId||semesterForDate(cs.date)?.id; if(sid!==semId) return; }
    (cs.attendance||[]).filter(a=>a.studentId===studentId&&a.status!=='present').forEach(a=>rows.push({date:cs.date,subject:getSubject(sc.subjectId),period:sc.period,status:a.status,excused:a.excused===true,teacher:getUser(cs.conductedBy||sc.teacherId)}));
  });
  rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `<div class="space-y-2">${rows.length?rows.map(r=>`<div class="border border-slate-200 rounded-xl p-3"><div class="flex items-center gap-2 flex-wrap"><b>${r.date}</b><span class="badge text-white" style="background:${r.subject?.color||'#64748b'}">${r.subject?.name||''}</span><span class="badge bg-slate-50 text-slate-700">${r.period+1}. čas</span><span class="badge ${r.status==='late'?'bg-amber-50 text-amber-700':r.excused?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'}">${r.status==='late'?'kasni':r.excused?'opravdano':'neopravdano'}</span></div><div class="text-xs text-slate-500 mt-1">Profesor: ${r.teacher?.name||''}</div></div>`).join(''):'<div class="text-sm text-slate-500">Nema izostanaka.</div>'}</div>`;
}

function openHomeroomDossierModal(classId, selectedIds=[]){
  const cls=getClass(classId);
  const sts=studentsOfClass(classId);
  const semId=view.semesterId||'';
  const initial=new Set(selectedIds.length?selectedIds:sts.map(s=>s.id));
  const modal=openModal(`Dosije razreda ${cls?.name||''}`, `<div class="space-y-4">
    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3"><div class="font-semibold mb-2">Izaberite učenike</div><div class="grid md:grid-cols-2 gap-2 max-h-44 overflow-y-auto scrollbar-thin">${sts.map(s=>`<label class="flex items-center gap-2 text-sm"><input type="checkbox" class="modal_dossier_student" value="${s.id}" ${initial.has(s.id)?'checked':''}> ${s.name}</label>`).join('')}</div><button id="refreshDossier" class="btn btn-soft mt-3"><i data-lucide="refresh-cw"></i> Prikaži izabrane</button></div>
    <div id="dossierContent" class="space-y-4"></div>
  </div>`, ()=>true, 'max-w-5xl');
  modal.querySelector('#mSave').innerHTML='<i data-lucide="check"></i> Zatvori';
  function refresh(){
    const ids=Array.from(modal.querySelectorAll('.modal_dossier_student:checked')).map(x=>x.value);
    modal.querySelector('#dossierContent').innerHTML=ids.length?ids.map(id=>dossierStudentHTML(id,classId,semId)).join(''):'<div class="text-center text-slate-500 py-8">Odaberite barem jednog učenika.</div>';
    if(window.lucide) lucide.createIcons();
    modal.querySelectorAll('[data-dossier-student-card]').forEach(card=>{
      const details=[...card.querySelectorAll('[data-dossier-detail]')];
      const rows=[...card.querySelectorAll('[data-dossier-subject]')];
      function show(subjectId){
        details.forEach(d=>d.classList.toggle('hidden', d.dataset.dossierDetail!==subjectId));
        rows.forEach(r=>r.classList.toggle('bg-white', r.dataset.dossierSubject===subjectId));
      }
      if(details[0]) show(details[0].dataset.dossierDetail);
      rows.forEach(r=>r.addEventListener('click', ()=>show(r.dataset.dossierSubject)));
    });
    modal.querySelectorAll('[data-print-dossier]').forEach(b=>b.addEventListener('click', ()=>window.print()));
  }
  modal.querySelector('#refreshDossier').addEventListener('click', refresh);
  modal.querySelectorAll('.modal_dossier_student').forEach(c=>c.addEventListener('change', refresh));
  refresh();
}

function renderHRTimeline(cls, sts){
  const semId=view.semesterId;
  const studentIds=sts.map(s=>s.id);
  const rows=[];
  db.classNotes.filter(n=>n.classId===cls.id).forEach(n=>rows.push({date:n.date,type:n.type,studentId:n.studentId,by:n.byTeacherId,text:n.text,icon:n.type==='pohvala'?'thumbs-up':'alert-triangle'}));
  db.classSessions.forEach(cs=>{
    const sc=db.schedule.find(s=>s.id===cs.scheduleId); if(!sc||sc.classId!==cls.id) return;
    if(semId){ const sid=cs.semesterId||semesterForDate(cs.date)?.id; if(sid!==semId) return; }
    (cs.attendance||[]).filter(a=>studentIds.includes(a.studentId)&&a.status!=='present').forEach(a=>rows.push({date:cs.date,type:a.status==='absent'?'odsustvo':'kašnjenje',studentId:a.studentId,by:cs.conductedBy||sc.teacherId,text:`${getSubject(sc.subjectId)?.name||''} - ${a.status==='absent'?'odsutan':'kasni'}`,icon:a.status==='absent'?'user-x':'clock'}));
    (cs.grades||[]).filter(g=>studentIds.includes(g.studentId)).forEach(g=>rows.push({date:cs.date,type:'ocjena',studentId:g.studentId,by:cs.conductedBy||sc.teacherId,text:`${getSubject(sc.subjectId)?.name||''}: ocjena ${g.value}${g.note?' - '+g.note:''}`,icon:'star'}));
  });
  db.homework.filter(h=>h.classId===cls.id).forEach(h=>rows.push({date:h.dueDate||h.assignedDate,type:'zadaća',studentId:null,by:h.teacherId,text:`${getSubject(h.subjectId)?.name||''}: ${h.title}`,icon:'clipboard-pen-line'}));
  db.assessments.filter(a=>a.classId===cls.id).forEach(a=>rows.push({date:a.date,type:'ispitivanje',studentId:null,by:a.teacherId,text:`${getSubject(a.subjectId)?.name||''}: ${assessmentLabel(a.type)} - ${a.title}`,icon:'file-check-2'}));
  db.completions.filter(c=>studentIds.includes(c.studentId) && (!semId||c.semesterId===semId)).forEach(c=>rows.push({date:new Date(c.ts||Date.now()).toISOString().slice(0,10),type:'odradio',studentId:c.studentId,by:c.byTeacherId,text:`${getSubject(c.subjectId)?.name||''}: ${c.status==='completed'?'odradio':c.status==='not_completed'?'nije odradio':'čeka'}${c.note?' - '+c.note:''}`,icon:'badge-check'}));
  db.finalGrades.filter(f=>studentIds.includes(f.studentId) && (!semId||f.semesterId===semId)).forEach(f=>rows.push({date:new Date(f.ts||Date.now()).toISOString().slice(0,10),type:'zaključna',studentId:f.studentId,by:f.teacherId,text:`${getSubject(f.subjectId)?.name||''}: zaključna ${f.value}`,icon:'check-circle-2'}));
  rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return el(`<div class="card overflow-hidden">
    <div class="p-4 border-b border-slate-100 font-bold flex items-center gap-2"><i data-lucide="list-checks"></i> Kompletna evidencija razreda ${cls.name}</div>
    ${rows.length?`<table class="w-full text-sm">
      <thead class="bg-slate-50 text-xs uppercase text-slate-500 text-left"><tr><th class="px-4 py-3">Datum</th><th class="px-4 py-3">Tip</th><th class="px-4 py-3">Učenik</th><th class="px-4 py-3">Unio</th><th class="px-4 py-3">Detalj</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr class="border-t border-slate-100 hover:bg-slate-50">
          <td class="px-4 py-3 font-mono text-xs">${r.date||'-'}</td>
          <td class="px-4 py-3"><span class="badge bg-slate-50 text-slate-700"><i data-lucide="${r.icon}" class="icon-sm"></i> ${r.type}</span></td>
          <td class="px-4 py-3 font-medium">${r.studentId?(getUser(r.studentId)?.name||''):'cijeli razred'}</td>

function renderStudentHomework(){
  const me=getUser(session.userId);
  const list=db.homework.filter(h=>h.classId===me.classId).sort((a,b)=>(b.dueDate||'').localeCompare(a.dueDate||''));
  const today=todayStr();
  const wrap=el(`<div>
    ${pageHeader('Zadaće',`Pregled zadaća za razred ${getClass(me.classId)?.name||''}`,'clipboard-pen-line')}
    <div class="p-8">
      <div class="grid md:grid-cols-2 gap-4">
        ${list.map(h=>{
          const sub=getSubject(h.subjectId), tch=getUser(h.teacherId);
          const overdue=h.dueDate && h.dueDate<today;
          const soon = h.dueDate && !overdue && (new Date(h.dueDate)-new Date(today))/(1000*60*60*24)<=3;
          const mark=homeworkMark(h, me.id);
          const done=mark==='+';
          return `<div class="card p-5">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span class="badge text-white" style="background:${sub?.color}">${sub?.name||''}</span>
              ${overdue?'<span class="badge bg-slate-100 text-slate-600">isteklo</span>':soon?'<span class="badge bg-red-50 text-red-700">uskoro!</span>':'<span class="badge bg-emerald-50 text-emerald-700">aktivno</span>'}
              ${homeworkMarkBadge(mark)}
            </div>
            <h3 class="font-bold">${h.title}</h3>
            <p class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${h.description||''}</p>
            <div class="text-xs text-slate-500 mt-3 pt-3 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2">
              <span class="flex items-center gap-1"><i data-lucide="user" class="icon-sm"></i> ${tch?.name||''}</span>
              <span class="flex items-center gap-1 ${overdue?'text-red-600':soon?'text-amber-600':'text-emerald-600'}"><i data-lucide="flag" class="icon-sm"></i> Rok: <b>${h.dueDate||'-'}</b></span>
            </div>
            ${homeworkClosedForStudent(h)?`<div class="mt-3 p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-600 flex items-center gap-2"><i data-lucide="lock" class="icon-sm"></i> Rok je prošao. Zadaća je zatvorena za učenike.</div>`:`<button data-toggle-hw="${h.id}" class="btn ${done?'btn-soft':'btn-primary'} mt-3 w-full justify-center"><i data-lucide="${done?'rotate-ccw':'check'}"></i> ${done?'Vrati na ○':'Označi +'}</button>`}
          </div>`;
        }).join('')||'<div class="col-span-2 text-center text-slate-500 py-12 card">Nema dodijeljenih zadaća.</div>'}
      </div>
    </div>
  </div>`);
  wrap.querySelectorAll('[data-toggle-hw]').forEach(b=>b.addEventListener('click', ()=>{
    const h=db.homework.find(x=>x.id===b.dataset.toggleHw); if(!h) return;
    if(homeworkClosedForStudent(h)){ alert('Rok je prošao. Zadaća je zatvorena za učenike.'); return; }
    setHomeworkMark(h, me.id, homeworkMark(h, me.id)==='+' ? 'o' : '+');
    saveDB(); render();
  }));
  return wrap;
}

function openParentAbsenceRequestModal(){
  const me=getUser(session.userId);
  const kids=childrenOfParent(me.id);
  const m=openModal('Novi zahtjev za odsustvo', `<div id="reqBody"></div>`, ()=>{
    const studentId=m.querySelector('#r_student').value;
    const child=getUser(studentId);
    const date=m.querySelector('#r_date').value;
    const scheduleId=m.querySelector('#r_schedule').value;
    const reason=m.querySelector('#r_reason').value.trim();
    const type=m.querySelector('#r_type').value;
    if(!studentId||!date||!reason){ alert('Odaberite dijete, datum i razlog.'); return false; }
    db.absenceRequests.push({ id:uid('abs'), parentId:me.id, studentId, classId:child.classId, scheduleId, date, type, reason, status:'pending', note:'', decidedBy:null, decidedAt:null, createdAt:Date.now() });
    saveDB(); render(); return true;
  });
  function build(){
    const studentId=m.querySelector('#r_student')?.value || kids[0]?.id || '';
    const date=m.querySelector('#r_date')?.value || todayStr();
    const child=getUser(studentId);
    const dow=(parseLocalDate(date).getDay()+6)%7;
    const slots=child?db.schedule.filter(s=>s.classId===child.classId && s.day===dow).sort((a,b)=>a.period-b.period):[];
    m.querySelector('#reqBody').innerHTML=`<div class="space-y-3">
      <div><label class="text-sm font-medium">Dijete</label><select id="r_student" class="form-input">${kids.map(k=>`<option value="${k.id}" ${k.id===studentId?'selected':''}>${k.name} (${getClass(k.classId)?.name||''})</option>`).join('')}</select></div>
      <div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-medium">Datum</label><input id="r_date" type="date" class="form-input" value="${date}"></div><div><label class="text-sm font-medium">Tip</label><select id="r_type" class="form-input"><option value="planned">Unaprijed najava</option><option value="excuse">Pravdanje izostanka</option></select></div></div>
      <div><label class="text-sm font-medium">Čas</label><select id="r_schedule" class="form-input"><option value="">Cijeli dan / svi časovi</option>${slots.map(s=>`<option value="${s.id}">${s.period+1}. čas - ${getSubject(s.subjectId)?.name||''} (${PERIODS[s.period].s})</option>`).join('')}</select></div>
      <div><label class="text-sm font-medium">Razlog</label><textarea id="r_reason" rows="4" class="form-input" placeholder="Napišite razlog odsustva..."></textarea></div>
    </div>`;
    m.querySelector('#r_student').addEventListener('change', build);
    m.querySelector('#r_date').addEventListener('change', build);
  }
  build();
}

/* MODAL */
function openModal(title, bodyHTML, onSave, sizeClass='max-w-lg'){
  const back=el(`<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 fadeIn">
    <div class="bg-white rounded-2xl w-full ${sizeClass} shadow-2xl">
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h2 class="font-bold text-lg">${title}</h2>
        <button id="mClose" class="btn-ghost"><i data-lucide="x"></i></button>
      </div>
      <div class="p-6 max-h-[70vh] overflow-y-auto">${bodyHTML}</div>
      <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
        <button id="mCancel" class="btn btn-soft">Otkaži</button>
        <button id="mSave" class="btn btn-primary"><i data-lucide="check"></i> Sačuvaj</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(back);
  if(window.lucide) lucide.createIcons();
  function close(){ back.remove(); }
  back.querySelector('#mClose').addEventListener('click', close);
  back.querySelector('#mCancel').addEventListener('click', close);
  back.querySelector('#mSave').addEventListener('click', ()=>{ const r=onSave(); if(r!==false) close(); });
  back.addEventListener('click', e=>{ if(e.target===back) close(); });
  return back;
}

(function init(){
  try { const s=JSON.parse(localStorage.getItem('eskola_session')); if(s) session=s; } catch(e){}
  if(session){ const u=getUser(session.userId); if(u) view=defaultViewFor(u); else session=null; }
  initFirebaseSync();
  runBots(todayStr(), false);
  render();
})();
</script>

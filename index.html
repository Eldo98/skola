<!doctype html>
<html lang="bs" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ŠkolaPro</title>
<style>
:root{
--bg:#f4f6fb;--surface:#fff;--surface2:#f8faff;--text:#0f172a;--muted:#64748b;--border:#e2e6ef;
--shadow:0 6px 24px rgba(15,23,42,.07);--pri:#2563eb;--pri2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
--radius:16px;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
html[data-theme="dark"]{
--bg:#0b1220;--surface:#111b30;--surface2:#0e1628;--text:#e4ecff;--muted:#8da0c4;--border:rgba(255,255,255,.09);
--shadow:0 10px 40px rgba(0,0,0,.35);--pri:#6ea8fe;--pri2:#4f8cff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
.wrap{max-width:1340px;margin:0 auto;padding:14px}
/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:8px;z-index:10;backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));opacity:.85}
.brand h1{font-size:15px;margin:0;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--muted);margin-top:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-size:11px;white-space:nowrap;background:var(--surface2)}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 10px;border-radius:12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:color-mix(in oklab,var(--pri) 40%,var(--border))}
.btn.pri{background:linear-gradient(180deg,color-mix(in oklab,var(--pri) 16%,var(--surface)),color-mix(in oklab,var(--pri2) 10%,var(--surface)));border-color:color-mix(in oklab,var(--pri) 40%,var(--border))}
.btn.sm{padding:5px 8px;border-radius:10px;font-size:12px}
.btn.ok{border-color:color-mix(in oklab,var(--ok) 35%,var(--border));background:color-mix(in oklab,var(--ok) 8%,var(--surface))}
.btn.warn{border-color:color-mix(in oklab,var(--warn) 35%,var(--border));background:color-mix(in oklab,var(--warn) 8%,var(--surface))}
.btn.bad{border-color:color-mix(in oklab,var(--bad) 35%,var(--border));background:color-mix(in oklab,var(--bad) 8%,var(--surface))}
/* layout */
.layout{display:grid;grid-template-columns:250px 1fr;gap:12px;margin-top:12px}
.sidebar{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;height:fit-content;position:sticky;top:72px}
.navTitle{font-size:11px;color:var(--muted);margin:4px 8px 8px;text-transform:uppercase;letter-spacing:.5px}
.navItem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;font-size:13px}
.navItem:hover{background:color-mix(in oklab,var(--pri) 6%,var(--surface))}
.navItem.active{background:color-mix(in oklab,var(--pri) 11%,var(--surface));border-color:color-mix(in oklab,var(--pri) 30%,var(--border))}
.navIcon{width:20px;text-align:center;font-size:14px;color:var(--muted)}
.navLabel{font-weight:700;flex:1}
.navHint{font-size:11px;color:var(--muted)}
.content{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card h2{font-size:15px;margin:0 0 2px}
.card h3{font-size:14px;margin:0 0 2px}
.muted{color:var(--muted)}
.sep{height:1px;background:var(--border);margin:10px 0}
label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:9px 10px;outline:none;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:color-mix(in oklab,var(--pri) 50%,var(--border));box-shadow:0 0 0 3px color-mix(in oklab,var(--pri) 12%,transparent)}
textarea{min-height:80px;resize:vertical}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:13px}
th{font-size:11px;color:var(--muted);background:var(--surface2);text-transform:uppercase;letter-spacing:.3px}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono)}
.right{display:flex;justify-content:flex-end;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.notice{border:1px solid var(--border);border-radius:12px;padding:9px 10px;background:color-mix(in oklab,var(--pri) 5%,var(--surface));color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:var(--surface2);margin-left:4px;white-space:nowrap}
.tag.warn{border-color:color-mix(in oklab,var(--warn) 35%,var(--border));background:color-mix(in oklab,var(--warn) 8%,var(--surface2));color:var(--warn)}
.tag.ok{border-color:color-mix(in oklab,var(--ok) 35%,var(--border));background:color-mix(in oklab,var(--ok) 8%,var(--surface2));color:var(--ok)}
.tag.bad{border-color:color-mix(in oklab,var(--bad) 35%,var(--border));background:color-mix(in oklab,var(--bad) 8%,var(--surface2));color:var(--bad)}
.tag.pri{border-color:color-mix(in oklab,var(--pri) 35%,var(--border));background:color-mix(in oklab,var(--pri) 8%,var(--surface2));color:var(--pri)}
/* timetable */
.ttWrap{overflow:auto;border:1px solid var(--border);border-radius:14px}
.tt{min-width:960px;width:100%;background:var(--surface)}
.ttHead,.ttRow{display:grid;grid-template-columns:140px repeat(5,minmax(150px,1fr))}
.ttHead{position:sticky;top:0;z-index:1;border-bottom:1px solid var(--border)}
.ttHead>div{padding:8px 10px;border-right:1px solid var(--border);background:var(--surface2)}
.ttHead>div:last-child{border-right:none}
.ttRow{border-bottom:1px solid var(--border)}
.ttRow:last-child{border-bottom:none}
.ttTime{padding:8px 10px;border-right:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.ttCell{padding:8px;border-right:1px solid var(--border);min-height:76px}
.ttCell:last-child{border-right:none}
.lesson{border:1px solid var(--border);border-radius:12px;padding:8px 9px;background:var(--surface);cursor:pointer;position:relative;transition:border-color .15s}
.lesson:hover{border-color:color-mix(in oklab,var(--pri) 35%,var(--border))}
.lesson .title{font-weight:800;font-size:12px;line-height:1.2}
.lesson .meta{font-size:11px;color:var(--muted);margin-top:3px}
.empty{color:color-mix(in oklab,var(--muted) 60%,transparent);font-size:11px}
/* dnevnik (paper) */
.dnevnik{border:2px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
.dnevnik .dHeader{background:color-mix(in oklab,var(--pri) 8%,var(--surface2));padding:12px 14px;border-bottom:2px solid var(--border)}
.dnevnik .dHeader h3{margin:0;font-size:15px}
.dnevnik .dHeader .dMeta{font-size:12px;color:var(--muted);margin-top:4px}
.dnevnik table{border:none;border-radius:0}
.dnevnik th{background:color-mix(in oklab,var(--pri) 5%,var(--surface2));font-size:11px}
.dnevnik td{font-size:13px}
.dnevnik .attDot{width:12px;height:12px;border-radius:999px;display:inline-block;border:1px solid var(--border)}
.dnevnik .attDot.present{background:var(--ok);border-color:color-mix(in oklab,var(--ok) 40%,var(--border))}
.dnevnik .attDot.late{background:var(--warn);border-color:color-mix(in oklab,var(--warn) 40%,var(--border))}
.dnevnik .attDot.absent{background:var(--bad);border-color:color-mix(in oklab,var(--bad) 40%,var(--border))}
/* modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(15,23,42,.4);z-index:50}
html[data-theme="dark"] .modal{background:rgba(0,0,0,.55)}
.modal.open{display:flex}
.modal .box{width:min(1120px,98vw);max-height:90vh;overflow:auto;border-radius:18px;border:1px solid var(--border);background:var(--surface);box-shadow:0 16px 50px rgba(0,0,0,.2);padding:14px}
@media(max-width:980px){
.layout{grid-template-columns:1fr}
.sidebar{position:static}
.two,.three{grid-template-columns:1fr}
.ttHead,.ttRow{grid-template-columns:130px repeat(5,240px)}
}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
<div class="brand"><div class="logo"></div><div><h1 id="schoolName">ŠkolaPro</h1><div class="sub">Firebase RTDB</div></div></div>
<div class="row">
<span class="pill" id="connPill">…</span>

<button class="btn sm" data-a="theme">◐</button>
<button class="btn sm" data-a="logout" id="btnLogout" style="display:none">Odjava</button>
</div>
</div>
<div id="app"></div>
</div>
<div class="modal" id="lessonModal"><div class="box" id="lessonBox"></div></div>
<div class="modal" id="cellModal"><div class="box" id="cellBox"></div></div>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function sha256(s){function r(n,x){return(x>>>n)|(x<<(32-n))}const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const m=[];for(let i=0;i<s.length;i++){let c=s.charCodeAt(i);if(c<128)m.push(c);else if(c<2048){m.push(192|(c>>6),128|(c&63))}else{m.push(224|(c>>12),128|((c>>6)&63),128|(c&63))}}const l=m.length*8;m.push(128);while(m.length%64!==56)m.push(0);for(let i=7;i>=0;i--)m.push((l>>>(i*8))&255);const w=Array(64);for(let i=0;i<m.length;i+=64){for(let t=0;t<16;t++){const j=i+t*4;w[t]=((m[j]<<24)|(m[j+1]<<16)|(m[j+2]<<8)|m[j+3])>>>0}for(let t=16;t<64;t++){const s0=(r(7,w[t-15])^r(18,w[t-15])^(w[t-15]>>>3))>>>0;const s1=(r(17,w[t-2])^r(19,w[t-2])^(w[t-2]>>>10))>>>0;w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}let[a,b,c,d,e,f,g,h]=H;for(let t=0;t<64;t++){const S1=(r(6,e)^r(11,e)^r(25,e))>>>0;const ch=((e&f)^(~e&g))>>>0;const t1=(h+S1+ch+K[t]+w[t])>>>0;const S0=(r(2,a)^r(13,a)^r(22,a))>>>0;const mj=((a&b)^(a&c)^(b&c))>>>0;const t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0]}return H.map(x=>x.toString(16).padStart(8,'0')).join('')}

const E=s=>(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const uid=(p='id')=>p+'_'+Math.random().toString(16).slice(2)+'_'+Date.now().toString(16);
const now=()=>new Date().toISOString();
const isoDate=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${da}`};
const fromISO=s=>{const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setHours(0,0,0,0);return dt};
const today=()=>{const d=new Date;d.setHours(0,0,0,0);return isoDate(d)};

const lk=(c,w,p)=>`${c}|${w}|${p}`;
const subColor=id=>{let h=0;for(const c of(id||''))h=(h*31+c.charCodeAt(0))>>>0;return`hsl(${h%360} 70% 44%)`};

set:(p,v)=>RT.ref(p).set(v),
on:(p,cb)=>RT.ref(p).on('value',s=>cb(s.exists()?s.val():null)),

/* ====== RENDER ====== */
function render(){
setT(APP.st.theme);
const db=APP.db;
$('#schoolName').textContent=db?.settings?.schoolName||'ŠkolaPro';
const u=me();
$('#btnLogout').style.display=u?'inline-block':'none';
$('#userPill').textContent=u?`${u.role}: ${u.username}`:'—';

$('#app').innerHTML=shell(u);postRender(u);
}

</div>`}

function shell(u){
const nav=[];
if(u.role==='admin'){
nav.push(['a-users','👤','Korisnici','dodaj / uredi']);
nav.push(['a-data','📋','Podaci','razredi / predmeti / učionice']);

}
if(u.role==='teacher'){

function viewTpl(u){
const v=APP.st.view;
// admin
if(v==='a-users')return adminUsers();
if(v==='a-data')return adminData();
if(v==='a-periods')return adminPeriods();
if(v==='a-schedule')return adminSchedule();
if(v==='a-semesters')return adminSemesters();
// teacher
if(v==='t-week')return teacherWeek(u);
if(v==='t-day')return teacherDay(u);
if(v==='t-subs')return teacherSubs(u);
if(v==='t-homework')return teacherHomework(u);
if(v==='t-rem')return reminders(u);
if(v==='t-homeroom')return homeroom(u);
// student
if(v==='s-week')return studentWeek(u);

if(v==='s-grades')return studentGrades(u);
if(v==='s-rem')return reminders(u);

}

/* ===== TEACHER WEEK ===== */
function teacherWeek(u){const db=APP.db;const dates=weekDates(APP.st.date);const ps=(db.settings?.periods||[]).slice().sort((a,b)=>a.p-b.p);
const cids=(db.classes||[]).map(c=>c.id);
function lessFor(dt,p){const wd=fromISO(dt).getDay();const items=[];
for(const cid of cids){const cell=db.schedule?.[cid]?.[wd]?.[p.p];if(!cell)continue;
const r=D.resolve(db,dt,cid,wd,p.p,cell.teacherId);if(r.tid!==u.id)continue;
const hw=D.hasHW(db,cid,dt);const rem=D.hasRem(db,u.id,dt);
items.push({dt,cid,wd,period:p.p,sid:cell.subjectId,rid:cell.roomId,sub:r.sub,hw,rem})}return items}

return`<div class="card"><h2>📅 Moja sedmica</h2><div class="muted">Klik na čas → dnevnik (prisustvo, ocjene, zadaća)</div><div class="sep"></div>
<div class="ttWrap"><div class="tt">
<div class="ttHead"><div><b>Čas</b></div>${dates.map(dt=>{const wd=fromISO(dt).getDay();return`<div><b>${E(wdName(wd))}</b><div class="muted mono" style="font-size:11px">${E(dt)}</div></div>`}).join('')}</div>
${ps.map(p=>{
const cells=dates.map(dt=>{const its=lessFor(dt,p);
if(!its.length)return`<div class="ttCell"><div class="empty">—</div></div>`;
return`<div class="ttCell">${its.map(L=>{const col=subColor(L.sid);
return`<div class="lesson" data-a="openL" data-dt="${E(L.dt)}" data-c="${E(L.cid)}" data-w="${L.wd}" data-p="${L.period}" style="border-left:3px solid ${col}">
<div class="title">${E(D.cn(db,L.cid))} • ${E(D.sn(db,L.sid))}${L.sub?'<span class="tag warn">zamjena</span>':''}${L.hw?'<span class="tag pri">zadaća</span>':''}${L.rem?'<span class="tag ok">⏰</span>':''}</div>
<div class="meta">${E(D.rn(db,L.rid))}</div></div>`}).join('<div style="height:6px"></div>')}</div>`}).join('');
return`<div class="ttRow"><div class="ttTime"><b>${p.p}.</b><div class="mono" style="font-size:11px">${E(p.start)}–${E(p.end)}</div></div>${cells}</div>`}).join('')}
</div></div></div>`}

function teacherDay(u){const db=APP.db;const date=APP.st.date;const wd=fromISO(date).getDay();
const ps=(db.settings?.periods||[]).slice().sort((a,b)=>a.p-b.p);const cids=(db.classes||[]).map(c=>c.id);
const lessons=[];
for(const cid of cids){for(const p of ps){const cell=db.schedule?.[cid]?.[wd]?.[p.p];if(!cell)continue;
const r=D.resolve(db,date,cid,wd,p.p,cell.teacherId);if(r.tid!==u.id)continue;
lessons.push({cid,period:p.p,sid:cell.subjectId,rid:cell.roomId,sub:r.sub})}}
lessons.sort((a,b)=>a.period-b.period);
return`<div class="card"><h2>📋 Moj dan</h2><div class="muted">Datum: <span class="mono">${E(date)}</span></div><div class="sep"></div>
${lessons.length?`<table><thead><tr><th>Čas</th><th>Razred</th><th>Predmet</th><th>Učionica</th><th></th></tr></thead><tbody>
${lessons.map(L=>`<tr><td><b>${L.period}.</b></td><td><b>${E(D.cn(db,L.cid))}</b></td>
<td>${E(D.sn(db,L.sid))}${L.sub?'<span class="tag warn">zamjena</span>':''}</td>
<td>${E(D.rn(db,L.rid))}</td>
<td class="right"><button class="btn sm pri" data-a="openL" data-dt="${E(date)}" data-c="${E(L.cid)}" data-w="${wd}" data-p="${L.period}">Otvori</button></td></tr>`).join('')}
</tbody></table>`:`<div class="notice">Nema časova za ovaj dan.</div>`}</div>`}

function teacherSubs(u){const db=APP.db;const dates=weekDates(APP.st.date);const list=[];
for(const d of dates){const ds=db.substitutions?.[d]||{};for(const[k,s] of Object.entries(ds)){
if(s.fromTeacherId===u.id||s.toTeacherId===u.id)list.push({date:d,lk:k,...s})}}
list.sort((a,b)=>a.date.localeCompare(b.date));
const st=s=>s==='pending'?'<span class="tag warn">pending</span>':s==='accepted'?'<span class="tag ok">accepted</span>':'<span class="tag bad">declined</span>';
return`<div class="card"><h2>🔄 Zamjene</h2><div class="sep"></div>
${list.length?`<table><thead><tr><th>Datum</th><th>Od</th><th>Za</th><th>Status</th><th></th></tr></thead><tbody>
${list.map(s=>`<tr><td class="mono">${E(s.date)}</td><td>${E(D.tn(db,s.fromTeacherId))}</td><td>${E(D.tn(db,s.toTeacherId))}</td><td>${st(s.status)}</td>
<td class="right">${s.toTeacherId===u.id&&s.status==='pending'?`<button class="btn sm ok" data-a="subA" data-dt="${s.date}" data-lk="${s.lk}">✓</button><button class="btn sm bad" data-a="subD" data-dt="${s.date}" data-lk="${s.lk}">✗</button>`:'—'}</td></tr>`).join('')}
</tbody></table>`:`<div class="notice">Nema zamjena u sedmici.</div>`}</div>`}

function studentDay(u){const db=APP.db;const cid=u.classId;const date=APP.st.date;const wd=fromISO(date).getDay();
const ps=(db.settings?.periods||[]).slice().sort((a,b)=>a.p-b.p);
const lessons=[];for(const p of ps){const cell=db.schedule?.[cid]?.[wd]?.[p.p];if(!cell)continue;
const r=D.resolve(db,date,cid,wd,p.p,cell.teacherId);
lessons.push({period:p.p,sid:cell.subjectId,rid:cell.roomId,tid:r.tid,sub:r.sub})}
lessons.sort((a,b)=>a.period-b.period);

const hw=db.homework?.[cid]?.[date]||{};const hwa=Object.entries(hw).map(([id,v])=>({id,...v}));
return`<div class="card"><h2>📋 Moj dan</h2><div class="muted">${E(D.cn(db,cid))} • <span class="mono">${E(date)}</span></div><div class="sep"></div>
<div class="two"><div>
${lessons.length?`<table><thead><tr><th>Čas</th><th>Predmet</th><th>Profesor</th><th>Učionica</th></tr></thead><tbody>
${lessons.map(L=>`<tr><td><b>${L.period}.</b></td><td><b>${E(D.sn(db,L.sid))}</b>${L.sub?'<span class="tag warn">zamjena</span>':''}</td>
<td>${E(D.tn(db,L.tid))}</td><td>${E(D.rn(db,L.rid))}</td></tr>`).join('')}
</tbody></table>`:`<div class="notice">Nema časova.</div>`}
</div><div>
<h3>Zadaće za danas</h3><div class="sep"></div>
${hwa.length?hwa.map(h=>`<div class="notice" style="margin-bottom:8px"><b>${E(D.sn(db,h.subjectId))}</b>: ${E(h.text)}<div class="muted" style="margin-top:4px">Prof: ${E(D.tn(db,h.teacherId))}</div></div>`).join(''):`<div class="notice">Nema zadaća.</div>`}
</div></div></div>`}

function studentGrades(u){const db=APP.db;const g=db.grades?.[u.id]||{};
const subjects=(db.subjects||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
const sems=db.settings?.semesters||[];
return`<div class="card"><h2>📊 Ocjene</h2><div class="sep"></div>
<table><thead><tr><th>Predmet</th><th>Ocjene</th><th>S1</th><th>S2</th><th>Prosjek</th></tr></thead><tbody>
${subjects.map(sub=>{const arr=Object.values(g?.[sub.id]||{}).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const s1=sems[0]?.id,s2=sems[1]?.id;
const a1=arr.filter(x=>x.semesterId===s1).map(x=>+x.value);
const a2=arr.filter(x=>x.semesterId===s2).map(x=>+x.value);
const all=arr.map(x=>+x.value);
const avg=all.length?(all.reduce((s,v)=>s+v,0)/all.length).toFixed(2):'—';
const avg1=a1.length?(a1.reduce((s,v)=>s+v,0)/a1.length).toFixed(2):'—';
const avg2=a2.length?(a2.reduce((s,v)=>s+v,0)/a2.length).toFixed(2):'—';

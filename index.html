<html lang="bs" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ŠkolaPro • Firebase RTDB • bez invite code</title>
  <style>
    :root{
      --bg:#f6f7fb; --surface:#fff; --surface2:#fbfcff;
      --text:#0f172a; --muted:#64748b; --border:#e6e8f0;
      --shadow2: 0 8px 22px rgba(15,23,42,.06);
      --pri:#2563eb; --pri2:#1d4ed8;
      --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
      --radius:14px; --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
    }
    html[data-theme="dark"]{
      --bg:#0b1220; --surface:#101a2f; --surface2:#0f1a31;
      --text:#e8eeff; --muted:#93a4c7; --border:rgba(255,255,255,.10);
      --shadow2: 0 10px 32px rgba(0,0,0,.28);
      --pri:#6ea8fe; --pri2:#4f8cff;
    }
    *{box-sizing:border-box}
    body{margin:0; background:var(--bg); color:var(--text)}
    .container{max-width:1320px; margin:0 auto; padding:16px}
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:12px 14px; border:1px solid var(--border);
      background: linear-gradient(180deg, var(--surface2), var(--surface));
      border-radius: var(--radius); box-shadow: var(--shadow2);
      position: sticky; top:10px; z-index:10; backdrop-filter: blur(8px);
    }
    .brand{display:flex; align-items:center; gap:10px; min-width:280px}
    .logo{width:34px; height:34px; border-radius:10px;
      background: color-mix(in oklab, var(--pri) 22%, transparent);
      border:1px solid color-mix(in oklab, var(--pri) 45%, var(--border));
    }
    h1{font-size:14px; margin:0}
    .sub{font-size:12px; color:var(--muted); margin-top:2px}
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .right{display:flex; justify-content:flex-end; gap:8px}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid var(--border);
      background: color-mix(in oklab, var(--surface) 70%, transparent);
      color: var(--muted); font-size:12px; white-space:nowrap;
    }
    .btn{
      appearance:none; border:1px solid var(--border);
      background: var(--surface); color: var(--text);
      padding:9px 11px; border-radius:12px; cursor:pointer;
    }
    .btn:hover{border-color: color-mix(in oklab, var(--pri) 40%, var(--border))}
    .btn.pri{
      background: linear-gradient(180deg,
        color-mix(in oklab, var(--pri) 18%, var(--surface)),
        color-mix(in oklab, var(--pri2) 12%, var(--surface)));
      border-color: color-mix(in oklab, var(--pri) 45%, var(--border));
    }
    .btn.small{padding:6px 9px; border-radius:10px; font-size:13px}
    .btn.ok{border-color: color-mix(in oklab, var(--ok) 35%, var(--border)); background: color-mix(in oklab, var(--ok) 10%, var(--surface))}
    .btn.warn{border-color: color-mix(in oklab, var(--warn) 35%, var(--border)); background: color-mix(in oklab, var(--warn) 10%, var(--surface))}
    .btn.bad{border-color: color-mix(in oklab, var(--bad) 35%, var(--border)); background: color-mix(in oklab, var(--bad) 10%, var(--surface))}

    .layout{display:grid; grid-template-columns: 270px 1fr; gap:14px; margin-top:14px}
    .sidebar{
      border:1px solid var(--border); background:var(--surface);
      border-radius:var(--radius); box-shadow:var(--shadow2);
      padding:12px; height: fit-content; position: sticky; top: 82px;
    }
    .navTitle{font-size:12px; color:var(--muted); margin:6px 6px 10px}
    .navItem{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 10px; border-radius: 12px; border:1px solid transparent;
      cursor:pointer;
    }
    .navItem:hover{background: color-mix(in oklab, var(--pri) 7%, var(--surface))}
    .navItem.active{
      background: color-mix(in oklab, var(--pri) 12%, var(--surface));
      border-color: color-mix(in oklab, var(--pri) 35%, var(--border));
    }
    .hint{font-size:12px; color:var(--muted)}
    .content{display:flex; flex-direction:column; gap:14px}
    .card{
      border:1px solid var(--border); background:var(--surface);
      border-radius:var(--radius); box-shadow:var(--shadow2);
      padding:14px;
    }
    .sep{height:1px; background:var(--border); margin:12px 0}
    label{display:block; font-size:12px; color:var(--muted); margin:10px 0 6px}
    input, select, textarea{
      width:100%; border:1px solid var(--border);
      background:var(--surface2); color:var(--text);
      border-radius:12px; padding:10px 11px; outline:none;
    }
    textarea{min-height:90px; resize:vertical}
    table{width:100%; border-collapse:separate; border-spacing:0; border:1px solid var(--border); border-radius:12px; overflow:hidden}
    th,td{padding:10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top}
    th{font-size:12px; color:var(--muted); background:var(--surface2)}
    tr:last-child td{border-bottom:none}
    .mono{font-family:var(--mono)}
    .badgeTag{
      display:inline-flex; align-items:center;
      font-size:11px; padding:3px 8px; border-radius:999px;
      border:1px solid var(--border); color: var(--muted);
      background: var(--surface2); margin-left:6px; white-space:nowrap;
    }
    .badgeTag.warn{border-color: color-mix(in oklab, var(--warn) 40%, var(--border)); background: color-mix(in oklab, var(--warn) 10%, var(--surface2))}
    .badgeTag.ok{border-color: color-mix(in oklab, var(--ok) 40%, var(--border)); background: color-mix(in oklab, var(--ok) 10%, var(--surface2))}
    .badgeTag.bad{border-color: color-mix(in oklab, var(--bad) 40%, var(--border)); background: color-mix(in oklab, var(--bad) 10%, var(--surface2))}
    .notice{border:1px solid var(--border); border-radius:12px; padding:10px 11px; background: color-mix(in oklab, var(--pri) 6%, var(--surface)); color:var(--muted)}

    /* timetable */
    .ttWrap{overflow:auto; border:1px solid var(--border); border-radius:14px}
    .tt{min-width:980px; width:100%; background:var(--surface)}
    .ttHead, .ttRow{display:grid; grid-template-columns: 160px repeat(5, minmax(150px, 1fr))}
    .ttHead{position:sticky; top:0; z-index:1; border-bottom:1px solid var(--border)}
    .ttHead>div{padding:10px; border-right:1px solid var(--border); background:var(--surface2)}
    .ttHead>div:last-child{border-right:none}
    .ttRow{border-bottom:1px solid var(--border)}
    .ttRow:last-child{border-bottom:none}
    .ttTime{padding:10px; border-right:1px solid var(--border); background:var(--surface2); color:var(--muted)}
    .ttCell{padding:10px; border-right:1px solid var(--border); min-height:82px}
    .ttCell:last-child{border-right:none}
    .lesson{
      border:1px solid var(--border); border-radius:12px;
      padding:9px 10px; background:var(--surface);
      cursor:pointer;
    }
    .lesson:hover{border-color: color-mix(in oklab, var(--pri) 35%, var(--border))}
    .lesson .title{font-weight:800; font-size:13px; line-height:1.15}
    .lesson .meta{font-size:12px; color:var(--muted); margin-top:4px}
    .empty{color: color-mix(in oklab, var(--muted) 75%, transparent); font-size:12px}

    /* modal */
    .modal{position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:18px; background: rgba(15,23,42,.45); z-index:50;}
    html[data-theme="dark"] .modal{background: rgba(0,0,0,.58)}
    .modal.open{display:flex}
    .modal .box{width:min(1150px, 98vw); max-height:90vh; overflow:auto; border-radius:16px; border:1px solid var(--border); background:var(--surface); box-shadow: 0 14px 45px rgba(0,0,0,.22); padding:14px;}

    @media (max-width: 980px){
      .layout{grid-template-columns:1fr}
      .sidebar{position:static}
      .ttHead,.ttRow{grid-template-columns: 150px repeat(5, 260px)}
    }
  </style>
</head>

/* ====== Pure JS SHA-256 (stable everywhere) ====== */
function sha256(str){
  function rrot(n,x){ return (x>>>n) | (x<<(32-n)); }
  function toBytes(s){
    const bytes=[];
    for(let i=0;i<s.length;i++){
      let c=s.charCodeAt(i);
      if(c<0x80) bytes.push(c);
      else if(c<0x800){ bytes.push(0xc0|(c>>6), 0x80|(c&0x3f)); }
      else if(c<0x10000){ bytes.push(0xe0|(c>>12), 0x80|((c>>6)&0x3f), 0x80|(c&0x3f)); }
      else { bytes.push(0xf0|(c>>18), 0x80|((c>>12)&0x3f), 0x80|((c>>6)&0x3f), 0x80|(c&0x3f)); }
    }
    return bytes;
  }
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  const msg = toBytes(String(str));
  const l = msg.length * 8;
  msg.push(0x80);
  while((msg.length % 64) !== 56) msg.push(0);
  for(let i=7;i>=0;i--) msg.push((l >>> (i*8)) & 0xff);

  const w = new Array(64);
  for(let i=0;i<msg.length;i+=64){
    for(let t=0;t<16;t++){
      const j=i+t*4;
      w[t] = ((msg[j]<<24) | (msg[j+1]<<16) | (msg[j+2]<<8) | (msg[j+3]))>>>0;
    }
    for(let t=16;t<64;t++){
      const s0 = (rrot(7,w[t-15]) ^ rrot(18,w[t-15]) ^ (w[t-15]>>>3))>>>0;
      const s1 = (rrot(17,w[t-2]) ^ rrot(19,w[t-2]) ^ (w[t-2]>>>10))>>>0;
      w[t] = (w[t-16] + s0 + w[t-7] + s1)>>>0;
    }

    let [a,b,c,d,e,f,g,h] = H;
    for(let t=0;t<64;t++){
      const S1 = (rrot(6,e)^rrot(11,e)^rrot(25,e))>>>0;
      const ch = ((e&f) ^ (~e&g))>>>0;
      const temp1 = (h + S1 + ch + K[t] + w[t])>>>0;
      const S0 = (rrot(2,a)^rrot(13,a)^rrot(22,a))>>>0;
      const maj = ((a&b) ^ (a&c) ^ (b&c))>>>0;
      const temp2 = (S0 + maj)>>>0;

      h=g; g=f; f=e; e=(d+temp1)>>>0; d=c; c=b; b=a; a=(temp1+temp2)>>>0;
    }
    H = [(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,"0")).join("");
}

/* ---------------- Utils ---------------- */
const U = {
  esc(s){ return (s??"").toString().replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); },
  uid(prefix="id"){ return prefix+"_"+Math.random().toString(16).slice(2)+"_"+Date.now().toString(16); },
  nowISO(){ return new Date().toISOString(); },
  toISODate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), da=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${da}`; },
  fromISODate(s){ const [y,m,d]=s.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setHours(0,0,0,0); return dt; },
  today(){ const d=new Date(); d.setHours(0,0,0,0); return U.toISODate(d); },
  addDays(iso,n){ const d=U.fromISODate(iso); d.setDate(d.getDate()+n); return U.toISODate(d); },
  weekdayName(i){ return ["Ned","Pon","Uto","Sri","Čet","Pet","Sub"][i]||"?"; },
  timeToMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; },
  weekStartMonday(iso){
    const d=U.fromISODate(iso); const day=d.getDay();
    const diff=(day===0)?-6:(1-day);
    d.setDate(d.getDate()+diff);
    return U.toISODate(d);
  },
  weekDates(iso){
    const mon=U.weekStartMonday(iso);
    return [0,1,2,3,4].map(i=>U.addDays(mon,i));
  },
  lessonKey(classId, weekday, period){ return `${classId}|${weekday}|${period}`; }
};

/* ---------------- DB: one node (/schoolDB) ---------------- */
const DB_PATH = "/schoolDB";
const DB = {
  ref(){ return firebase.database().ref(DB_PATH); },
  async load(){
    const snap = await DB.ref().get();
    return snap.exists() ? snap.val() : null;
  },
  async save(db){
    // demo: save whole db (simple)
    await DB.ref().set(db);
  },
  subscribe(onChange){
    DB.ref().on("value", snap=>{
      onChange(snap.exists()?snap.val():null);
    });
  },
  async reset(){
    await DB.ref().remove();
  }
};

/* ---------------- App session (app-level login) ---------------- */
const SESSION_KEY = "schoolAppSession_v1";
const Session = {
  get(){ try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||"");}catch{return null;} },
  set(s){ sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); },
  clear(){ sessionStorage.removeItem(SESSION_KEY); }
};

/* ---------------- Domain helpers ---------------- */
const Domain = {
  className(db,id){ return db.classes?.find(c=>c.id===id)?.name || "—"; },
  subjectName(db,id){ return db.subjects?.find(s=>s.id===id)?.name || "—"; },
  roomName(db,id){ return db.rooms?.find(r=>r.id===id)?.name || "—"; },
  userById(db,id){ return db.users?.find(u=>u.id===id) || null; },
  teacherName(db,id){
    const u = Domain.userById(db,id);
    return u ? (u.fullName||u.username) : "—";
  },
  studentsInClass(db,classId){
    return (db.users||[]).filter(u=>u.role==="student" && u.classId===classId)
      .sort((a,b)=>(a.fullName||"").localeCompare(b.fullName||""));
  },
  semesterForDate(db, iso){
    const sems = db.settings?.semesters || [];
    const s = sems.find(x=>iso>=x.start && iso<=x.end);
    return s ? s.id : null;
  }
};

/* ---------------- App ---------------- */
const APP = {

  state: {
    view: "login",
    date: U.today(),
    adminClassPick: null,
    theme: localStorage.getItem("theme_schoolpro_nocode") || "light"

  currentUser(){
    const s = Session.get();
    if(!s?.userId) return null;
    return APP.db?.users?.find(u=>u.id===s.userId) || null;
  }
};

function setTheme(t){
  APP.state.theme=t;
  document.documentElement.setAttribute("data-theme", t);

/* ---------------- Seed ---------------- */

  const adminId = U.uid("usr");

    settings:{

        {p:1,start:"08:00",end:"08:45"},
        {p:2,start:"09:00",end:"09:45"},

      ]
    },
    users:[
      { id: adminId, username:"admin", passHash: sha256("admin"), role:"admin", fullName:"Administrator" },

      { id: t1, username:"prof1", passHash: sha256("prof1"), role:"teacher", fullName:"Prof. Aida A.", homeroomClassId:c1 },
      { id: t2, username:"prof2", passHash: sha256("prof2"), role:"teacher", fullName:"Prof. Marko M." },

      { id: s1, username:"u1", passHash: sha256("u1"), role:"student", fullName:"Učenik 1", classId:c1 },
      { id: s2, username:"u2", passHash: sha256("u2"), role:"student", fullName:"Učenik 2", classId:c1 },
      { id: s3, username:"u3", passHash: sha256("u3"), role:"student", fullName:"Učenik 3", classId:c1 }
    ],
    classes:[ { id:c1, name:"1-A", homeroomTeacherId: t1 } ],
    subjects:[ {id:subMath,name:"Matematika"},{id:subBos,name:"Bosanski jezik"},{id:subIt,name:"Informatika"} ],
    rooms:[ {id:r101,name:"Učionica 101"},{id:rIT,name:"Kabinet IT"} ],

    // schedule[classId][weekday][period] = {subjectId, teacherId, roomId}
    schedule:{
      [c1]:{
        1:{ 1:{subjectId:subMath,teacherId:t1,roomId:r101}, 2:{subjectId:subBos,teacherId:t1,roomId:r101} },
        2:{ 1:{subjectId:subIt,teacherId:t2,roomId:rIT} },
        3:{ 3:{subjectId:subMath,teacherId:t1,roomId:r101} },
        4:{ 2:{subjectId:subIt,teacherId:t2,roomId:rIT} },
        5:{ 1:{subjectId:subBos,teacherId:t1,roomId:r101} }
      }
    },

    // substitutions[date][lessonKey] = {fromTeacherId,toTeacherId,status,note,createdAt,decidedAt}
    substitutions:{},

    // attendance[date][lessonKey][studentId] = {status,note,teacherId,markedAt}
    attendance:{},

    // absences[classId][date][studentId][lessonKey] = {...}
    absences:{},

    // homework[classId][dueDate][id] = {classId,subjectId,teacherId,dueDate,text,createdAt}
    homework:{},
    homeworkByDue:{}, // homeworkByDue[dueDate][id] = same record

    // grades[studentId][subjectId][gradeId] = {value,date,type,note,teacherId,classId,semesterId}
    grades:{},

    // finalGrades[studentId][subjectId][year] = {value, decidedBy, decidedAt}
    finalGrades:{},

/* ---------------- Render ---------------- */
function render(){
  setTheme(APP.state.theme);

  const db = APP.db;
  $("#schoolName").textContent = db?.settings?.schoolName || "ŠkolaPro";

  const me = APP.currentUser();
  $("#btnLogout").style.display = me ? "inline-block" : "none";
  $("#userPill").textContent = me ? `${me.role}: ${me.username}` : "Niste prijavljeni";

  const root = $("#app");
  if(!db){
    root.innerHTML = `<div class="card"><div class="hint">Učitavanje baze…</div></div>`;
    return;
  }

  if(!me){
    APP.state.view="login";
    root.innerHTML = tplLogin();
    return;
  }

  // default view
  if(APP.state.view==="login"){
    APP.state.view = me.role==="admin" ? "admin-users" : me.role==="teacher" ? "t-week" : "s-week";
  }

  root.innerHTML = tplShell(me);
  postRender(me);
}

function tplShell(me){
  const items = [];
  if(me.role==="admin"){
    items.push(["admin-users","Korisnici","dodaj/uredi"]);
    items.push(["admin-data","Podaci","razredi/predmeti/učionice/periodi"]);
    items.push(["admin-schedule","Raspored","grid"]);
    items.push(["admin-semesters","Semestri","datumi"]);
    items.push(["admin-backup","Backup","import/export"]);
  }
  if(me.role==="teacher"){
    items.push(["t-week","Sedmica","moj raspored"]);
    items.push(["t-day","Dan","lista časova"]);
    items.push(["t-subs","Zamjene","pregled"]);
    items.push(["t-homework","Zadaće","dodaj/pregled"]);
    items.push(["t-rem","Podsjetnici","moji"]);
    if(me.homeroomClassId) items.push(["t-homeroom","Razrednik","izostanci"]);
  }
  if(me.role==="student"){
    items.push(["s-week","Sedmica","raspored"]);
    items.push(["s-day","Dan","raspored + zadaće"]);
    items.push(["s-grades","Ocjene","moje"]);
    items.push(["s-rem","Podsjetnici","moji"]);
  }

  return `
    <div class="layout">
      <div class="sidebar">
        <div class="navTitle">Navigacija</div>
        ${items.map(([id,t,h])=>`
          <div class="navItem ${APP.state.view===id?'active':''}" data-act="nav" data-view="${id}">
            <div>
              <div style="font-weight:800; font-size:13px">${U.esc(t)}</div>
              <div class="hint">${U.esc(h)}</div>
            </div>
            <div class="hint">→</div>
          </div>
        `).join("")}
        <div class="sep"></div>
        ${me.role==="admin" ? `
          <button class="btn small warn" style="width:100%" data-act="resetDB">Reset baze</button>
          <div class="hint" style="margin-top:8px">Briše /schoolDB i pravi seed ponovo.</div>
        ` : `<div class="hint">—</div>`}
      </div>

      <div class="content">
        ${tplDateNav()}
        ${tplView(me)}
      </div>
    </div>
  `;
}

function tplDateNav(){
  const d=APP.state.date;

  const today=U.today();
  return `

      <div class="row" style="justify-content:space-between">

function tplView(me){
  switch(APP.state.view){
    // admin
    case "admin-users": return tplAdminUsers();
    case "admin-data": return tplAdminData();
    case "admin-schedule": return tplAdminSchedule();

/* ===================== TEACHER / STUDENT ===================== */
function tplTeacherWeek(me){
  const db=APP.db;
  const dates=U.weekDates(APP.state.date);
  const periods=(db.settings?.periods||[]).slice().sort((a,b)=>a.p-b.p);
  const classIds=(db.classes||[]).map(c=>c.id);

  function resolveTeacher(date, classId, wd, p, baseTeacherId){
    const lk=U.lessonKey(classId, wd, p);
    const sub=db.substitutions?.[date]?.[lk] || null;
    if(sub && sub.status==="accepted") return {teacherId: sub.toTeacherId, substituted:true};
    return {teacherId: baseTeacherId, substituted:false};
  }

  function lessonsFor(dt, p){
    const wd=U.fromISODate(dt).getDay();
    const items=[];
    for(const clsId of classIds){
      const cell=db.schedule?.[clsId]?.[wd]?.[p.p];
      if(!cell) continue;
      const r=resolveTeacher(dt, clsId, wd, p.p, cell.teacherId);
      if(r.teacherId!==me.id) continue;
      items.push({dt, clsId, wd, period:p.p, subjectId:cell.subjectId, roomId:cell.roomId, substituted:r.substituted});
    }
    return items;
  }

  return `
    <div class="card">
      <h2 style="margin:0">Profesor • Sedmica</h2>
      <div class="hint">Klik na čas → prisustvo/ocjene/zadaća/zamjena</div>
      <div class="sep"></div>

      <div class="ttWrap">
        <div class="tt">
          <div class="ttHead">
            <div><b>Čas</b></div>
            ${dates.map(dt=>{
              const wd=U.fromISODate(dt).getDay();
              return `<div><b>${U.esc(U.weekdayName(wd))}</b><div class="hint mono">${U.esc(dt)}</div></div>`;
            }).join("")}
          </div>

          ${periods.map(p=>{
            const cells = dates.map(dt=>{
              const its=lessonsFor(dt,p);
              if(!its.length) return `<div class="ttCell"><div class="empty">—</div></div>`;
              return `<div class="ttCell">${its.map(L=>`
                <div class="lesson" data-act="openLesson" data-date="${U.esc(L.dt)}" data-class="${U.esc(L.clsId)}" data-weekday="${L.wd}" data-period="${L.period}">

function tplTeacherDay(me){

  function resolveTeacher(date, classId, wd, p, baseTeacherId){
    const lk=U.lessonKey(classId, wd, p);
    const sub=db.substitutions?.[date]?.[lk] || null;
    if(sub && sub.status==="accepted") return {teacherId: sub.toTeacherId, substituted:true};
    return {teacherId: baseTeacherId, substituted:false};

  const lessons=[];
  for(const clsId of classIds){

      lessons.push({clsId, period:p.p, subjectId:cell.subjectId, roomId:cell.roomId, substituted:r.substituted});

  lessons.sort((a,b)=>a.period-b.period);

function postRender(me){
  const db=APP.db;

  // teacher homework today
  if(APP.state.view==="t-homework"){
    const due = APP.state.date;
    const hw = db.homeworkByDue?.[due] || {};
    const arr = Object.entries(hw).map(([id,v])=>({id,...v})).filter(x=>x.teacherId===me.id);
    $("#hwTodayBox").innerHTML = arr.length ? arr.map(h=>`
      <div class="notice" style="margin-bottom:8px">
        <b>${U.esc(Domain.className(db,h.classId))}</b> • ${U.esc(Domain.subjectName(db,h.subjectId))}<br/>
        <span class="hint">${U.esc(h.text)}</span>
        <div class="row" style="margin-top:8px">
          <button class="btn small bad" data-act="delHW" data-due="${U.esc(due)}" data-id="${U.esc(h.id)}">Obriši</button>
        </div>
      </div>
    `).join("") : `<div class="notice">Nema zadaća sa rokom danas.</div>`;
  }

  // student homework today
  if(APP.state.view==="s-day"){
    const due=APP.state.date;
    const clsId=me.classId;
    const hw = db.homework?.[clsId]?.[due] || {};
    const arr = Object.entries(hw).map(([id,v])=>({id,...v}));
    $("#studentHwBox").innerHTML = arr.length ? arr.map(h=>`
      <div class="notice" style="margin-bottom:8px">
        <b>${U.esc(Domain.subjectName(db,h.subjectId))}</b>: ${U.esc(h.text)}
        <div class="hint" style="margin-top:6px">Profesor: ${U.esc(Domain.teacherName(db,h.teacherId))}</div>
      </div>
    `).join("") : `<div class="notice">Nema zadaća za danas.</div>`;
  }

  // reminders
  if(APP.state.view==="t-rem" || APP.state.view==="s-rem"){
    const rem = db.reminders?.[me.id] || {};
    const arr = Object.entries(rem).map(([id,v])=>({id,...v})).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    $("#remListBox").innerHTML = arr.length ? arr.map(r=>`
      <div class="notice" style="margin-bottom:8px">
        <div class="row" style="justify-content:space-between">
          <div><span class="mono">${U.esc(r.date||"")}</span> • ${U.esc(r.text||"")}</div>
          <div class="row">
            <button class="btn small ${r.done?'warn':'ok'}" data-act="toggleRem" data-id="${U.esc(r.id)}">${r.done?'Vrati':'Gotovo'}</button>
            <button class="btn small bad" data-act="delRem" data-id="${U.esc(r.id)}">Obriši</button>
          </div>
        </div>
      </div>
    `).join("") : `<div class="notice">Nema podsjetnika.</div>`;
  }

  // student grades
  if(APP.state.view==="s-grades"){
    const g = db.grades?.[me.id] || {};
    const subjects = (db.subjects||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
    const sems = db.settings?.semesters || [];

    $("#gradesBox").innerHTML = `
      <table>
        <thead><tr><th>Predmet</th><th>Ocjene</th><th>S1</th><th>S2</th><th>Prosjek</th></tr></thead>
        <tbody>
          ${subjects.map(sub=>{
            const arr = Object.values(g?.[sub.id]||{}).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
            const s1 = sems[0]?.id, s2=sems[1]?.id;
            const a1 = arr.filter(x=>x.semesterId===s1).map(x=>Number(x.value));
            const a2 = arr.filter(x=>x.semesterId===s2).map(x=>Number(x.value));
            const all = arr.map(x=>Number(x.value));
            const avg = all.length ? (all.reduce((s,v)=>s+v,0)/all.length).toFixed(2) : "—";
            const avg1 = a1.length ? (a1.reduce((s,v)=>s+v,0)/a1.length).toFixed(2) : "—";
            const avg2 = a2.length ? (a2.reduce((s,v)=>s+v,0)/a2.length).toFixed(2) : "—";
            return `
              <tr>
                <td><b>${U.esc(sub.name)}</b></td>
                <td class="hint">${arr.map(x=>`${x.value} (${x.date})`).join(", ") || "—"}</td>
                <td>${avg1}</td>
                <td>${avg2}</td>
                <td><b>${avg}</b></td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    `;
  }

  // homeroom absences
  if(APP.state.view==="t-homeroom"){
    const clsId = me.homeroomClassId;
    const abs = db.absences?.[clsId] || {};
    const rows=[];
    for(const [date, perStud] of Object.entries(abs)){
      for(const [sid, perLesson] of Object.entries(perStud||{})){
        for(const [lk, rec] of Object.entries(perLesson||{})){
          rows.push({date, sid, lk, ...rec});
        }
      }
    }
    rows.sort((a,b)=>b.date.localeCompare(a.date));

    $("#homeroomBox").innerHTML = rows.length ? `
      <table>
        <thead><tr><th>Datum</th><th>Učenik</th><th>Predmet</th><th>Profesor</th><th>Status</th><th>Razlog</th><th></th></tr></thead>
        <tbody>
          ${rows.slice(0,200).map(r=>{
            const st = r.justified ? `<span class="badgeTag ok">pravdan</span>` : `<span class="badgeTag bad">nepravdan</span>`;
            const stud = Domain.userById(db, r.sid);
            return `
              <tr>
                <td class="mono">${U.esc(r.date)}</td>
                <td><b>${U.esc(stud?.fullName||stud?.username||r.sid)}</b></td>
                <td>${U.esc(Domain.subjectName(db,r.subjectId))}</td>
                <td>${U.esc(Domain.teacherName(db,r.teacherId))}</td>
                <td>${st}</td>
                <td class="hint">${U.esc(r.reason||"")}</td>
                <td class="right">
                  <button class="btn small ${r.justified?'warn':'ok'}"
                    data-act="toggleJustify"
                    data-class="${U.esc(clsId)}"
                    data-date="${U.esc(r.date)}"
                    data-sid="${U.esc(r.sid)}"
                    data-lk="${U.esc(r.lk)}"
                    data-just="${r.justified?'1':'0'}">${r.justified?'Nepravdaj':'Pravdaj'}</button>
                </td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    ` : `<div class="notice">Nema izostanaka.</div>`;
  }
}

/* ---------------- Admin cell modal open ---------------- */
function openCellModal({classId, weekday, period}){
  const db=APP.db;
  const existing = db.schedule?.[classId]?.[weekday]?.[period] || null;

  // build modal from template inside schedule card
  const tpl = document.querySelector("#cellTpl");
  const frag = tpl.content.cloneNode(true);
  const box=$("#cellBox");
  box.innerHTML="";
  box.appendChild(frag);

  $("#cm_info").innerHTML = `Razred: <b>${U.esc(Domain.className(db,classId))}</b> • Dan: <b>${U.esc(U.weekdayName(weekday))}</b> • Čas: <b>${period}.</b>`;

  if(existing){
    $("#cm_sub").value = existing.subjectId;
    $("#cm_teacher").value = existing.teacherId;
    $("#cm_room").value = existing.roomId;
    $("#cm_del").style.display = "inline-block";
  }

  $("#cm_save").onclick = async ()=>{
    const subjectId = $("#cm_sub").value;
    const teacherId = $("#cm_teacher").value;
    const roomId = $("#cm_room").value;

    // (informativna) provjera konflikta
    const conflicts = {teacher:[], room:[]};
    for(const c of (db.classes||[])){
      if(c.id===classId) continue;
      const other = db.schedule?.[c.id]?.[weekday]?.[period];
      if(!other) continue;
      if(other.teacherId===teacherId) conflicts.teacher.push(c.name);
      if(other.roomId===roomId) conflicts.room.push(c.name);
    }
    if(conflicts.teacher.length || conflicts.room.length){
      let msg="Konflikt:\n";
      if(conflicts.teacher.length) msg += `- Profesor već predaje: ${conflicts.teacher.join(", ")}\n`;
      if(conflicts.room.length) msg += `- Učionica zauzeta: ${conflicts.room.join(", ")}\n`;
      msg += "Sačuvati ipak?";
      if(!confirm(msg)) return;
    }

    db.schedule ||= {};
    db.schedule[classId] ||= {};
    db.schedule[classId][weekday] ||= {};
    db.schedule[classId][weekday][period] = {subjectId, teacherId, roomId};

    await DB.save(db);
    $("#cellModal").classList.remove("open");
  };

  $("#cm_del").onclick = async ()=>{
    if(!confirm("Obrisati ovaj čas iz rasporeda?")) return;
    if(db.schedule?.[classId]?.[weekday]?.[period]){
      delete db.schedule[classId][weekday][period];
      await DB.save(db);
    }
    $("#cellModal").classList.remove("open");
  };

  $("#cellModal").classList.add("open");
}

        <h3 style="margin:0">${U.esc(Domain.className(db,classId))} • ${U.esc(Domain.subjectName(db,cell.subjectId))}</h3>
        <div class="hint">
          <span class="mono">${U.esc(date)}</span> • <b>${period}.</b> <span class="mono">${U.esc(pObj.start)}–${U.esc(pObj.end)}</span> • ${U.esc(Domain.roomName(db,cell.roomId))}
          ${sub && sub.status==="accepted" ? ` • <span class="badgeTag warn">zamjena</span>` : ``}
        </div>
      </div>
      <button class="btn small" data-act="closeModal" data-id="lessonModal">Zatvori</button>
    </div>

    <div class="sep"></div>

    <div class="row" style="justify-content:space-between">
      <div class="notice">Prisustvo: odsutan → ide razredniku</div>
      <button class="btn ok" data-act="saveAttendance" data-date="${U.esc(date)}" data-lk="${U.esc(lk)}" data-class="${U.esc(classId)}" data-sub="${U.esc(cell.subjectId)}">Sačuvaj prisustvo</button>
    </div>

    <div class="sep"></div>

    <table>
      <thead><tr><th>Učenik</th><th>Status</th><th>Napomena</th></tr></thead>
      <tbody>
        ${students.map(st=>{
          const a=att?.[st.id] || {};
          const status=a.status || "present";
          const note=a.note || "";
          return `
            <tr>
              <td><b>${U.esc(st.fullName||st.username)}</b></td>
              <td style="width:210px">
                <select data-att-status="${st.id}">
                  <option value="present" ${status==="present"?"selected":""}>Prisutan</option>
                  <option value="late" ${status==="late"?"selected":""}>Kasni</option>
                  <option value="absent" ${status==="absent"?"selected":""}>Odsutan</option>
                </select>
              </td>
              <td><input data-att-note="${st.id}" value="${U.esc(note)}" /></td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>

    <div class="sep"></div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
      <div>
        <h3 style="margin:0">Dodaj ocjenu</h3>
        <div class="sep"></div>
        <label>Učenik</label>
        <select id="gr_st">
          ${students.map(st=>`<option value="${st.id}">${U.esc(st.fullName||st.username)}</option>`).join("")}
        </select>
        <div class="row">
          <div style="flex:1">
            <label>Datum</label><input id="gr_date" type="date" value="${U.esc(date)}" />
          </div>
          <div style="width:140px">
            <label>Ocjena</label>
            <select id="gr_val"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select>
          </div>
        </div>
        <label>Tip</label>
        <select id="gr_type"><option>Usmeno</option><option>Pismeno</option><option>Aktivnost</option><option>Zadaća</option><option>Kontrolni</option></select>
        <label>Napomena</label><input id="gr_note" />
        <div class="row" style="margin-top:10px">
          <button class="btn pri" data-act="addGrade" data-class="${U.esc(classId)}" data-sub="${U.esc(cell.subjectId)}">Dodaj ocjenu</button>
        </div>
      </div>

      <div>
        <h3 style="margin:0">Zadaća</h3>
        <div class="sep"></div>
        <label>Rok</label><input id="lhw_due" type="date" value="${U.esc(date)}" />
        <label>Opis</label><textarea id="lhw_text"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="btn pri" data-act="addLessonHW" data-class="${U.esc(classId)}" data-sub="${U.esc(cell.subjectId)}">Dodaj zadaću</button>
        </div>

        <div class="sep"></div>

        <h3 style="margin:0">Zamjena (ovaj čas)</h3>
        <div class="sep"></div>
        <label>Ko mijenja</label>
        <select id="sub_toTeacher">
          ${(db.users||[]).filter(u=>u.role==="teacher" && u.id!==me.id)
            .map(t=>`<option value="${t.id}">${U.esc(t.fullName||t.username)}</option>`).join("")}
        </select>
        <label>Napomena</label><input id="sub_note" placeholder="npr. bolest" />
        <div class="row" style="margin-top:10px">
          <button class="btn warn" data-act="requestSub" data-date="${U.esc(date)}" data-lk="${U.esc(lk)}">Pošalji zahtjev</button>
        </div>
      </div>
    </div>
  `;

  $("#lessonModal").classList.add("open");
}

/* ---------------- Actions ---------------- */
document.addEventListener("click", async (e)=>{
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.getAttribute("data-act");

  // global
  if(act==="help"){ $("#helpModal").classList.add("open"); return; }
  if(act==="closeModal"){ $("#"+b.getAttribute("data-id")).classList.remove("open"); return; }
  if(act==="theme"){ setTheme(APP.state.theme==="light"?"dark":"light"); render(); return; }
  if(act==="logout"){ Session.clear(); APP.state.view="login"; render(); return; }

  // date nav
  if(act==="prevDay"){ APP.state.date=U.addDays(APP.state.date,-1); render(); return; }
  if(act==="nextDay"){ APP.state.date=U.addDays(APP.state.date, 1); render(); return; }
  if(act==="prevWeek"){ APP.state.date=U.addDays(APP.state.date,-7); render(); return; }
  if(act==="nextWeek"){ APP.state.date=U.addDays(APP.state.date, 7); render(); return; }

  // login
  if(act==="login"){
    const user = ($("#li_user")?.value||"").trim();
    const pass = ($("#li_pass")?.value||"");
    const u = (APP.db.users||[]).find(x=>x.username.toLowerCase()===user.toLowerCase());
    if(!u) return alert("Pogrešan korisnik ili lozinka.");
    if(u.passHash !== sha256(pass)) return alert("Pogrešan korisnik ili lozinka.");
    Session.set({userId: u.id, at: U.nowISO()});
    APP.state.view="login";
    render();
    return;
  }

  const me = APP.currentUser();
  if(!me) return;

  // nav
  if(act==="nav"){ APP.state.view=b.getAttribute("data-view"); render(); return; }

  /* ===== ADMIN ===== */
  if(me.role==="admin"){
    if(act==="resetDB"){
      if(!confirm("Reset baze?")) return;
      await DB.reset();
      APP.db = seedDB();
      await DB.save(APP.db);
      Session.clear();
      APP.state.view="login";
      render();
      return;
    }

    if(act==="addUser"){
      const username=($("#au_user")?.value||"").trim();
      const password=$("#au_pass")?.value||"";
      const fullName=($("#au_name")?.value||"").trim();
      const role=$("#au_role")?.value;
      const classId=$("#au_class")?.value || null;
      const hr=$("#au_hr")?.value || null;

      if(!username || !password) return alert("Unesi username i lozinku.");
      if((APP.db.users||[]).some(u=>u.username.toLowerCase()===username.toLowerCase())) return alert("Username već postoji.");
      if(role==="student" && !classId) return alert("Učenik mora imati razred.");

      const id=U.uid("usr");
      const rec = {
        id, username, passHash: sha256(password),
        role, fullName,
        classId: role==="student" ? classId : null,
        homeroomClassId: role==="teacher" ? hr : null
      };
      APP.db.users.push(rec);

      // if teacher homeroom, also set class.homeroomTeacherId
      if(role==="teacher" && hr){
        const c = APP.db.classes.find(x=>x.id===hr);
        if(c) c.homeroomTeacherId = id;
      }

      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="delUser"){
      const id=b.getAttribute("data-id");
      const u=APP.db.users.find(x=>x.id===id);
      if(!u) return;
      if(!confirm("Obrisati korisnika?")) return;
      APP.db.users = APP.db.users.filter(x=>x.id!==id);
      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="editUser"){
      const id=b.getAttribute("data-id");
      const u=APP.db.users.find(x=>x.id===id);
      if(!u) return;
      const nm = prompt("Novo puno ime:", u.fullName||"");
      if(nm===null) return;
      u.fullName = nm.trim();
      const np = prompt("Nova lozinka (prazno=bez promjene):", "");
      if(np) u.passHash = sha256(np);
      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="addClass"){
      const name=($("#ac_name")?.value||"").trim();
      const hr=$("#ac_hr")?.value || null;
      if(!name) return alert("Unesi naziv razreda.");
      const id=U.uid("cls");
      APP.db.classes.push({id,name, homeroomTeacherId: hr||null});
      if(hr){
        const t=APP.db.users.find(x=>x.id===hr);
        if(t) t.homeroomClassId=id;
      }
      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="delClass"){
      const id=b.getAttribute("data-id");
      if(!confirm("Obrisati razred?")) return;
      APP.db.classes = APP.db.classes.filter(c=>c.id!==id);
      // detach users
      APP.db.users.forEach(u=>{
        if(u.classId===id) u.classId=null;
        if(u.homeroomClassId===id) u.homeroomClassId=null;
      });
      delete (APP.db.schedule||{})[id];
      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="addSubject"){
      const name=($("#as_name")?.value||"").trim();
      if(!name) return alert("Unesi naziv predmeta.");
      APP.db.subjects.push({id:U.uid("sub"), name});
      await DB.save(APP.db);
      render();
      return;
    }
    if(act==="delSubject"){
      const id=b.getAttribute("data-id");
      if(!confirm("Obrisati predmet?")) return;
      APP.db.subjects = APP.db.subjects.filter(s=>s.id!==id);
      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="addRoom"){
      const name=($("#ar_name")?.value||"").trim();
      if(!name) return alert("Unesi naziv učionice.");
      APP.db.rooms.push({id:U.uid("room"), name});
      await DB.save(APP.db);
      render();
      return;
    }
    if(act==="delRoom"){
      const id=b.getAttribute("data-id");
      if(!confirm("Obrisati učionicu?")) return;
      APP.db.rooms = APP.db.rooms.filter(r=>r.id!==id);
      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="addPeriod"){
      const p=Number($("#per_p")?.value);
      const s=$("#per_s")?.value;
      const e2=$("#per_e")?.value;
      if(!p||!s||!e2) return alert("Popuni period.");
      if(U.timeToMin(e2)<=U.timeToMin(s)) return alert("Kraj mora biti poslije starta.");
      const periods = (APP.db.settings.periods||[]).filter(x=>x.p!==p).concat([{p,start:s,end:e2}]).sort((a,b)=>a.p-b.p);
      APP.db.settings.periods = periods;
      await DB.save(APP.db);
      render();
      return;
    }
    if(act==="delPeriod"){
      const p=Number(b.getAttribute("data-p"));
      APP.db.settings.periods = (APP.db.settings.periods||[]).filter(x=>x.p!==p).sort((a,b)=>a.p-b.p);
      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="pickAdminClass"){
      APP.state.adminClassPick = b.value;
      render();
      return;
    }

    if(act==="editCell"){
      openCellModal({
        classId: b.getAttribute("data-class"),
        weekday: Number(b.getAttribute("data-weekday")),
        period: Number(b.getAttribute("data-period"))
      });
      return;
    }

    if(act==="addSem"){
      const id=($("#sem_id")?.value||"").trim();
      const name=($("#sem_name")?.value||"").trim();
      const start=$("#sem_start")?.value;
      const end=$("#sem_end")?.value;
      if(!id||!name||!start||!end) return alert("Popuni sva polja.");
      if(end<start) return alert("Kraj mora biti poslije starta.");
      APP.db.settings.semesters ||= [];
      if(APP.db.settings.semesters.some(s=>s.id===id)) return alert("ID već postoji.");
      APP.db.settings.semesters.push({id,name,start,end});
      await DB.save(APP.db);
      render();
      return;
    }
    if(act==="delSem"){
      const id=b.getAttribute("data-id");
      if(!confirm("Obrisati semestar?")) return;
      APP.db.settings.semesters = (APP.db.settings.semesters||[]).filter(s=>s.id!==id);
      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="exportDB"){
      const text = JSON.stringify(APP.db, null, 2);
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));
      a.download="schoolDB.json";
      a.click();
      URL.revokeObjectURL(a.href);
      return;
    }
    if(act==="importDB"){
      const f=$("#importFile")?.files?.[0];
      if(!f) return alert("Izaberi JSON.");
      const txt=await f.text();
      try{
        const newDB=JSON.parse(txt);
        APP.db=newDB;
        await DB.save(APP.db);
        alert("Import OK.");
        render();
      }catch{
        alert("Neispravan JSON.");
      }
      return;
    }
  }

  /* ===== TEACHER ===== */
  if(me.role==="teacher"){
    if(act==="openLesson"){
      await openLessonModal({
        date: b.getAttribute("data-date"),
        classId: b.getAttribute("data-class"),
        weekday: Number(b.getAttribute("data-weekday")),
        period: Number(b.getAttribute("data-period"))
      });
      return;
    }

    if(act==="saveAttendance"){
      const date=b.getAttribute("data-date");
      const lk=b.getAttribute("data-lk");
      const classId=b.getAttribute("data-class");
      const subjectId=b.getAttribute("data-sub");

      APP.db.attendance ||= {};
      APP.db.attendance[date] ||= {};
      APP.db.attendance[date][lk] ||= {};

      APP.db.absences ||= {};
      APP.db.absences[classId] ||= {};
      APP.db.absences[classId][date] ||= {};

      // save attendance + absences
      for(const sel of $$("select[data-att-status]")){
        const sid = sel.getAttribute("data-att-status");
        const status = sel.value;
        const note = $(`input[data-att-note="${sid}"]`)?.value || "";

        APP.db.attendance[date][lk][sid] = {status,note,teacherId:me.id,markedAt:U.nowISO()};

        APP.db.absences[classId][date][sid] ||= {};
        if(status==="absent"){
          APP.db.absences[classId][date][sid][lk] = {
            studentId:sid,
            teacherId:me.id,
            subjectId,
            justified:false,
            reason:"",
            decidedBy:"",
            decidedAt:""
          };
        }else{
          delete APP.db.absences[classId][date][sid][lk];
        }
      }

      await DB.save(APP.db);
      alert("Sačuvano.");
      $("#lessonModal").classList.remove("open");
      render();
      return;
    }

    if(act==="addLessonHW"){
      const classId=b.getAttribute("data-class");
      const subjectId=b.getAttribute("data-sub");
      const due=$("#lhw_due")?.value;
      const text=($("#lhw_text")?.value||"").trim();
      if(!due||!text) return alert("Unesi rok i tekst.");

      const id=U.uid("hw");
      const rec={classId,subjectId,teacherId:me.id,dueDate:due,text,createdAt:U.nowISO()};

      APP.db.homework ||= {};
      APP.db.homework[classId] ||= {};
      APP.db.homework[classId][due] ||= {};
      APP.db.homework[classId][due][id]=rec;

      APP.db.homeworkByDue ||= {};
      APP.db.homeworkByDue[due] ||= {};
      APP.db.homeworkByDue[due][id]=rec;

      await DB.save(APP.db);
      alert("Zadaća dodana.");
      render();
      return;
    }

    if(act==="addGrade"){
      const studentId=$("#gr_st")?.value;
      const date=$("#gr_date")?.value;
      const value=Number($("#gr_val")?.value);
      const type=$("#gr_type")?.value;
      const note=$("#gr_note")?.value || "";
      const classId=b.getAttribute("data-class");
      const subjectId=b.getAttribute("data-sub");
      const semId = Domain.semesterForDate(APP.db, date);

      const gid=U.uid("g");
      APP.db.grades ||= {};
      APP.db.grades[studentId] ||= {};
      APP.db.grades[studentId][subjectId] ||= {};
      APP.db.grades[studentId][subjectId][gid] = {value,date,type,note,teacherId:me.id,classId,semesterId:semId};

      await DB.save(APP.db);
      alert("Ocjena dodana.");
      $("#gr_note").value="";
      render();
      return;
    }

    if(act==="requestSub"){
      const date=b.getAttribute("data-date");
      const lk=b.getAttribute("data-lk");
      const toTeacherId=$("#sub_toTeacher")?.value;
      const note=($("#sub_note")?.value||"").trim();

      APP.db.substitutions ||= {};
      APP.db.substitutions[date] ||= {};
      const cur = APP.db.substitutions[date][lk];
      if(cur && cur.status!=="declined") return alert("Već postoji zamjena/zahtjev.");

      APP.db.substitutions[date][lk] = {
        fromTeacherId: me.id,
        toTeacherId,
        status: "pending",
        note,
        createdAt: U.nowISO(),
        decidedAt: ""
      };

      await DB.save(APP.db);
      alert("Zahtjev poslan.");
      render();
      return;
    }

    if(act==="subAccept" || act==="subDecline"){
      const date=b.getAttribute("data-date");
      const lk=b.getAttribute("data-lk");
      const s = APP.db.substitutions?.[date]?.[lk];
      if(!s) return;
      if(s.toTeacherId!==me.id) return alert("Nemate pravo.");
      if(s.status!=="pending") return alert("Već obrađeno.");

      s.status = act==="subAccept" ? "accepted" : "declined";
      s.decidedAt = U.nowISO();

      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="addHW"){
      const classId=$("#hw_class")?.value;
      const subjectId=$("#hw_sub")?.value;
      const due=$("#hw_due")?.value;
      const text=($("#hw_text")?.value||"").trim();
      if(!classId||!subjectId||!due||!text) return alert("Popuni sva polja.");

      const id=U.uid("hw");
      const rec={classId,subjectId,teacherId:me.id,dueDate:due,text,createdAt:U.nowISO()};

      APP.db.homework ||= {};
      APP.db.homework[classId] ||= {};
      APP.db.homework[classId][due] ||= {};
      APP.db.homework[classId][due][id]=rec;

      APP.db.homeworkByDue ||= {};
      APP.db.homeworkByDue[due] ||= {};
      APP.db.homeworkByDue[due][id]=rec;

      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="delHW"){
      const due=b.getAttribute("data-due");
      const id=b.getAttribute("data-id");
      const rec = APP.db.homeworkByDue?.[due]?.[id];
      if(rec?.classId){
        delete APP.db.homework?.[rec.classId]?.[due]?.[id];
      }
      delete APP.db.homeworkByDue?.[due]?.[id];
      await DB.save(APP.db);
      render();
      return;
    }

    if(act==="toggleJustify"){
      const classId=b.getAttribute("data-class");
      const date=b.getAttribute("data-date");
      const sid=b.getAttribute("data-sid");
      const lk=b.getAttribute("data-lk");
      const just=b.getAttribute("data-just")==="1";

      const rec = APP.db.absences?.[classId]?.[date]?.[sid]?.[lk];
      if(!rec) return;

      if(!just){
        const reason = prompt("Razlog pravdanja:", rec.reason||"");
        if(reason===null) return;
        rec.justified=true;
        rec.reason=reason;
        rec.decidedBy=me.id;
        rec.decidedAt=U.nowISO();
      }else{
        if(!confirm("Označiti kao nepravdan?")) return;
        rec.justified=false;
        rec.reason="";
        rec.decidedBy=me.id;
        rec.decidedAt=U.nowISO();
      }

      await DB.save(APP.db);
      render();
      return;
    }
  }

  /* ===== REMINDERS (teacher/student) ===== */
  if(act==="addRem"){
    const date=$("#rem_date")?.value;
    const text=($("#rem_text")?.value||"").trim();
    if(!date||!text) return alert("Unesi datum i tekst.");
    const id=U.uid("rem");
    APP.db.reminders ||= {};
    APP.db.reminders[me.id] ||= {};
    APP.db.reminders[me.id][id] = {date,text,done:false,createdAt:U.nowISO()};
    await DB.save(APP.db);
    render();
    return;
  }
  if(act==="toggleRem"){
    const id=b.getAttribute("data-id");
    const r=APP.db.reminders?.[me.id]?.[id];
    if(!r) return;
    r.done = !r.done;
    await DB.save(APP.db);
    render();
    return;
  }
  if(act==="delRem"){
    const id=b.getAttribute("data-id");
    delete APP.db.reminders?.[me.id]?.[id];
    await DB.save(APP.db);
    render();
    return;
  }
});

document.addEventListener("change", (e)=>{
  const el=e.target;
  if(el.matches('input[data-act="pickDate"]')){
    APP.state.date = el.value;
    render();
  }
  if(el.matches('select[data-act="pickAdminClass"]')){
    APP.state.adminClassPick = el.value;
    render();
  }
});

// backdrop close
["helpModal","cellModal","lessonModal"].forEach(id=>{
  $("#"+id).addEventListener("click",(e)=>{ if(e.target.id===id) $("#"+id).classList.remove("open"); });
});

/* ---------------- Startup ---------------- */
firebase.database().ref(".info/connected").on("value",(snap)=>{
  $("#connPill").textContent = snap.val() ? "RTDB: connected" : "RTDB: offline";
});

(async function start(){
  // load db or seed
  let db = await DB.load();
  if(!db){
    db = seedDB();
    await DB.save(db);
  }
  APP.db = db;
  render();

  // realtime sync
  DB.subscribe((val)=>{
    if(val){
      APP.db = val;
      render();
    }
  });
})();
</script>
</body>
</html>
